# Brain production-mode stack for a single VM (testnet dev-live, Base Sepolia).
#
# Boots the API in NODE_ENV=production with all four surfaces, real on-chain
# settlement (BRAIN_BASE_CHAIN_ID=84532), an S3-compatible blob store (MinIO,
# no Azure dependency), and the production role model (RLS enforced). Unlike
# docker-compose.dev.yml this uses the built runtime image (no bind mounts, no
# watch) and applies the brain_app, brain_wiki_reader, brain_mcp_reader, and
# eight §4 least-privilege cross-tenant role split that the production boot
# fences require (brain_privileged survives only for the deploy-time seed
# one-shot).
#
#   1. cp .env.prod.example .env.prod   and fill it in (DB/MinIO passwords +
#      the C-series secrets: AUTH_JWKS_URL, BRAIN_SESSION_KEY, BASE_RPC_URL, …)
#   2. docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#      (CI pulls and retags brain-agents:prod before adding `--profile agents`;
#       for manual local testing, build that image first with:
#       docker build -t brain-agents:prod -f services/agents/Dockerfile services/agents)
#
# IMPORTANT: pass `--env-file .env.prod`. Compose reads ${VAR} interpolation
# (the DB/MinIO passwords woven into the connection URLs below) from the
# --env-file / ./.env, NOT from a service's `env_file:` entry. Using one file
# for both keeps the role passwords and the URLs that reference them in sync.
# Database role passwords and MinIO root credentials have no production
# fallback. Compose interpolation uses ${VAR:?message} for those values so an
# unset or empty secret fails before any service starts. A non-prod stack (e.g.
# staging) sets BRAIN_ENV_FILE=<its env file> inside that same --env-file file,
# so each service's env_file: resolves to the right file without a .env.prod
# symlink.
#
# Boot order is enforced by depends_on conditions:
#   postgres healthy → migrate (owner role, creates tables) completed
#                     → db-roles (creates the app roles, FORCE RLS) completed
#   minio up → minio-setup (creates the bucket) completed
#   all of the above + redis healthy → api
#
# Connection URLs are composed from passwords supplied via compose interpolation
# (the top-level ./.env file or the shell). Every *_DB_PASSWORD, the owner
# POSTGRES_PASSWORD, and the MinIO root credentials are required in production.

name: brain-prod

# Common runtime env shared by the api and worker processes (worker/process
# separation). The role-specific bits (BRAIN_HTTP_ENABLED / BRAIN_WORKERS and the
# least-privilege role URLs) are set per service so the api never receives the
# worker-only DB credentials.
x-brain-common-env: &brain-common-env
  NODE_ENV: production
  PORT: "3000"
  # SERVICE_VERSION intentionally NOT set here — it is baked into the image at
  # build time (git describe; see Dockerfile). Setting it via environment: or an
  # env_file would override the image's baked value and re-pin a stale version.
  BRAIN_BASE_CHAIN_ID: "84532"
  AUTH_JWKS_URL: http://auth:3000/.well-known/jwks.json
  AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.brain.fi}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:-brain-api}
  DATABASE_URL: postgres://brain_app:${BRAIN_APP_DB_PASSWORD:?BRAIN_APP_DB_PASSWORD is required in production}@postgres:5432/brain
  DATABASE_SSL: disable
  REDIS_URL: redis://redis:6379
  BLOB_BACKEND: s3
  BLOB_CONTAINER: brain-artifacts
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in production}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in production}
  S3_FORCE_PATH_STYLE: "true"
  # Opt-out from the production source-credential encryption fence
  # (buildCredentialKeyProvider throws when NODE_ENV=production resolves no key
  # provider). It belongs in this anchor, not in .env.prod: surface-gateway has
  # no env_file: by design, so an operator setting it there alone would leave
  # that service crash-looping on the next deploy while api and worker came up
  # fine. Defaults to false so a box that says nothing stays fail-closed.
  BRAIN_ALLOW_UNENCRYPTED_SOURCE_CREDENTIALS: ${BRAIN_ALLOW_UNENCRYPTED_SOURCE_CREDENTIALS:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brain-prod-postgres
    restart: unless-stopped
    environment:
      # The bootstrap superuser/owner. migrate connects as this role; the app
      # connects as the lower-privilege roles created by the db-roles step.
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: brain
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Create required extensions (pgcrypto for digest()/content-addressing,
      # vector for the Wiki index) on first init — runs before migrations. Only
      # executes on an empty data dir, so existing volumes need the extensions
      # created manually (CREATE EXTENSION IF NOT EXISTS ...).
      - ./tools/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: brain-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    # S3-compatible object store. Keeps the blob backend off Azure for a
    # self-contained single-VM deploy (BLOB_BACKEND=s3). Pinned by digest, not
    # by tag alone: an unpinned :latest is a supply-chain risk, since an
    # unreviewed upstream push could roll onto this VM on the next pull.
    #
    # DOWNGRADE HAZARD. MinIO stamps an on-disk format version into its data
    # volume and refuses to boot against a volume written by a newer release
    # ("Unknown xl meta version N"). Because api and worker both gate on
    # minio-setup completing, a MinIO that cannot boot takes the entire API
    # down, not just the blob path. On 2026-07-24 this pin sat at
    # RELEASE.2024-10-13 while the VM had been running :latest for weeks. The
    # first recreate downgraded MinIO and took api.brain.fi offline until it
    # was repointed at the release below.
    #
    # Operator: never lower this below the release that last wrote the volume.
    # Bump deliberately and verify the recreate on staging before production.
    # The mc client below is pinned separately; an older mc against this
    # server is fine and is what prod runs today.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: brain-prod-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in production}
    volumes:
      - minio-data:/data

  # One-shot: wait for MinIO, then create the artifacts bucket. Doubles as the
  # readiness gate for the api (minio's own image has no reliable healthcheck
  # binary across releases, so we gate on this completing instead).
  minio-setup:
    # Pinned to match the minio server release above (see that comment).
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: brain-prod-minio-setup
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in production}
      BLOB_CONTAINER: ${BLOB_CONTAINER:-brain-artifacts}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "waiting for minio..."; sleep 2;
        done
        mc mb --with-lock --ignore-existing "local/$$BLOB_CONTAINER"
        echo "bucket $$BLOB_CONTAINER ready"
    restart: "no"

  # One-shot: apply every services/*/migrations/*.sql as the owner role. The
  # runtime image carries both tools/migrate/dist and the migration SQL files
  # (see Dockerfile), so it is self-contained — no bind mount needed.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-migrate
    command: ["node", "tools/migrate/dist/cli.js", "up"]
    environment:
      DATABASE_URL: postgres://brain:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@postgres:5432/brain
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: create the application roles and FORCE RLS on tenant tables.
  # Runs AFTER migrate (the FORCE-RLS sweep only sees tables that already exist)
  # and uses the postgres image purely for its psql client. Idempotent — safe to
  # re-run across restarts (see infra/db-roles.sql).
  db-roles:
    image: pgvector/pgvector:pg16
    container_name: brain-prod-db-roles
    volumes:
      - ./infra/db-roles.sql:/db-roles.sql:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    # Role passwords are interpolated by compose at parse time (the ${..} form),
    # matching the URLs the api builds below so the credentials line up.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        psql -v ON_ERROR_STOP=1 \
          -h postgres -U brain -d brain \
          -v brain_app_password="${BRAIN_APP_DB_PASSWORD:?BRAIN_APP_DB_PASSWORD is required in production}" \
          -v brain_privileged_password="${BRAIN_PRIVILEGED_DB_PASSWORD:?BRAIN_PRIVILEGED_DB_PASSWORD is required in production}" \
          -v brain_wiki_reader_password="${BRAIN_WIKI_DB_PASSWORD:?BRAIN_WIKI_DB_PASSWORD is required in production}" \
          -v brain_mcp_reader_password="${BRAIN_MCP_READER_DB_PASSWORD:?BRAIN_MCP_READER_DB_PASSWORD is required in production}" \
          -v brain_raw_worker_password="${BRAIN_RAW_WORKER_DB_PASSWORD:?BRAIN_RAW_WORKER_DB_PASSWORD is required in production}" \
          -v brain_canonical_projector_password="${BRAIN_CANONICAL_PROJECTOR_DB_PASSWORD:?BRAIN_CANONICAL_PROJECTOR_DB_PASSWORD is required in production}" \
          -v brain_ledger_projector_password="${BRAIN_LEDGER_PROJECTOR_DB_PASSWORD:?BRAIN_LEDGER_PROJECTOR_DB_PASSWORD is required in production}" \
          -v brain_execution_worker_password="${BRAIN_EXECUTION_WORKER_DB_PASSWORD:?BRAIN_EXECUTION_WORKER_DB_PASSWORD is required in production}" \
          -v brain_audit_verifier_password="${BRAIN_AUDIT_VERIFIER_DB_PASSWORD:?BRAIN_AUDIT_VERIFIER_DB_PASSWORD is required in production}" \
          -v brain_audit_publisher_password="${BRAIN_AUDIT_PUBLISHER_DB_PASSWORD:?BRAIN_AUDIT_PUBLISHER_DB_PASSWORD is required in production}" \
          -v brain_resolver_password="${BRAIN_RESOLVER_DB_PASSWORD:?BRAIN_RESOLVER_DB_PASSWORD is required in production}" \
          -v brain_tenant_deletion_password="${BRAIN_TENANT_DELETION_DB_PASSWORD:?BRAIN_TENANT_DELETION_DB_PASSWORD is required in production}" \
          -v brain_surface_gateway_password="${BRAIN_SURFACE_GATEWAY_DB_PASSWORD:?BRAIN_SURFACE_GATEWAY_DB_PASSWORD is required in production}" \
          -v brain_surface_audit_writer_password="${BRAIN_SURFACE_GATEWAY_AUDIT_DB_PASSWORD:?BRAIN_SURFACE_GATEWAY_AUDIT_DB_PASSWORD is required in production}" \
          -v brain_auth_password="${BRAIN_AUTH_DB_PASSWORD:?BRAIN_AUTH_DB_PASSWORD is required in production}" \
          -v brain_auth_audit_writer_password="${BRAIN_AUTH_AUDIT_DB_PASSWORD:?BRAIN_AUTH_AUDIT_DB_PASSWORD is required in production}" \
          -f /db-roles.sql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Demo data seeder (profile "seed" — OFF by default; NOT for real production).
  # Populates the golden-path tenant (accounts, counterparties, invoices) + an
  # active demo policy + a registered payment agent, so the money path works
  # out-of-the-box on a fresh deploy without the signed-policy / on-chain agent
  # ceremonies. Run after the stack is up:
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml --profile seed run --rm seed
  # Set BRAIN_SEED_DEMO_GOVERNANCE=false in .env.prod to seed data only.
  seed:
    profiles: ["seed"]
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-seed
    command: ["node", "tools/seed-golden-path/dist/cli.js"]
    env_file:
      - path: ${BRAIN_ENV_FILE:-.env.prod}
        required: false
    environment:
      # brain_privileged (BYPASSRLS) so the seed can write across the tenant.
      DATABASE_URL: postgres://brain_privileged:${BRAIN_PRIVILEGED_DB_PASSWORD:?BRAIN_PRIVILEGED_DB_PASSWORD is required in production}@postgres:5432/brain
      DATABASE_SSL: disable
      BRAIN_TENANT_ID: ${BRAIN_SEED_TENANT_ID:-tnt_00000000010000000000000000}
      BRAIN_ACTOR: golden-path-seed
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # Protected-workflow-only commercial entitlement control plane. This
  # one-shot has no listener and is never part of the normal runtime profile.
  entitlement-operator:
    profiles: ["ops"]
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-entitlement-operator
    command: ["node", "services/api/dist/usage/entitlement-operator-cli.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://brain_privileged:${BRAIN_PRIVILEGED_DB_PASSWORD:?BRAIN_PRIVILEGED_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_AUDIT_DATABASE_URL: postgres://brain_app:${BRAIN_APP_DB_PASSWORD:?BRAIN_APP_DB_PASSWORD is required in production}@postgres:5432/brain
      DATABASE_SSL: disable
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  # `auth`: the OAuth 2.0 authorization server at AUTH_ISSUER (auth.brain.fi).
  # RFC 8414 metadata + JWKS discovery, real /authorize and /token (PKCE,
  # consent, code exchange, refresh rotation) via oauthCore, DCR registration,
  # and human /login + /set-password + /forgot-password (OAUTH-AS-PLAN.md
  # section 8, Phases 1-3 all shipped -- main.ts always wires oauthCore now;
  # the 503 stubs in server.ts only fire in the oauthCore === undefined branch,
  # which this compose service never takes). Phase 4 retired the standalone
  # `jwks` sidecar (tools/static-jwks) that used to publish the same
  # AUTH_SIGN_KEY on :8085; `auth` is now the single JWKS source, and
  # api/worker/surface-gateway's AUTH_JWKS_URL above points at it directly.
  #
  # Deliberately NOT env_file: ${BRAIN_ENV_FILE:-.env.prod} and NOT
  # `<<: *brain-common-env`. This process needs
  # AUTH_SIGN_KEY, AUTH_COOKIE_SECRET, a valid AUTH_ISSUER, the three
  # BRAIN_*_DB_URL role URLs below, and the EMAIL_ENDPOINT/EMAIL_API_KEY pair
  # (all boot-fenced with process.exit(1) in services/auth/src/main.ts -- see
  # .env.prod.example's C1 and C8 for the operator-facing version of this);
  # env_file would load the entire production secret set (AUDIT_PUBLISHER_KEY,
  # BRAIN_SESSION_KEY, every *_DB_PASSWORD, OPENAI_API_KEY, Slack/Teams
  # credentials) into it for no reason, and it becomes a public browser-facing
  # origin in Phase 2a (CLAUDE.md "Runtime isolation"). DATABASE_URL/REDIS_URL
  # below are unused placeholders required only because loadConfig()'s shared
  # schema validates them as URLs for every service; this service never dials
  # either. AUTH_JWKS_URL below is likewise never dialed by this process
  # itself (it publishes JWKS, it does not verify against one) -- it is set to
  # auth's own in-network address purely so the shared schema's URL validation
  # passes, not because auth calls it. Bound to 127.0.0.1 (not
  # brain-common-env's api/worker pattern of a public port): reachable only
  # through Caddy TLS, plus curl-able from the VM itself for the
  # promote-prod.yml/main.yml smokes.
  auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-auth
    restart: unless-stopped
    command: ["node", "services/auth/dist/main.js"]
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SERVICE_NAME: brain-auth
      # DATABASE_URL and REDIS_URL below remain placeholders: loadConfig()
      # requires them to parse as URLs, but this service never dials either --
      # DB access goes through BRAIN_AUTH_DB_URL / BRAIN_RESOLVER_DB_URL /
      # BRAIN_AUTH_AUDIT_DB_URL below on their own least-privilege roles, and
      # there is no Redis dependency (rate limiting is in-memory, single
      # container, per OAUTH-AS-PLAN.md section 2). This service deliberately
      # has no env_file, so no production secret beyond what is explicitly
      # listed here reaches what is a public browser-facing origin.
      DATABASE_URL: postgres://unused:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}@localhost:5432/unused
      # Required, not cosmetic. createPool defaults ssl to "auto"
      # (shared/src/db/pool.ts), which enables TLS for any host that is not
      # localhost. This service reaches Postgres by compose service name, so
      # "auto" turns TLS ON against the in-compose Postgres, which does not
      # serve TLS. Every other service opts out via the *brain-common-env
      # anchor or an explicit copy (migrate, db-roles, seed); this one has
      # neither, by design (no env_file on a public browser-facing origin),
      # so it needs its own copy. Without it the container still passes
      # /healthz, JWKS and RFC 8414 metadata (all DB-free) while every
      # DB-backed route fails with "The server does not support SSL
      # connections": login, authorize, consent, token, revoke, register.
      DATABASE_SSL: disable
      REDIS_URL: redis://localhost:6379
      AUTH_JWKS_URL: http://auth:3000/.well-known/jwks.json
      AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.brain.fi}
      # These have matching process boot fences in services/auth. Keep them as
      # compose-required interpolation too, so deploy preflight fails before
      # pulling an image or recreating a container.
      AUTH_SIGN_KEY: ${AUTH_SIGN_KEY:?AUTH_SIGN_KEY is required in production}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:?AUTH_COOKIE_SECRET is required in production}
      BRAIN_AUTH_DB_URL: postgres://brain_auth:${BRAIN_AUTH_DB_PASSWORD:?BRAIN_AUTH_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_RESOLVER_DB_URL: postgres://brain_resolver:${BRAIN_RESOLVER_DB_PASSWORD:?BRAIN_RESOLVER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_AUTH_AUDIT_DB_URL: postgres://brain_auth_audit_writer:${BRAIN_AUTH_AUDIT_DB_PASSWORD:?BRAIN_AUTH_AUDIT_DB_PASSWORD is required in production}@postgres:5432/brain
      EMAIL_ENDPOINT: ${EMAIL_ENDPOINT:?EMAIL_ENDPOINT is required in production}
      EMAIL_API_KEY: ${EMAIL_API_KEY:?EMAIL_API_KEY is required in production}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # BRAIN-99: this service builds its own on-chain scope checker
      # (services/auth/src/onchain-scope-checker.ts, wired in main.ts) to
      # verify consent-time agent scope attestations against
      # BrainMCPAgentRegistry -- the same contract api's own scope checker
      # reads. Without these two, main.ts falls back to shared/src/config.ts's
      # DEFAULTS (a stale registry address predating the 2026-08-05
      # redeploy, and the public sepolia.base.org RPC), which can silently
      # diverge from whatever api actually validates against via its
      # env_file-loaded .env.prod values. Set explicitly here, not via
      # env_file, so this public browser-facing origin still gets none of
      # the broader production secret set.
      MCP_AGENT_REGISTRY_ADDRESS: ${MCP_AGENT_REGISTRY_ADDRESS:?MCP_AGENT_REGISTRY_ADDRESS is required in production}
      BASE_RPC_URL: ${BASE_RPC_URL:?BASE_RPC_URL is required in production}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # Operator-supplied secrets (C-series): AUTH_SIGN_KEY,
    # BRAIN_SESSION_KEY, BASE_RPC_URL, BRAIN_ONCHAIN_SMART_ACCOUNT,
    # AUDIT_PUBLISHER_KEY, AUDIT_ANCHOR_ADDRESS, contract addresses,
    # OPENAI_API_KEY, etc. See .env.prod.example. (AUTH_JWKS_URL/ISSUER/AUDIENCE
    # are set below -- they point at the in-network auth service.)
    env_file:
      - path: ${BRAIN_ENV_FILE:-.env.prod}
        required: false
    environment:
      <<: *brain-common-env
      SERVICE_NAME: brain-api
      # HTTP-only (worker/process separation): serves /v1 + /health, runs NO
      # background workers (those live in the `worker` service). Only the role
      # pools its routes use are provided — never the worker-only DB credentials.
      BRAIN_HTTP_ENABLED: "true"
      BRAIN_WORKERS: none
      BRAIN_WIKI_DB_URL: postgres://brain_wiki_reader:${BRAIN_WIKI_DB_PASSWORD:?BRAIN_WIKI_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_MCP_READER_DB_URL: postgres://brain_mcp_reader:${BRAIN_MCP_READER_DB_PASSWORD:?BRAIN_MCP_READER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_RESOLVER_DB_URL: postgres://brain_resolver:${BRAIN_RESOLVER_DB_PASSWORD:?BRAIN_RESOLVER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_TENANT_DELETION_DB_URL: postgres://brain_tenant_deletion:${BRAIN_TENANT_DELETION_DB_PASSWORD:?BRAIN_TENANT_DELETION_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_AUDIT_VERIFIER_DB_URL: postgres://brain_audit_verifier:${BRAIN_AUDIT_VERIFIER_DB_PASSWORD:?BRAIN_AUDIT_VERIFIER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_SURFACE_ACTION_SECRET: ${BRAIN_SURFACE_ACTION_SECRET:-}
    # No `auth: condition: service_healthy` here: both deploy workflows recreate
    # this service with --no-deps, so compose would ignore the condition anyway
    # (the ordering is enforced by the workflow steps instead, not by compose).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  # Background workers (worker/process separation). Same image as the api, but
  # HTTP-disabled and running every worker group; the api process runs none.
  # This decouples worker uptime from api deploys/restarts and keeps the
  # worker-only DB credentials out of the public api runtime. To scale a single
  # concern independently, copy this service with BRAIN_WORKERS=<group> and only
  # that group's role URL(s). Multi-replica safe: every worker holds a per-worker
  # pg advisory lease (one active at a time, failover on crash), so running >1
  # replica gives availability without double-work.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-worker
    restart: unless-stopped
    command: ["node", "services/api/dist/main.js"]
    env_file:
      - path: ${BRAIN_ENV_FILE:-.env.prod}
        required: false
    environment:
      <<: *brain-common-env
      SERVICE_NAME: brain-worker
      BRAIN_HTTP_ENABLED: "false"
      BRAIN_WORKERS: "all"
      # Worker-only role URLs (no resolver: that is request-path only).
      BRAIN_RAW_WORKER_DB_URL: postgres://brain_raw_worker:${BRAIN_RAW_WORKER_DB_PASSWORD:?BRAIN_RAW_WORKER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_CANONICAL_PROJECTOR_DB_URL: postgres://brain_canonical_projector:${BRAIN_CANONICAL_PROJECTOR_DB_PASSWORD:?BRAIN_CANONICAL_PROJECTOR_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_LEDGER_PROJECTOR_DB_URL: postgres://brain_ledger_projector:${BRAIN_LEDGER_PROJECTOR_DB_PASSWORD:?BRAIN_LEDGER_PROJECTOR_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_EXECUTION_WORKER_DB_URL: postgres://brain_execution_worker:${BRAIN_EXECUTION_WORKER_DB_PASSWORD:?BRAIN_EXECUTION_WORKER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_AUDIT_VERIFIER_DB_URL: postgres://brain_audit_verifier:${BRAIN_AUDIT_VERIFIER_DB_PASSWORD:?BRAIN_AUDIT_VERIFIER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_AUDIT_PUBLISHER_DB_URL: postgres://brain_audit_publisher:${BRAIN_AUDIT_PUBLISHER_DB_PASSWORD:?BRAIN_AUDIT_PUBLISHER_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_TENANT_DELETION_DB_URL: postgres://brain_tenant_deletion:${BRAIN_TENANT_DELETION_DB_PASSWORD:?BRAIN_TENANT_DELETION_DB_PASSWORD is required in production}@postgres:5432/brain
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  surface-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: brain-core:${BRAIN_IMAGE_TAG:-prod}
    container_name: brain-prod-surface-gateway
    restart: unless-stopped
    command: ["node", "services/surface-gateway/dist/main.js"]
    ports:
      - "127.0.0.1:3002:3000"
    # Deliberately NOT env_file: this is a public inbound-webhook origin
    # (Slack, Teams, and email approval webhooks), matching the rationale
    # documented on the auth service block above. The explicit list below
    # already carries every Slack/Teams/email secret this service uses; it
    # has no legitimate use for AUDIT_PUBLISHER_KEY, BRAIN_SESSION_KEY, any
    # unrelated *_DB_PASSWORD, POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, or
    # OPENAI_API_KEY, and previously received all of them anyway.
    environment:
      <<: *brain-common-env
      SERVICE_NAME: brain-surface-gateway
      BRAIN_SURFACE_GATEWAY_DB_URL: postgres://brain_surface_gateway:${BRAIN_SURFACE_GATEWAY_DB_PASSWORD:?BRAIN_SURFACE_GATEWAY_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_SURFACE_GATEWAY_AUDIT_DB_URL: postgres://brain_surface_audit_writer:${BRAIN_SURFACE_GATEWAY_AUDIT_DB_PASSWORD:?BRAIN_SURFACE_GATEWAY_AUDIT_DB_PASSWORD is required in production}@postgres:5432/brain
      BRAIN_RESOLVER_DB_URL: postgres://brain_resolver:${BRAIN_RESOLVER_DB_PASSWORD:?BRAIN_RESOLVER_DB_PASSWORD is required in production}@postgres:5432/brain
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_INSTALL_STATE_SECRET: ${SLACK_INSTALL_STATE_SECRET:-}
      TEAMS_ENABLED: ${TEAMS_ENABLED:-false}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_APP_PASSWORD: ${TEAMS_APP_PASSWORD:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_APPROVAL_BASE_URL: ${EMAIL_APPROVAL_BASE_URL:-https://api.brain.fi/surfaces/email/approve}
      EMAIL_TOKEN_SECRET: ${EMAIL_TOKEN_SECRET:-}
      EMAIL_ENDPOINT: ${EMAIL_ENDPOINT:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_ESP_WEBHOOK_SECRET: ${EMAIL_ESP_WEBHOOK_SECRET:-}
      EMAIL_DOMAIN_SPF_EXPECTED: ${EMAIL_DOMAIN_SPF_EXPECTED:-}
      EMAIL_DOMAIN_DKIM_SELECTOR: ${EMAIL_DOMAIN_DKIM_SELECTOR:-}
      EMAIL_DOMAIN_DKIM_PUBLIC_KEY: ${EMAIL_DOMAIN_DKIM_PUBLIC_KEY:-}
      BRAIN_SURFACE_SMOKE_ENABLED: ${BRAIN_SURFACE_SMOKE_ENABLED:-false}
      BRAIN_SURFACE_SMOKE_SECRET: ${BRAIN_SURFACE_SMOKE_SECRET:-}
      BRAIN_SURFACE_ACTION_API_URL: http://api:3000
      BRAIN_SURFACE_ACTION_SECRET: ${BRAIN_SURFACE_ACTION_SECRET:-}
    # No `auth: condition: service_healthy` here: both deploy workflows recreate
    # this service with --no-deps, so compose would ignore the condition anyway
    # (the ordering is enforced by the workflow steps instead, not by compose).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  # Python reasoning agents. Off by default — enable with `--profile agents`.
  # This process parses untrusted tenant-uploaded PDFs, XLSX, and images and
  # shells them through OCR, so it deliberately does NOT get env_file: the
  # whole .env.prod, matching the rationale documented on the auth service
  # block above. It has no legitimate use for AUDIT_PUBLISHER_KEY,
  # BRAIN_SESSION_KEY, any *_DB_PASSWORD, POSTGRES_PASSWORD,
  # MINIO_ROOT_PASSWORD, or chat credentials, and previously received all of
  # them anyway. The env var list below is read off
  # services/agents/brain_agents/config.py (pydantic Settings) and the
  # auth.py / server.py os.environ.get() calls. OPENAI_API_KEY,
  # BRAIN_API_TOKEN, and BRAIN_AGENTS_INBOUND_SECRET are compose-required as
  # well as boot-fenced in server.py, matching the pattern used for every
  # other compose-required secret in this file.
  agents:
    profiles: ["agents"]
    image: brain-agents:${BRAIN_AGENTS_IMAGE_TAG:-prod}
    container_name: brain-prod-agents
    restart: unless-stopped
    environment:
      BRAIN_ENV: production
      NODE_ENV: production
      BRAIN_API_BASE_URL: http://api:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required in production}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_OCR_MODEL: ${OPENAI_OCR_MODEL:-gpt-4o}
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN:?BRAIN_API_TOKEN is required in production}
      BRAIN_AGENTS_INBOUND_SECRET: ${BRAIN_AGENTS_INBOUND_SECRET:?BRAIN_AGENTS_INBOUND_SECRET is required in production}
      # Anomaly autopilot scheduler: off unless BRAIN_ANOMALY_SCAN_TENANTS is set.
      BRAIN_ANOMALY_SCAN_INTERVAL_SECONDS: ${BRAIN_ANOMALY_SCAN_INTERVAL_SECONDS:-3600}
      BRAIN_ANOMALY_SCAN_TENANTS: ${BRAIN_ANOMALY_SCAN_TENANTS:-}
      BRAIN_ANOMALY_SCAN_BATCH_SIZE: ${BRAIN_ANOMALY_SCAN_BATCH_SIZE:-100}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
  minio-data:
