name: prod-payment-intent-chain-diagnostics

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Fixed production measurement window"
        required: true
        type: choice
        default: "30"
        options:
          - "30"
          - "60"
          - "90"

permissions:
  contents: read

jobs:
  diagnose:
    name: measure aggregate payment-intent chain coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: prod-payment-intent-chain-diagnostics
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      WINDOW_DAYS: ${{ inputs.window_days }}
    steps:
      - name: Validate fixed window
        shell: bash
        run: |
          set -euo pipefail
          case "$WINDOW_DAYS" in
            30|60|90) ;;
            *)
              echo "window_days must be one of: 30, 60, 90"
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed read-only aggregate diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "WINDOW_DAYS='$WINDOW_DAYS' bash -s" <<'REMOTE'
          set -euo pipefail

          case "$WINDOW_DAYS" in
            30|60|90) ;;
            *)
              echo "window_days failed remote validation" >&2
              exit 1
              ;;
          esac

          echo '::group::runtime'
          echo "window_days=$WINDOW_DAYS"
          echo "api_health=$(curl -fsS --max-time 10 https://api.brain.fi/health || true)"
          echo "api_git_sha=$(docker exec brain-prod-api printenv GIT_SHA 2>/dev/null || true)"
          echo "worker_git_sha=$(docker exec brain-prod-worker printenv GIT_SHA 2>/dev/null || true)"
          echo '::endgroup::'

          echo '::group::aggregate payment-intent chain coverage'
          docker exec -i brain-prod-postgres psql -U brain -d brain \
            -v ON_ERROR_STOP=1 \
            -v window_days="$WINDOW_DAYS" <<'SQL'
          \pset pager off
          \pset null '(null)'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '15s';
          SET LOCAL lock_timeout = '1s';

          \echo 'metric definitions'
          \echo 'created_event_count counts payment_intent.created audit events in the fixed window.'
          \echo 'created_event_missing_id_count counts those events without an ID in either outputs or inputs.'
          \echo 'complete_executed_chain_count requires one created event plus a human or automatic approval step and an executed event for the same tenant and canonical ID.'
          \echo 'disconnected_executed_chain_count considers only current ledger_payment_intents.status=executed and excludes pending or rejected intents.'

          WITH params AS (
            SELECT current_timestamp - make_interval(days => :'window_days'::integer) AS window_start
          ), created_events AS (
            SELECT ae.tenant_id,
                   ae.id AS created_event_id,
                   ae.created_at,
                   COALESCE(
                     NULLIF(ae.outputs->>'payment_intent_id', ''),
                     NULLIF(ae.inputs->>'payment_intent_id', '')
                   ) AS payment_intent_id
              FROM audit_events ae
              CROSS JOIN params p
             WHERE ae.action = 'payment_intent.created'
               AND ae.created_at >= p.window_start
          ), created_intents AS (
            SELECT DISTINCT ON (tenant_id, payment_intent_id)
                   tenant_id,
                   payment_intent_id,
                   created_at
              FROM created_events
             WHERE payment_intent_id IS NOT NULL
             ORDER BY tenant_id, payment_intent_id, created_at ASC, created_event_id ASC
          ), lifecycle_events AS (
            SELECT ci.tenant_id,
                   ci.payment_intent_id,
                   BOOL_OR(ae.action IN ('payment_intent.approved', 'payment_intent.auto_approved'))
                     OR BOOL_OR(ae.action = 'payment_intent.created' AND ae.outputs->>'status' = 'approved')
                     AS has_approval_step,
                   BOOL_OR(ae.action = 'payment_intent.executed') AS has_executed
              FROM created_intents ci
              LEFT JOIN audit_events ae
                ON ae.tenant_id = ci.tenant_id
               AND COALESCE(
                     NULLIF(ae.outputs->>'payment_intent_id', ''),
                     NULLIF(ae.inputs->>'payment_intent_id', '')
                   ) = ci.payment_intent_id
               AND ae.action IN (
                 'payment_intent.created',
                 'payment_intent.approved',
                 'payment_intent.auto_approved',
                 'payment_intent.executed'
               )
               AND ae.created_at >= ci.created_at
             GROUP BY ci.tenant_id, ci.payment_intent_id
          ), chain_rows AS (
            SELECT ci.tenant_id,
                   ci.payment_intent_id,
                   pi.status AS current_status,
                   COALESCE(le.has_approval_step, FALSE) AS has_approval_step,
                   COALESCE(le.has_executed, FALSE) AS has_executed
              FROM created_intents ci
              LEFT JOIN lifecycle_events le
                ON le.tenant_id = ci.tenant_id
               AND le.payment_intent_id = ci.payment_intent_id
              LEFT JOIN ledger_payment_intents pi
                ON pi.owner_id = ci.tenant_id
               AND pi.id = ci.payment_intent_id
          )
          SELECT (SELECT COUNT(*) FROM created_events) AS created_event_count,
                 (SELECT COUNT(*) FROM created_events WHERE payment_intent_id IS NULL)
                   AS created_event_missing_id_count,
                 ROUND(
                   100.0 * (SELECT COUNT(*) FROM created_events WHERE payment_intent_id IS NULL)
                     / NULLIF((SELECT COUNT(*) FROM created_events), 0),
                   2
                 ) AS created_event_missing_id_percent,
                 COUNT(*) AS identifiable_created_intent_count,
                 COUNT(*) FILTER (WHERE current_status IS NULL) AS created_intent_missing_ledger_row_count,
                 COUNT(*) FILTER (WHERE current_status = 'executed') AS executed_intent_count,
                 COUNT(*) FILTER (
                   WHERE current_status = 'executed' AND has_approval_step AND has_executed
                 ) AS complete_executed_chain_count,
                 COUNT(*) FILTER (
                   WHERE current_status = 'executed' AND NOT (has_approval_step AND has_executed)
                 ) AS disconnected_executed_chain_count,
                 COUNT(*) FILTER (
                   WHERE current_status = 'executed' AND NOT has_approval_step
                 ) AS executed_chain_missing_approval_count,
                 COUNT(*) FILTER (
                   WHERE current_status = 'executed' AND NOT has_executed
                 ) AS executed_chain_missing_execution_event_count,
                 ROUND(
                   100.0 * COUNT(*) FILTER (
                     WHERE current_status = 'executed' AND has_approval_step AND has_executed
                   ) / NULLIF(COUNT(*) FILTER (WHERE current_status = 'executed'), 0),
                   2
                 ) AS complete_executed_chain_percent,
                 ROUND(
                   100.0 * COUNT(*) FILTER (
                     WHERE current_status = 'executed' AND NOT (has_approval_step AND has_executed)
                   ) / NULLIF(COUNT(*) FILTER (WHERE current_status = 'executed'), 0),
                   2
                 ) AS disconnected_executed_chain_percent
            FROM chain_rows;

          \echo 'identifiable created intents by current status'
          WITH params AS (
            SELECT current_timestamp - make_interval(days => :'window_days'::integer) AS window_start
          ), created_intents AS (
            SELECT DISTINCT ON (ae.tenant_id, payment_intent_id)
                   ae.tenant_id,
                   payment_intent_id
              FROM (
                SELECT ae.tenant_id,
                       ae.id,
                       ae.created_at,
                       COALESCE(
                         NULLIF(ae.outputs->>'payment_intent_id', ''),
                         NULLIF(ae.inputs->>'payment_intent_id', '')
                       ) AS payment_intent_id
                  FROM audit_events ae
                  CROSS JOIN params p
                 WHERE ae.action = 'payment_intent.created'
                   AND ae.created_at >= p.window_start
              ) ae
             WHERE payment_intent_id IS NOT NULL
             ORDER BY ae.tenant_id, payment_intent_id, ae.created_at ASC, ae.id ASC
          )
          SELECT COALESCE(pi.status, '(missing ledger row)') AS current_status,
                 COUNT(*) AS identifiable_created_intent_count
            FROM created_intents ci
            LEFT JOIN ledger_payment_intents pi
              ON pi.owner_id = ci.tenant_id
             AND pi.id = ci.payment_intent_id
           GROUP BY 1
           ORDER BY 1;

          \echo 'execution record state consistency across current executed payment intents'
          SELECT e.status AS execution_status,
                 COUNT(*) AS execution_row_count,
                 COUNT(*) FILTER (WHERE e.completed_at IS NULL) AS missing_completed_at_count
            FROM executions e
            JOIN ledger_payment_intents pi
              ON pi.owner_id = e.tenant_id
             AND pi.id = e.proposal_id
           WHERE pi.status = 'executed'
           GROUP BY e.status
           ORDER BY e.status;

          COMMIT;
          SQL
          echo '::endgroup::'
          REMOTE
