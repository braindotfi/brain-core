name: ops-staging-anchor-cycle-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: verify demo exclusion and adaptive anchor cycle on staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      API_BASE: https://staging-api.brain.fi
      ROOT_COUNT: "50"
      MAX_WAIT_SECONDS: "3600"
    steps:
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Exercise demo exclusion and root-count cycle close
        shell: bash
        run: |
          set -euo pipefail
          smoke_output="$(ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' API_BASE='$API_BASE' ROOT_COUNT='$ROOT_COUNT' MAX_WAIT_SECONDS='$MAX_WAIT_SECONDS' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          set -a
          . "./$VM_ENV_FILE"
          set +a
          if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
            echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on staging" >&2
            exit 1
          fi

          api_commit="$(curl -fsS "$API_BASE/health" | docker exec -i brain-prod-api node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => { process.stdout.write(JSON.parse(body).commit ?? ""); });
          ')"
          worker_sha="$(docker exec brain-prod-worker printenv GIT_SHA)"
          echo "staging_api_commit=$api_commit"
          echo "staging_worker_git_sha=$worker_sha"
          echo "anchor_smoke_phase=demo"

          create_tenant() {
            local mode="$1"
            docker exec brain-prod-api node -e '
              const { randomUUID } = require("node:crypto");
              const mode = process.argv[1];
              const suffix = randomUUID().replace(/-/g, "");
              process.stdout.write(JSON.stringify({
                company_name: `Anchor cycle smoke ${mode}`,
                founder: {
                  email: `anchor-cycle-${mode}+${suffix}@brain.invalid`,
                  display_name: "Anchor Cycle Smoke",
                },
                founder_external_ref: `anchor-cycle-smoke:${mode}:${suffix}`,
                demo_seed: mode === "demo",
              }));
            ' "$mode"
          }

          create_response() {
            local payload="$1"
            printf '%s' "$payload" | curl -fsS --retry 2 --connect-timeout 10 --max-time 120 \
              -X POST "$API_BASE/v1/tenants" \
              -H "Content-Type: application/json" \
              -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
              --data-binary @-
          }

          parse_response_field() {
            local field="$1"
            docker exec -i brain-prod-api node -e '
              const field = process.argv[1];
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                const value = field === "session_token" ? parsed.session?.token : parsed[field];
                if (typeof value !== "string" || value.length === 0) process.exit(1);
                process.stdout.write(value);
              });
            ' "$field"
          }

          demo_response="$(create_response "$(create_tenant demo)")"
          demo_tenant_id="$(printf '%s' "$demo_response" | parse_response_field tenant_id)"
          demo_session_token="$(printf '%s' "$demo_response" | parse_response_field session_token)"
          demo_anchor="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
            "$API_BASE/v1/audit/anchor/latest" \
            -H "Authorization: Bearer ${demo_session_token}")"
          printf '%s' "$demo_anchor" | docker exec -i brain-prod-api node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const parsed = JSON.parse(body);
              if (parsed.anchoring_mode !== "db_only" || parsed.guarantee !== "database_hash_chain") process.exit(1);
            });
          '
          demo_anchor_rows="$(docker exec -i brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM audit_anchors WHERE tenant_id = '${demo_tenant_id}';")"
          if [[ "$demo_anchor_rows" != "0" ]]; then
            echo "Expected no audit_anchors row for DB-only demo tenant $demo_tenant_id, found $demo_anchor_rows" >&2
            exit 1
          fi
          echo "demo_tenant_id=$demo_tenant_id"
          echo "demo_anchor_status=db_only_database_hash_chain"
          echo "demo_onchain_anchor_rows=0"
          echo "anchor_smoke_phase=onchain_batch"

          started_epoch="$(date +%s)"
          tenant_ids=()
          for _ in $(seq 1 "$ROOT_COUNT"); do
            response="$(create_response "$(create_tenant onchain)")"
            tenant_id="$(printf '%s' "$response" | parse_response_field tenant_id)"
            if [[ ! "$tenant_id" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
              echo "Invalid smoke tenant id: $tenant_id" >&2
              exit 1
            fi
            tenant_ids+=("$tenant_id")
          done
          ids_sql="'$(IFS="','"; echo "${tenant_ids[*]}")'"
          echo "onchain_smoke_tenant_count=${#tenant_ids[@]}"

          created_event_count="$(docker exec -i brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM audit_events WHERE tenant_id IN (${ids_sql}) AND action = 'tenant.created';")"
          if [[ "$created_event_count" != "$ROOT_COUNT" ]]; then
            echo "Expected $ROOT_COUNT tenant.created events, found $created_event_count" >&2
            exit 1
          fi

          anchored_summary=""
          for _ in $(seq 1 30); do
            anchored_summary="$(docker exec -i brain-prod-postgres psql -U brain -d brain -At -F '|' -v ON_ERROR_STOP=1 \
              -c "SELECT COUNT(*) FILTER (WHERE onchain_tx_hash IS NOT NULL), COUNT(DISTINCT onchain_tx_hash), COALESCE(MAX(EXTRACT(EPOCH FROM (created_at - to_timestamp(${started_epoch})))::bigint), 0) FROM audit_anchors WHERE tenant_id IN (${ids_sql});")"
            IFS='|' read -r anchored_count tx_count elapsed_seconds <<< "$anchored_summary"
            if [[ "$anchored_count" == "$ROOT_COUNT" && "$tx_count" == "1" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "${anchored_count:-0}" != "$ROOT_COUNT" || "${tx_count:-0}" != "1" ]]; then
            echo "Expected one confirmed batch covering all $ROOT_COUNT on-chain smoke tenants; got '$anchored_summary'" >&2
            exit 1
          fi
          if (( elapsed_seconds >= MAX_WAIT_SECONDS )); then
            echo "Anchor cycle did not close before max wait: elapsed=${elapsed_seconds}s" >&2
            exit 1
          fi
          echo "onchain_confirmed_anchor_rows=$anchored_count"
          echo "onchain_batch_transaction_count=$tx_count"
          echo "early_cycle_seconds=$elapsed_seconds"
          echo "anchor_smoke_complete=1"
          REMOTE
          )"
          printf '%s\n' "$smoke_output"
          grep -qx 'anchor_smoke_complete=1' <<< "$smoke_output"
