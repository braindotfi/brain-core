name: ops-staging-anchor-cycle-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: verify demo exclusion and adaptive anchor cycle on staging
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      API_BASE: https://staging-api.brain.fi
      ROOT_COUNT: "50"
      MAX_SMOKE_BATCH_TRANSACTIONS: "2"
      MAX_WAIT_SECONDS: "3600"
    steps:
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Exercise demo exclusion and root-count cycle close
        shell: bash
        run: |
          set -euo pipefail
          smoke_output="$(ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' API_BASE='$API_BASE' ROOT_COUNT='$ROOT_COUNT' MAX_SMOKE_BATCH_TRANSACTIONS='$MAX_SMOKE_BATCH_TRANSACTIONS' MAX_WAIT_SECONDS='$MAX_WAIT_SECONDS' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'echo "anchor_smoke_failure_line=${LINENO}" >&2' ERR

          cd ~/brain-core
          set -a
          . "./$VM_ENV_FILE"
          set +a
          if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
            echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on staging" >&2
            exit 1
          fi

          api_commit="$(curl -fsS "$API_BASE/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""), end="")')"
          worker_sha="$(docker exec brain-prod-worker printenv GIT_SHA)"
          echo "staging_api_commit=$api_commit"
          echo "staging_worker_git_sha=$worker_sha"
          echo "anchor_smoke_phase=demo"

          create_tenant() {
            local mode="$1"
            local suffix demo_seed
            suffix="${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
            if [[ "$mode" == "demo" ]]; then
              demo_seed=true
            else
              demo_seed=false
            fi
            printf '{"company_name":"Anchor cycle smoke %s","founder":{"email":"anchor-cycle-%s+%s@brain.invalid","display_name":"Anchor Cycle Smoke"},"founder_external_ref":"anchor-cycle-smoke:%s:%s","demo_seed":%s}' \
              "$mode" "$mode" "$suffix" "$mode" "$suffix" "$demo_seed"
          }

          create_response() {
            local payload="$1"
            local response_file status
            response_file="$(mktemp)"
            status="$(printf '%s' "$payload" | curl -sS --retry 2 --connect-timeout 10 --max-time 120 \
              -X POST "$API_BASE/v1/tenants" \
              -H "Content-Type: application/json" \
              -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
              --data-binary @- \
              --output "$response_file" \
              --write-out '%{http_code}' || true)"
            if [[ "$status" != "201" ]]; then
              rm -f "$response_file"
              echo "tenant_create_http_status=${status:-transport_error}" >&2
              return 1
            fi
            cat "$response_file"
            rm -f "$response_file"
          }

          parse_response_field() {
            local field="$1"
            python3 -c 'import json,sys; field=sys.argv[1]; payload=json.load(sys.stdin); value=payload.get("session",{}).get("token") if field=="session_token" else payload.get(field); isinstance(value,str) and bool(value) or sys.exit(1); print(value,end="")' "$field"
          }

          echo "anchor_smoke_phase=demo_tenant_create"
          demo_payload="$(create_tenant demo)"
          echo "anchor_smoke_phase=demo_tenant_request"
          demo_response_file="$(mktemp)"
          demo_create_status="$(printf '%s' "$demo_payload" | curl -sS --retry 2 --connect-timeout 10 --max-time 120 \
            -X POST "$API_BASE/v1/tenants" \
            -H "Content-Type: application/json" \
            -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
            --data-binary @- \
            --output "$demo_response_file" \
            --write-out '%{http_code}' || true)"
          echo "demo_tenant_create_http_status=${demo_create_status:-transport_error}"
          if [[ "$demo_create_status" != "201" ]]; then
            rm -f "$demo_response_file"
            exit 1
          fi
          demo_response="$(cat "$demo_response_file")"
          rm -f "$demo_response_file"
          demo_tenant_id="$(printf '%s' "$demo_response" | parse_response_field tenant_id)"
          demo_session_token="$(printf '%s' "$demo_response" | parse_response_field session_token)"
          demo_anchor="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
            "$API_BASE/v1/audit/anchor/latest" \
            -H "Authorization: Bearer ${demo_session_token}")"
          printf '%s' "$demo_anchor" | python3 -c 'import json,sys; payload=json.load(sys.stdin); payload.get("anchoring_mode")=="db_only" and payload.get("guarantee")=="database_hash_chain" or sys.exit(1)'
          demo_anchor_rows="$(docker exec brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM audit_anchors WHERE tenant_id = '${demo_tenant_id}';")"
          if [[ "$demo_anchor_rows" != "0" ]]; then
            echo "Expected no audit_anchors row for DB-only demo tenant $demo_tenant_id, found $demo_anchor_rows" >&2
            exit 1
          fi
          echo "demo_tenant_id=$demo_tenant_id"
          echo "demo_anchor_status=db_only_database_hash_chain"
          echo "demo_onchain_anchor_rows=0"
          echo "anchor_smoke_phase=onchain_batch"

          started_epoch="$(date +%s)"
          tenant_ids=()
          for _ in $(seq 1 "$ROOT_COUNT"); do
            tenant_payload="$(create_tenant onchain)"
            response="$(create_response "$tenant_payload")"
            tenant_id="$(printf '%s' "$response" | parse_response_field tenant_id)"
            if [[ ! "$tenant_id" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
              echo "Invalid smoke tenant id: $tenant_id" >&2
              exit 1
            fi
            tenant_ids+=("$tenant_id")
          done
          ids_sql="$(printf "'%s'," "${tenant_ids[@]}")"
          ids_sql="${ids_sql%,}"
          echo "onchain_smoke_tenant_count=${#tenant_ids[@]}"

          created_event_count="$(docker exec brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) FROM audit_events WHERE tenant_id IN (${ids_sql}) AND action = 'tenant.created';")"
          if [[ "$created_event_count" != "$ROOT_COUNT" ]]; then
            echo "Expected $ROOT_COUNT tenant.created events, found $created_event_count" >&2
            exit 1
          fi

          anchored_summary=""
          for _ in $(seq 1 30); do
            anchored_summary="$(docker exec brain-prod-postgres psql -U brain -d brain -At -F '|' -v ON_ERROR_STOP=1 \
              -c "WITH smoke_rows AS (SELECT tenant_id, onchain_tx_hash, created_at FROM audit_anchors WHERE tenant_id IN (${ids_sql})), involved_transactions AS (SELECT DISTINCT onchain_tx_hash FROM smoke_rows WHERE onchain_tx_hash IS NOT NULL), batch_sizes AS (SELECT a.onchain_tx_hash, COUNT(*) AS tenant_roots FROM audit_anchors a JOIN involved_transactions t ON t.onchain_tx_hash = a.onchain_tx_hash GROUP BY a.onchain_tx_hash) SELECT COUNT(*) FILTER (WHERE onchain_tx_hash IS NOT NULL), COUNT(DISTINCT onchain_tx_hash), COALESCE(MAX(EXTRACT(EPOCH FROM (created_at - to_timestamp(${started_epoch})))::bigint), 0), COALESCE((SELECT MAX(tenant_roots) FROM batch_sizes), 0), COALESCE((SELECT SUM(tenant_roots) FROM batch_sizes), 0) - COUNT(*) FILTER (WHERE onchain_tx_hash IS NOT NULL) FROM smoke_rows;")"
            IFS='|' read -r anchored_count tx_count elapsed_seconds max_batch_roots ambient_root_count <<< "$anchored_summary"
            if [[ "$anchored_count" == "$ROOT_COUNT" && "$tx_count" -ge 1 && "$tx_count" -le "$MAX_SMOKE_BATCH_TRANSACTIONS" && "$max_batch_roots" -le "$ROOT_COUNT" ]]; then
              break
            fi
            sleep 10
          done

          if [[ "${anchored_count:-0}" != "$ROOT_COUNT" || "${tx_count:-0}" -lt 1 || "${tx_count:-0}" -gt "$MAX_SMOKE_BATCH_TRANSACTIONS" || "${max_batch_roots:-0}" -gt "$ROOT_COUNT" ]]; then
            echo "Expected all $ROOT_COUNT smoke roots in one or two cap-$ROOT_COUNT transactions; got '$anchored_summary'" >&2
            exit 1
          fi
          if [[ "$tx_count" == "2" && "${ambient_root_count:-0}" -lt 1 ]]; then
            echo "Smoke roots split across two transactions without a co-batched staging root; got '$anchored_summary'" >&2
            exit 1
          fi
          if (( elapsed_seconds >= MAX_WAIT_SECONDS )); then
            echo "Anchor cycle did not close before max wait: elapsed=${elapsed_seconds}s" >&2
            exit 1
          fi
          echo "onchain_confirmed_anchor_rows=$anchored_count"
          echo "onchain_batch_transaction_count=$tx_count"
          echo "onchain_batch_max_tenant_roots=$max_batch_roots"
          echo "onchain_batch_ambient_tenant_roots=$ambient_root_count"
          echo "early_cycle_seconds=$elapsed_seconds"
          echo "anchor_smoke_complete=1"
          REMOTE
          )"
          printf '%s\n' "$smoke_output"
          grep -qx 'anchor_smoke_complete=1' <<< "$smoke_output"
