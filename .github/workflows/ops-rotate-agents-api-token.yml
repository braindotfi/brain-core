name: ops-rotate-agents-api-token

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target whose extraction-agent credential will be rotated."
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  rotate:
    name: rotate ${{ inputs.target }} extraction-agent API token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    env:
      VM_HOST: ${{ inputs.target == 'production' && secrets.VM_HOST || secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ inputs.target == 'production' && secrets.VM_SSH_KEY || secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: ${{ inputs.target == 'production' && '.env.prod' || '.env.staging' }}
      COMPOSE_PROJECT: ${{ inputs.target == 'production' && 'brain-prod' || 'brain-staging' }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Rotate raw-write agent token and wait for agents health
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file_status=missing"
            exit 1
          fi
          if ! docker inspect -f '{{.State.Running}}' brain-prod-api 2>/dev/null | grep -qx true; then
            echo "api_container_status=not_running"
            exit 1
          fi

          # The runtime image intentionally installs dependencies per workspace.
          # Use the bundled token tool so its `jose` import resolves from its
          # own workspace rather than assuming it is available at /app.
          token="$(docker exec brain-prod-api node tools/dev-token/dist/index.js \
            --tenant tnt_00000000010000000000000000 \
            --principal agent_00000000020000000000000001 \
            --principal-type agent \
            --scopes raw:write \
            --ttl 31536000)"
          if [[ "$token" != *.*.* ]]; then
            echo "agents_api_token_status=mint_failed"
            exit 1
          fi

          tmp="$(mktemp)"
          chmod --reference="$VM_ENV_FILE" "$tmp"
          awk -v token="$token" '
            BEGIN { replaced = 0 }
            /^BRAIN_API_TOKEN=/ {
              if (replaced == 0) {
                print "BRAIN_API_TOKEN=" token
                replaced = 1
              }
              next
            }
            { print }
            END {
              if (replaced == 0) print "BRAIN_API_TOKEN=" token
            }
          ' "$VM_ENV_FILE" > "$tmp"
          mv "$tmp" "$VM_ENV_FILE"

          compose_files='-f docker-compose.prod.yml'
          [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
          compose="docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE $compose_files --profile agents"
          $compose up -d --no-deps --force-recreate agents

          for _ in $(seq 1 18); do
            status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' brain-prod-agents 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              echo "agents_api_token_status=rotated"
              echo "agents_container_health=healthy"
              echo "agents_api_token_ttl_days=365"
              exit 0
            fi
            sleep 5
          done

          echo "agents_api_token_status=rotated_but_agents_unhealthy"
          docker logs --tail=100 brain-prod-agents >&2 || true
          exit 1
          REMOTE
