name: staging-diagnostics

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Fixed staging diagnostic to run."
        required: true
        type: choice
        options:
          - counterparty-trust-gate-impact
          - upload-pipeline-state
      tenant_ids:
        description: "Optional comma-separated canonical tenant ids. Empty reports all staging tenants."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  diagnose:
    name: run fixed staging diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Match the staging deploy group so diagnostics never overlap a deploy.
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      DIAGNOSTIC: ${{ inputs.diagnostic }}
      TENANT_IDS: ${{ inputs.tenant_ids }}
    steps:
      - name: Validate fixed diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DIAGNOSTIC" != "counterparty-trust-gate-impact" && "$DIAGNOSTIC" != "upload-pipeline-state" ]]; then
            echo "diagnostic must be counterparty-trust-gate-impact or upload-pipeline-state"
            exit 1
          fi

          if [[ ${#TENANT_IDS} -gt 540 ]]; then
            echo "tenant_ids must be 540 characters or less"
            exit 1
          fi
          if [[ -n "$TENANT_IDS" ]]; then
            IFS=',' read -r -a tenant_ids <<< "$TENANT_IDS"
            if [[ ${#tenant_ids[@]} -gt 20 ]]; then
              echo "tenant_ids accepts at most 20 ids"
              exit 1
            fi
            for tenant_id in "${tenant_ids[@]}"; do
              if [[ ! "$tenant_id" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
                echo "every tenant_ids entry must match ^tnt_[0-9A-HJKMNP-TV-Z]{26}$"
                exit 1
              fi
            done
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile fixed report for stdin execution
        if: inputs.diagnostic == 'counterparty-trust-gate-impact'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/staging-diagnostics"
          report_source=""
          case "$DIAGNOSTIC" in
            counterparty-trust-gate-impact)
              report_source="scripts/ops/report-counterparty-trust-gate-impact.ts"
              ;;
            upload-pipeline-state)
              report_source="scripts/ops/report-upload-pipeline-state.ts"
              ;;
            *)
              echo "unsupported diagnostic: $DIAGNOSTIC"
              exit 1
              ;;
          esac
          pnpm exec tsc \
            --target es2022 \
            --module es2022 \
            --moduleResolution bundler \
            --skipLibCheck \
            --esModuleInterop \
            --outDir "$RUNNER_TEMP/staging-diagnostics" \
            "$report_source"
          echo "REPORT_SCRIPT=$RUNNER_TEMP/staging-diagnostics/$(basename "${report_source%.ts}").js" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Print staging worker SHA
        shell: bash
        run: |
          set -euo pipefail
          worker_sha="$(ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "docker exec brain-prod-worker printenv GIT_SHA")"
          echo "staging_git_sha=$worker_sha"

      - name: Run fixed staging diagnostic
        shell: bash
        run: |
          set -euo pipefail

          run_upload_pipeline_report() {
            local tenant_id="$1"
            ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
              "TENANT_ID='$tenant_id' bash -s" <<'REMOTE'
            set -euo pipefail
            docker exec -i brain-prod-postgres psql -U brain -d brain \
              -v ON_ERROR_STOP=1 -v tenant_id="$TENANT_ID" <<'SQL'
            \pset pager off
            \pset null '(null)'
            BEGIN TRANSACTION READ ONLY;

            \echo 'raw_artifacts'
            SELECT ra.id AS raw_artifact_id,
                   ra.source_ref->>'filename' AS filename,
                   ra.source_type,
                   ra.mime_type,
                   ra.projection_status,
                   ej.status AS extraction_status,
                   ej.attempt_count,
                   ej.parsed_id,
                   ej.error->>'code' AS extraction_error_code,
                   rp.parser,
                   rp.parser_version,
                   rp.extracted->>'object_type' AS object_type,
                   cpl.projector,
                   cpl.records_written,
                   cpl.error AS canonical_error,
                   cpl.quarantined
              FROM raw_artifacts ra
              LEFT JOIN LATERAL (
                SELECT status, attempt_count, parsed_id, error
                  FROM extraction_jobs
                 WHERE tenant_id = ra.tenant_id AND raw_id = ra.id
                 ORDER BY updated_at DESC
                 LIMIT 1
              ) ej ON true
              LEFT JOIN raw_parsed rp ON rp.id = ej.parsed_id AND rp.tenant_id = ra.tenant_id
              LEFT JOIN canonical_projection_log cpl ON cpl.raw_parsed_id = rp.id
             WHERE ra.tenant_id = :'tenant_id'
             ORDER BY ra.ingested_at ASC, ra.id ASC;

            \echo 'canonical_obligations'
            SELECT source_system, source_natural_key, direction, type, amount, currency, due_date, status,
                   source_ids, evidence_ids
              FROM canonical_obligation
             WHERE tenant_id = :'tenant_id'
             ORDER BY updated_at ASC, id ASC;

            \echo 'ledger_obligations'
            SELECT lo.id, lo.type, lo.direction, lo.amount_due, lo.currency, lo.due_date, lo.status,
                   cp.name AS counterparty_name, lo.source_ids, lo.evidence_ids
              FROM ledger_obligations lo
              LEFT JOIN ledger_counterparties cp ON cp.owner_id = lo.owner_id AND cp.id = lo.counterparty_id
             WHERE lo.owner_id = :'tenant_id'
             ORDER BY lo.due_date ASC, lo.id ASC;

            \echo 'ledger_invoices'
            SELECT li.id, li.invoice_number, li.amount_due, li.currency, li.due_date, li.status,
                   cp.name AS counterparty_name, li.source_ids, li.evidence_ids
              FROM ledger_invoices li
              LEFT JOIN ledger_counterparties cp ON cp.owner_id = li.owner_id AND cp.id = li.counterparty_id
             WHERE li.owner_id = :'tenant_id'
             ORDER BY li.due_date ASC, li.id ASC;

            \echo 'ledger_transaction_count'
            SELECT count(*)::int AS count FROM ledger_transactions WHERE owner_id = :'tenant_id';
            COMMIT;
            SQL
            REMOTE
          }

          if [[ "$DIAGNOSTIC" == "upload-pipeline-state" ]]; then
            if [[ -z "$TENANT_IDS" ]]; then
              echo "upload-pipeline-state requires tenant_ids"
              exit 1
            fi
            IFS=',' read -r -a tenant_ids <<< "$TENANT_IDS"
            for tenant_id in "${tenant_ids[@]}"; do
              echo "tenant_id=$tenant_id"
              run_upload_pipeline_report "$tenant_id"
            done
            exit 0
          fi

          run_report() {
            local tenant_id="$1"
            local remote_command
            # The worker owns the scoped ledger-projector URL assembled by Compose.
            remote_command="docker exec -i -w /app/services/api brain-prod-worker node --input-type=module -"
            if [[ -n "$tenant_id" ]]; then
              remote_command+=" --tenant-id '$tenant_id'"
            fi
            cat "$REPORT_SCRIPT" | ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 \
              "azureuser@$VM_HOST" "$remote_command"
          }

          if [[ -z "$TENANT_IDS" ]]; then
            run_report ""
            exit 0
          fi

          IFS=',' read -r -a tenant_ids <<< "$TENANT_IDS"
          for tenant_id in "${tenant_ids[@]}"; do
            echo "tenant_id=$tenant_id"
            run_report "$tenant_id"
          done
