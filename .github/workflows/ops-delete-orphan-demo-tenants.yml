name: ops-verify-commercial-demo-retirement-second-abort

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type VERIFY_1519_COMMERCIAL_DEMO_TENANTS_SECOND_ABORT for the fixed read-only check."
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify the second commercial demo retirement abort
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-tenant-deletion
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out the fixed verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate explicit confirmation
        shell: bash
        run: |
          if [[ "$CONFIRMATION" != "VERIFY_1519_COMMERCIAL_DEMO_TENANTS_SECOND_ABORT" ]]; then
            echo "confirmation must equal VERIFY_1519_COMMERCIAL_DEMO_TENANTS_SECOND_ABORT"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Verify abort preservation and worker recovery
        shell: bash
        run: scripts/ops/verify-commercial-demo-retirement-second-abort.sh
