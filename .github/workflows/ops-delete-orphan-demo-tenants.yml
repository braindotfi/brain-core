name: ops-delete-orphan-demo-tenants

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE_1519_COMMERCIAL_DEMO_TENANTS to run the approved commercial demo retirement."
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    name: retire the fixed commercial demo tenant set
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    concurrency:
      group: production-tenant-deletion
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out the fixed cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate explicit confirmation
        shell: bash
        run: |
          if [[ "$CONFIRMATION" != "DELETE_1519_COMMERCIAL_DEMO_TENANTS" ]]; then
            echo "confirmation must equal DELETE_1519_COMMERCIAL_DEMO_TENANTS"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Fence, preflight, retire, purge, and reconcile
        shell: bash
        run: scripts/ops/run-commercial-demo-retirement.sh

      - name: Upload retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-demo-retirement-execution
          path: commercial-demo-retirement-execution/
          if-no-files-found: warn
          retention-days: 30
