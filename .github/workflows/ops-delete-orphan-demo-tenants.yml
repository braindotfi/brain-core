name: ops-restore-tenant-deletion-runtime-compat

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESTORE_TENANT_DELETION_RUNTIME_COMPAT to revoke the one incompatible production grant and restart workers."
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    name: restore production worker role compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-tenant-deletion
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out recovery script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate explicit confirmation
        shell: bash
        run: |
          if [[ "$CONFIRMATION" != "RESTORE_TENANT_DELETION_RUNTIME_COMPAT" ]]; then
            echo "confirmation must equal RESTORE_TENANT_DELETION_RUNTIME_COMPAT"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Revoke incompatible grant and restore worker health
        shell: bash
        run: scripts/ops/restore-tenant-deletion-runtime-compat.sh
