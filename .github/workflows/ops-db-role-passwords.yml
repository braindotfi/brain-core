name: ops-db-role-passwords

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect or repair."
        required: true
        type: choice
        options:
          - staging
          - production
          - both
      mode:
        description: "inspect reports status only; ensure generates missing or blank role passwords and reapplies db-roles."
        required: true
        type: choice
        options:
          - inspect
          - ensure
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    name: staging DB role passwords
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'staging' || inputs.target == 'both'
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      COMPOSE_PROJECT: brain-staging
      # docker-compose.prod.yml hard-codes container_name: brain-prod-postgres.
      POSTGRES_CONTAINER: brain-prod-postgres
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure DB role passwords
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' POSTGRES_CONTAINER='$POSTGRES_CONTAINER' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi

          vars=(
            BRAIN_APP_DB_PASSWORD
            BRAIN_PRIVILEGED_DB_PASSWORD
            BRAIN_WIKI_DB_PASSWORD
            BRAIN_MCP_READER_DB_PASSWORD
            BRAIN_RAW_WORKER_DB_PASSWORD
            BRAIN_CANONICAL_PROJECTOR_DB_PASSWORD
            BRAIN_LEDGER_PROJECTOR_DB_PASSWORD
            BRAIN_EXECUTION_WORKER_DB_PASSWORD
            BRAIN_AUDIT_VERIFIER_DB_PASSWORD
            BRAIN_AUDIT_PUBLISHER_DB_PASSWORD
            BRAIN_RESOLVER_DB_PASSWORD
            BRAIN_TENANT_DELETION_DB_PASSWORD
            BRAIN_SURFACE_GATEWAY_DB_PASSWORD
            BRAIN_SURFACE_GATEWAY_AUDIT_DB_PASSWORD
            BRAIN_AUTH_DB_PASSWORD
            BRAIN_AUTH_AUDIT_DB_PASSWORD
          )
          roles=(
            brain_app
            brain_privileged
            brain_wiki_reader
            brain_mcp_reader
            brain_raw_worker
            brain_canonical_projector
            brain_ledger_projector
            brain_execution_worker
            brain_audit_verifier
            brain_audit_publisher
            brain_resolver
            brain_tenant_deletion
            brain_surface_gateway
            brain_surface_audit_writer
            brain_auth
            brain_auth_audit_writer
          )

          tmp="$(mktemp)"
          cp "$VM_ENV_FILE" "$tmp"
          chmod --reference="$VM_ENV_FILE" "$tmp"

          echo "env_file=$VM_ENV_FILE"
          for i in "${!vars[@]}"; do
            key="${vars[$i]}"
            role="${roles[$i]}"
            line="$(grep -E "^${key}=" "$tmp" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              status="missing"
            elif [[ "$line" == "${key}=" ]]; then
              status="blank"
            else
              status="present"
            fi

            role_exists="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${role}');" 2>/dev/null || echo unknown)"

            if [[ "$MODE" == "ensure" && "$status" != "present" ]]; then
              secret="$(openssl rand -hex 32)"
              next="$(mktemp)"
              chmod --reference="$VM_ENV_FILE" "$next"
              awk -v key="$key" -v secret="$secret" '
                BEGIN { replaced = 0 }
                $0 ~ "^" key "=" {
                  if (replaced == 0) {
                    print key "=" secret
                    replaced = 1
                  }
                  next
                }
                { print }
                END {
                  if (replaced == 0) {
                    print key "=" secret
                  }
                }
              ' "$tmp" > "$next"
              mv "$next" "$tmp"
              status="generated_from_${status}"
            fi

            echo "${key}_status=$status"
            echo "${role}_role_exists_before=$role_exists"
          done

          if [[ "$MODE" == "ensure" ]]; then
            mv "$tmp" "$VM_ENV_FILE"
            compose_files='-f docker-compose.prod.yml'
            [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
            docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files run --rm --no-deps db-roles
            for role in "${roles[@]}"; do
              role_exists="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${role}');")"
              echo "${role}_role_exists_after=$role_exists"
            done
          else
            rm "$tmp"
          fi
          REMOTE

  production:
    name: production DB role passwords
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'production' || inputs.target == 'both'
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_ENV_FILE: .env.prod
      COMPOSE_PROJECT: brain-prod
      POSTGRES_CONTAINER: brain-prod-postgres
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure DB role passwords
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' POSTGRES_CONTAINER='$POSTGRES_CONTAINER' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi

          vars=(
            BRAIN_APP_DB_PASSWORD
            BRAIN_PRIVILEGED_DB_PASSWORD
            BRAIN_WIKI_DB_PASSWORD
            BRAIN_MCP_READER_DB_PASSWORD
            BRAIN_RAW_WORKER_DB_PASSWORD
            BRAIN_CANONICAL_PROJECTOR_DB_PASSWORD
            BRAIN_LEDGER_PROJECTOR_DB_PASSWORD
            BRAIN_EXECUTION_WORKER_DB_PASSWORD
            BRAIN_AUDIT_VERIFIER_DB_PASSWORD
            BRAIN_AUDIT_PUBLISHER_DB_PASSWORD
            BRAIN_RESOLVER_DB_PASSWORD
            BRAIN_TENANT_DELETION_DB_PASSWORD
            BRAIN_SURFACE_GATEWAY_DB_PASSWORD
            BRAIN_SURFACE_GATEWAY_AUDIT_DB_PASSWORD
            BRAIN_AUTH_DB_PASSWORD
            BRAIN_AUTH_AUDIT_DB_PASSWORD
          )
          roles=(
            brain_app
            brain_privileged
            brain_wiki_reader
            brain_mcp_reader
            brain_raw_worker
            brain_canonical_projector
            brain_ledger_projector
            brain_execution_worker
            brain_audit_verifier
            brain_audit_publisher
            brain_resolver
            brain_tenant_deletion
            brain_surface_gateway
            brain_surface_audit_writer
            brain_auth
            brain_auth_audit_writer
          )

          tmp="$(mktemp)"
          cp "$VM_ENV_FILE" "$tmp"
          chmod --reference="$VM_ENV_FILE" "$tmp"

          echo "env_file=$VM_ENV_FILE"
          for i in "${!vars[@]}"; do
            key="${vars[$i]}"
            role="${roles[$i]}"
            line="$(grep -E "^${key}=" "$tmp" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              status="missing"
            elif [[ "$line" == "${key}=" ]]; then
              status="blank"
            else
              status="present"
            fi

            role_exists="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${role}');" 2>/dev/null || echo unknown)"

            if [[ "$MODE" == "ensure" && "$status" != "present" ]]; then
              secret="$(openssl rand -hex 32)"
              next="$(mktemp)"
              chmod --reference="$VM_ENV_FILE" "$next"
              awk -v key="$key" -v secret="$secret" '
                BEGIN { replaced = 0 }
                $0 ~ "^" key "=" {
                  if (replaced == 0) {
                    print key "=" secret
                    replaced = 1
                  }
                  next
                }
                { print }
                END {
                  if (replaced == 0) {
                    print key "=" secret
                  }
                }
              ' "$tmp" > "$next"
              mv "$next" "$tmp"
              status="generated_from_${status}"
            fi

            echo "${key}_status=$status"
            echo "${role}_role_exists_before=$role_exists"
          done

          if [[ "$MODE" == "ensure" ]]; then
            mv "$tmp" "$VM_ENV_FILE"
            compose_files='-f docker-compose.prod.yml'
            [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
            docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files run --rm --no-deps db-roles
            for role in "${roles[@]}"; do
              role_exists="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '${role}');")"
              echo "${role}_role_exists_after=$role_exists"
            done
          else
            rm "$tmp"
          fi
          REMOTE
