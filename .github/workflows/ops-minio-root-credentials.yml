          echo "MINIO_ROOT_USER_status=$user_status"
          echo "MINIO_ROOT_PASSWORD_status=$password_status"
          echo "S3_ACCESS_KEY_ID_source=MINIO_ROOT_USER"
          echo "S3_SECRET_ACCESS_KEY_source=MINIO_ROOT_PASSWORD"
          REMOTE
