name: ops-minio-root-credentials

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect or repair."
        required: true
        type: choice
        options:
          - staging
          - production
          - both
      mode:
        description: "inspect reports status only; ensure generates missing, blank, or weak MinIO root credentials."
        required: true
        type: choice
        options:
          - inspect
          - ensure
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    name: staging MinIO root credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'staging' || inputs.target == 'both'
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure MinIO root credentials
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi

          status_for() {
            local key="$1"
            local line value normalized
            line="$(grep -E "^${key}=" "$VM_ENV_FILE" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              echo missing
              return
            fi
            if [[ "$line" == "${key}=" ]]; then
              echo blank
              return
            fi
            value="${line#${key}=}"
            normalized="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              brain|postgres|changeme|password|brainminio|minioadmin)
                echo weak_default
                ;;
              *)
                echo present_strong
                ;;
            esac
          }

          replace_or_append() {
            local key="$1"
            local value="$2"
            local input="$3"
            local output="$4"
            awk -v key="$key" -v value="$value" '
              BEGIN { replaced = 0 }
              $0 ~ "^" key "=" {
                if (replaced == 0) {
                  print key "=" value
                  replaced = 1
                }
                next
              }
              { print }
              END {
                if (replaced == 0) {
                  print key "=" value
                }
              }
            ' "$input" > "$output"
          }

          user_status="$(status_for MINIO_ROOT_USER)"
          password_status="$(status_for MINIO_ROOT_PASSWORD)"

          if [[ "$MODE" == "ensure" && ( "$user_status" != "present_strong" || "$password_status" != "present_strong" ) ]]; then
            tmp="$(mktemp)"
            next="$(mktemp)"
            cp "$VM_ENV_FILE" "$tmp"
            chmod --reference="$VM_ENV_FILE" "$tmp" "$next"

            if [[ "$user_status" != "present_strong" ]]; then
              root_user="brainminio_$(openssl rand -hex 16)"
              replace_or_append MINIO_ROOT_USER "$root_user" "$tmp" "$next"
              mv "$next" "$tmp"
              next="$(mktemp)"
              chmod --reference="$VM_ENV_FILE" "$next"
              user_status="generated_from_${user_status}"
            fi
            if [[ "$password_status" != "present_strong" ]]; then
              root_password="$(openssl rand -hex 32)"
              replace_or_append MINIO_ROOT_PASSWORD "$root_password" "$tmp" "$next"
              mv "$next" "$tmp"
              password_status="generated_from_${password_status}"
            else
              rm "$next"
            fi
            mv "$tmp" "$VM_ENV_FILE"
          fi

          echo "env_file=$VM_ENV_FILE"
          echo "MINIO_ROOT_USER_status=$user_status"
          echo "MINIO_ROOT_PASSWORD_status=$password_status"
          echo "S3_ACCESS_KEY_ID_source=MINIO_ROOT_USER"
          echo "S3_SECRET_ACCESS_KEY_source=MINIO_ROOT_PASSWORD"
          REMOTE

  production:
    name: production MinIO root credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'production' || inputs.target == 'both'
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_ENV_FILE: .env.prod
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure MinIO root credentials
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi

          status_for() {
            local key="$1"
            local line value normalized
            line="$(grep -E "^${key}=" "$VM_ENV_FILE" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              echo missing
              return
            fi
            if [[ "$line" == "${key}=" ]]; then
              echo blank
              return
            fi
            value="${line#${key}=}"
            normalized="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              brain|postgres|changeme|password|brainminio|minioadmin)
                echo weak_default
                ;;
              *)
                echo present_strong
                ;;
            esac
          }

          replace_or_append() {
            local key="$1"
            local value="$2"
            local input="$3"
            local output="$4"
            awk -v key="$key" -v value="$value" '
              BEGIN { replaced = 0 }
              $0 ~ "^" key "=" {
                if (replaced == 0) {
                  print key "=" value
                  replaced = 1
                }
                next
              }
              { print }
              END {
                if (replaced == 0) {
                  print key "=" value
                }
              }
            ' "$input" > "$output"
          }

          user_status="$(status_for MINIO_ROOT_USER)"
          password_status="$(status_for MINIO_ROOT_PASSWORD)"

          if [[ "$MODE" == "ensure" && ( "$user_status" != "present_strong" || "$password_status" != "present_strong" ) ]]; then
            tmp="$(mktemp)"
            next="$(mktemp)"
            cp "$VM_ENV_FILE" "$tmp"
            chmod --reference="$VM_ENV_FILE" "$tmp" "$next"

            if [[ "$user_status" != "present_strong" ]]; then
