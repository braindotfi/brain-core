name: ops-delete-staging-exhausted-trust-gate-fixture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    name: delete fixed exhausted staging trust-gate fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      API_BASE: https://staging-api.brain.fi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Delete only the exhausted isolated fixture tenant
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "API_BASE='$API_BASE' bash -s" <<'REMOTE'
          set -euo pipefail
          readonly tenant_id='tnt_01KZX2QQZVES2W2Y05AJHKCGQ0'
          readonly payment_intent_id='pi_01KZX2QVAXXX3855S4E7HFCJF0'
          readonly outbox_id='exo_01KZX2QW53P9MQGJZEZ02GZBC9'

          preflight="$(docker exec -i brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 <<SQL
          SELECT json_build_object(
            'tenant_rows', (SELECT count(*) FROM tenants WHERE id = '${tenant_id}'),
            'demo_seeded', EXISTS (
              SELECT 1 FROM audit_events
               WHERE tenant_id = '${tenant_id}'
                 AND action = 'tenant.demo_seeded'
            ),
            'intent_status', (
              SELECT status FROM ledger_payment_intents
               WHERE owner_id = '${tenant_id}' AND id = '${payment_intent_id}'
            ),
            'outbox_status', (
              SELECT status FROM execution_outbox
               WHERE tenant_id = '${tenant_id}' AND id = '${outbox_id}'
            ),
            'outbox_attempt_count', (
              SELECT attempt_count FROM execution_outbox
               WHERE tenant_id = '${tenant_id}' AND id = '${outbox_id}'
            ),
            'outbox_execution_id', (
              SELECT execution_id FROM execution_outbox
               WHERE tenant_id = '${tenant_id}' AND id = '${outbox_id}'
            ),
            'outbox_rail_receipt', (
              SELECT rail_receipt FROM execution_outbox
               WHERE tenant_id = '${tenant_id}' AND id = '${outbox_id}'
            ),
            'execution_rows', (SELECT count(*) FROM executions WHERE tenant_id = '${tenant_id}')
          );
          SQL
          )"
          echo "fixture_delete_preflight=$preflight"
          printf '%s' "$preflight" | docker exec -i brain-prod-api node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              const valid = value.tenant_rows === 1 && value.demo_seeded === true &&
                value.intent_status === "dispatching" && value.outbox_status === "reconciling" &&
                value.outbox_attempt_count === 12 && value.outbox_execution_id === null &&
                value.outbox_rail_receipt === null && value.execution_rows === 0;
              if (!valid) process.exit(1);
            });
          '

          member_id="$(docker exec brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 -c "SELECT id FROM members WHERE tenant_id = '${tenant_id}' AND role = 'admin' AND active = TRUE AND status = 'active' ORDER BY id LIMIT 1;")"
          if [[ ! "$member_id" =~ ^(usr|mem)_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "fixture tenant has no active admin member" >&2
            exit 1
          fi

          member_token="$(docker exec -w /app/services/api -e FIXTURE_TENANT_ID="$tenant_id" -e FIXTURE_MEMBER_ID="$member_id" brain-prod-api node --input-type=module -e '
            import { JwtSigner, newTokenId } from "@brain/shared";
            const key = JSON.parse(process.env.AUTH_SIGN_KEY);
            const signer = new JwtSigner({ issuer: process.env.AUTH_ISSUER, audience: process.env.AUTH_AUDIENCE, key, algorithm: key.alg ?? "HS256" });
            process.stdout.write(await signer.sign({ id: process.env.FIXTURE_MEMBER_ID, type: "user", tenantId: process.env.FIXTURE_TENANT_ID, tokenId: newTokenId(), expiresAt: Math.floor(Date.now() / 1000) + 300, scopes: ["execution:admin"] }));
          ')"

          delete_status="$(curl -sS --connect-timeout 10 --max-time 60 -o /tmp/fixture-delete-response.json -w '%{http_code}' -X DELETE "$API_BASE/v1/tenants/$tenant_id" -H 'Content-Type: application/json' -H "Authorization: Bearer $member_token" --data "{\"confirm\":\"$tenant_id\"}")"
          delete_response="$(cat /tmp/fixture-delete-response.json)"
          echo "fixture_delete_status=$delete_status"
          echo "fixture_delete_response=$delete_response"
          if [[ "$delete_status" != "200" ]]; then
            echo "fixture tenant delete did not return 200" >&2
            exit 1
          fi

          postflight="$(docker exec -i brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 <<SQL
          SELECT json_build_object(
            'tenant_rows', (SELECT count(*) FROM tenants WHERE id = '${tenant_id}'),
            'payment_intent_rows', (SELECT count(*) FROM ledger_payment_intents WHERE owner_id = '${tenant_id}' AND id = '${payment_intent_id}'),
            'outbox_rows', (SELECT count(*) FROM execution_outbox WHERE tenant_id = '${tenant_id}' AND id = '${outbox_id}'),
            'execution_rows', (SELECT count(*) FROM executions WHERE tenant_id = '${tenant_id}')
          );
          SQL
          )"
          echo "fixture_delete_postflight=$postflight"
          printf '%s' "$postflight" | docker exec -i brain-prod-api node -e '
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (value.tenant_rows !== 0 || value.payment_intent_rows !== 0 || value.outbox_rows !== 0 || value.execution_rows !== 0) process.exit(1);
            });
          '
          echo 'exhausted_trust_gate_fixture_delete_complete'
          REMOTE
