name: ops-agent-activity-feed-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: staging agent activity audit smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      API_BASE: https://staging-api.brain.fi
    steps:
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Exercise agent workflows and print isolated audit rows
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' API_BASE='$API_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          set -a
          . "./$VM_ENV_FILE"
          set +a
          : "${BRAIN_PLATFORM_SERVICE_SECRET:?BRAIN_PLATFORM_SERVICE_SECRET is required}"

          create_payload="$(
            docker exec brain-prod-api node -e '
              const { randomUUID } = require("node:crypto");
              const suffix = randomUUID().replace(/-/g, "");
              process.stdout.write(JSON.stringify({
                company_name: "Agent activity audit smoke",
                founder: {
                  email: `agent-activity-smoke+${suffix}@brain.invalid`,
                  display_name: "Agent Activity Smoke",
                },
                founder_external_ref: `agent-activity-smoke:${suffix}`,
                demo_seed: true,
              }));
            '
          )"
          create_response="$(
            printf '%s' "$create_payload" | curl -fsS --retry 2 --connect-timeout 10 --max-time 90 \
              -X POST "$API_BASE/v1/tenants" \
              -H "Content-Type: application/json" \
              -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
              --data-binary @-
          )"
          smoke_tenant_id="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (!/^tnt_[0-9A-HJKMNP-TV-Z]{26}$/.test(parsed.tenant_id ?? "")) process.exit(1);
                process.stdout.write(parsed.tenant_id);
              });
            '
          )"
          smoke_agent_token="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.agent?.token !== "string" || parsed.agent.token.length === 0) process.exit(1);
                process.stdout.write(parsed.agent.token);
              });
            '
          )"

          ids="$(
            docker exec -i brain-prod-postgres psql -U brain -d brain -At -v ON_ERROR_STOP=1 \
              -v tenant_id="$smoke_tenant_id" <<'SQL'
            SELECT json_build_object(
              'invoice_id', (SELECT id FROM ledger_invoices WHERE owner_id = :'tenant_id' AND metadata->>'scenario' = 'ar' ORDER BY due_date LIMIT 1),
              'obligation_id', (SELECT id FROM ledger_obligations WHERE owner_id = :'tenant_id' AND direction = 'payable' ORDER BY due_date LIMIT 1),
              'counterparty_id', (SELECT id FROM ledger_counterparties WHERE owner_id = :'tenant_id' AND type = 'vendor' ORDER BY id LIMIT 1),
              'account_id', (SELECT id FROM ledger_accounts WHERE owner_id = :'tenant_id' ORDER BY id LIMIT 1),
              'transaction_id', (SELECT id FROM ledger_transactions WHERE owner_id = :'tenant_id' ORDER BY transaction_date LIMIT 1)
            )::text;
            SQL
          )"

          invoke() {
            local label="$1"
            local body="$2"
            local response
            response="$(
              printf '%s' "$body" | curl -fsS --retry 2 --connect-timeout 10 --max-time 60 \
                -X POST "$API_BASE/v1/agents/run" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer ${smoke_agent_token}" \
                --data-binary @-
            )"
            printf '%s' "$response" | LABEL="$label" docker exec -i -e LABEL brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                console.log(JSON.stringify({
                  workflow: process.env.LABEL,
                  selected_agent_id: parsed.selected_agent_id ?? null,
                  status: parsed.status ?? null,
                  action: parsed.action ?? null,
                  run_id: parsed.run_id ?? null,
                  proposal_id: parsed.proposed?.id ?? null,
                }));
              });
            '
          }

          collections_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "invoice.overdue", context: { invoice_id: ids.invoice_id, counterparty_id: ids.counterparty_id, counterparty_name: "Activity Smoke Customer", invoice_number: "ACTIVITY-AR-1", amount: "100.00", currency: "USD", days_overdue: 30 } }));
            });
          ')"
          cash_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "forecast.requested", context: { account_id: ids.account_id, available_cash: { currency: "USD", value: "100000.00" }, receivables: [], payables: [] } }));
            });
          ')"
          treasury_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "cash.balance_high", context: { account_id: ids.account_id, source_account_id: ids.account_id, available_cash: { currency: "USD", value: "100000.00" }, amount: { currency: "USD", value: "1000.00" } } }));
            });
          ')"
          vendor_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "vendor.created", context: { vendor_id: ids.counterparty_id, counterparty_id: ids.counterparty_id, vendor_name: "Activity Smoke Vendor", identity_resolved: true, verified_status: "unverified" } }));
            });
          ')"
          fraud_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "transaction.unusual", context: { transaction_id: ids.transaction_id, account_id: ids.account_id, counterparty_id: ids.counterparty_id, counterparty_name: "Activity Smoke Vendor", amount: "9999.00", currency: "USD", transaction_date: "2026-08-09", history_count: 4, account_mean_amount: 10 } }));
            });
          ')"
          payment_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "bill.due_soon", context: { obligation_id: ids.obligation_id, counterparty_id: ids.counterparty_id, counterparty_name: "Activity Smoke Vendor", amount: { currency: "USD", value: "100.00" }, available_cash: { currency: "USD", value: "100000.00" }, payables: [{ obligation_id: ids.obligation_id, counterparty_id: ids.counterparty_id, amount: { currency: "USD", value: "100.00" } }] } }));
            });
          ')"
          close_body="$(printf '%s' "$ids" | docker exec -i brain-prod-api node -e '
            let body = ""; process.stdin.on("data", c => { body += c; }); process.stdin.on("end", () => {
              const ids = JSON.parse(body);
              process.stdout.write(JSON.stringify({ event: "transaction.unreconciled", context: { transaction_id: ids.transaction_id, counterparty_id: ids.counterparty_id, counterparty_name: "Activity Smoke Customer", direction: "inflow", amount: "100.00", currency: "USD", candidates: [] } }));
            });
          ')"

          invoke collections "$collections_body"
          invoke cash_forecast "$cash_body"
          invoke treasury "$treasury_body"
          invoke vendor_risk "$vendor_body"
          invoke fraud_anomaly "$fraud_body"
          invoke payment "$payment_body"
          invoke reconciliation "$close_body"

          echo "smoke_tenant_id=$smoke_tenant_id"
          docker exec -i brain-prod-postgres psql -U brain -d brain -v ON_ERROR_STOP=1 \
            -v tenant_id="$smoke_tenant_id" <<'SQL'
          \pset pager off
          \pset null '(null)'
          \echo 'agent audit entries'
          SELECT id, created_at, event_type, severity, actor, action, inputs, outputs
            FROM audit_events
           WHERE tenant_id = :'tenant_id'
             AND layer = 'agent'
           ORDER BY created_at ASC, id ASC;
          \echo 'agent run outcomes'
          SELECT id, agent_id, event_type, action, status, execution_mode, confidence, evidence_score, failure_reason, created_at
            FROM agent_runs
           WHERE tenant_id = :'tenant_id'
           ORDER BY created_at ASC, id ASC;
          SQL
          REMOTE
