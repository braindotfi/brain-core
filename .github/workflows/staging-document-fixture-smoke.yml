name: staging-document-fixture-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ingest core-owned document fixtures on staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      API_BASE: https://staging-api.brain.fi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Materialize core-owned fixture bundle
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/brain-core-staging-document-smoke"
          node scripts/ops/write-staging-document-smoke-fixtures.mjs --output-dir "$fixture_dir"
          echo "FIXTURE_DIR=$fixture_dir" >> "$GITHUB_ENV"

      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Upload fixtures to staging VM
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="/tmp/brain-core-document-smoke-${{ github.run_id }}"
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "rm -rf '$remote_dir' && mkdir -p '$remote_dir'"
          scp -i ~/.ssh/id_deploy "$FIXTURE_DIR"/* "azureuser@$VM_HOST:$remote_dir/"
          echo "REMOTE_FIXTURE_DIR=$remote_dir" >> "$GITHUB_ENV"

      - name: Provision and process isolated staging tenant
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' API_BASE='$API_BASE' REMOTE_FIXTURE_DIR='$REMOTE_FIXTURE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'rm -rf "$REMOTE_FIXTURE_DIR"' EXIT

          cd ~/brain-core
          set -a
          . "./$VM_ENV_FILE"
          set +a
          if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
            echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on staging" >&2
            exit 1
          fi

          create_payload="$(
            docker exec brain-prod-api node -e '
              const { randomUUID } = require("node:crypto");
              const suffix = randomUUID().replace(/-/g, "");
              process.stdout.write(JSON.stringify({
                company_name: "Core staging document fixture smoke",
                founder: {
                  email: `core-document-smoke+${suffix}@brain.invalid`,
                  display_name: "Core Document Fixture Smoke",
                },
                founder_external_ref: `core-document-smoke:${suffix}`,
                demo_seed: false,
              }));
            '
          )"
          create_response="$(
            printf '%s' "$create_payload" | curl -fsS --retry 2 --connect-timeout 10 --max-time 90 \
              -X POST "$API_BASE/v1/tenants" \
              -H "Content-Type: application/json" \
              -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
              --data-binary @-
          )"
          smoke_tenant_id="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.tenant_id !== "string" || !/^tnt_[0-9A-HJKMNP-TV-Z]{26}$/.test(parsed.tenant_id)) process.exit(1);
                process.stdout.write(parsed.tenant_id);
              });
            '
          )"
          smoke_agent_token="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.agent?.token !== "string" || parsed.agent.token.length === 0) process.exit(1);
                process.stdout.write(parsed.agent.token);
              });
            '
          )"

          upload_fixture() {
            local filename="$1"
            local source_type="$2"
            local mime_type="$3"
            local response
            response="$(
              curl -fsS --retry 2 --connect-timeout 10 --max-time 90 \
                -X POST "$API_BASE/v1/raw/ingest" \
                -H "Authorization: Bearer ${smoke_agent_token}" \
                -F "source_type=${source_type}" \
                -F "source_ref={\"filename\":\"${filename}\",\"fixture_origin\":\"brain_core_staging_smoke\"}" \
                -F "mime_type=${mime_type}" \
                -F "file=@${REMOTE_FIXTURE_DIR}/${filename};type=${mime_type}"
            )"
            printf '%s' "$response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.raw_id !== "string" || !/^raw_[0-9A-HJKMNP-TV-Z]{26}$/.test(parsed.raw_id)) process.exit(1);
                process.stdout.write(parsed.raw_id);
              });
            '
          }

          trigger_extraction() {
            local filename="$1"
            local raw_id="$2"
            local response status_body http_status extraction_status
            response="$(
              curl -sS --retry 2 --connect-timeout 10 --max-time 600 -w $'\n%{http_code}' \
                -X POST "$API_BASE/v1/raw/$raw_id/extract" \
                -H "Authorization: Bearer ${smoke_agent_token}"
            )"
            http_status="${response##*$'\n'}"
            status_body="${response%$'\n'*}"
            if [[ "$http_status" != "200" && "$http_status" != "202" ]]; then
              printf 'fixture=%s raw_id=%s extraction_trigger_http_status=%s body=%s\n' \
                "$filename" "$raw_id" "$http_status" "$status_body" >&2
              return 1
            fi
            extraction_status="$(read_status "$status_body" extraction)"
            printf 'fixture=%s raw_id=%s extraction_trigger_status=%s\n' \
              "$filename" "$raw_id" "$extraction_status"
          }

          read_status() {
            local json="$1"
            local field="$2"
            printf '%s' "$json" | FIELD="$field" docker exec -i -e FIELD brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(body);
                const result = process.env.FIELD === "projection"
                  ? value.projection_status ?? "pending"
                  : value.status ?? "unavailable";
                process.stdout.write(String(result ?? ""));
              });
            '
          }

          read_parsed_count() {
            local json="$1"
            printf '%s' "$json" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(body);
                process.stdout.write(String(Array.isArray(value.parsed) ? value.parsed.length : 0));
              });
            '
          }

          form_1120_raw_id="$(upload_fixture form_1120_2025.pdf pdf_upload application/pdf)"
          crypto_wallet_raw_id="$(upload_fixture crypto_wallet_2026-08-04.csv csv_upload text/csv)"
          payroll_raw_id="$(upload_fixture payroll_register_2026-08-04.xlsx csv_upload application/vnd.openxmlformats-officedocument.spreadsheetml.sheet)"
          ar_aging_raw_id="$(upload_fixture ar_aging_2026-08-04.xlsx csv_upload application/vnd.openxmlformats-officedocument.spreadsheetml.sheet)"

          # The core ingest drain handles the two registered spreadsheet parsers.
          # Generic tax and wallet inputs deliberately fall through to the external
          # document extractor, which requires this explicit job trigger.
          trigger_extraction form_1120_2025.pdf "$form_1120_raw_id"
          trigger_extraction crypto_wallet_2026-08-04.csv "$crypto_wallet_raw_id"

          printf 'smoke_tenant_id=%s\n' "$smoke_tenant_id"
          filenames=(
            form_1120_2025.pdf
            crypto_wallet_2026-08-04.csv
            payroll_register_2026-08-04.xlsx
            ar_aging_2026-08-04.xlsx
          )
          raw_ids=(
            "$form_1120_raw_id"
            "$crypto_wallet_raw_id"
            "$payroll_raw_id"
            "$ar_aging_raw_id"
          )
          last_states=("" "" "" "")
          completed=(false false false false)
          terminal_count=0

          for attempt in $(seq 1 72); do
            for index in "${!filenames[@]}"; do
              if [[ "${completed[$index]}" == "true" ]]; then
                continue
              fi
              filename="${filenames[$index]}"
              raw_id="${raw_ids[$index]}"
              artifact="$(curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer ${smoke_agent_token}" "$API_BASE/v1/raw/$raw_id")"
              parsed="$(curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer ${smoke_agent_token}" "$API_BASE/v1/raw/$raw_id/parsed")"
              projection_status="$(read_status "$artifact" projection)"
              parsed_count="$(read_parsed_count "$parsed")"
              state="projection_status=${projection_status} parsed_count=${parsed_count}"
              if [[ "$state" != "${last_states[$index]}" ]]; then
                printf 'fixture=%s raw_id=%s %s\n' "$filename" "$raw_id" "$state"
                last_states[$index]="$state"
              fi
              if [[ "$projection_status" == "projected" && "$parsed_count" -gt 0 ]]; then
                printf 'fixture=%s raw_id=%s terminal=processed %s\n' "$filename" "$raw_id" "$state"
                completed[$index]=true
                terminal_count=$((terminal_count + 1))
              elif [[ "$projection_status" == "projection_failed" ]]; then
                printf 'fixture=%s raw_id=%s terminal=failed %s\n' "$filename" "$raw_id" "$state" >&2
                exit 1
              fi
            done
            if [[ "$terminal_count" -eq 4 ]]; then
              exit 0
            fi
            sleep 10
          done

          for index in "${!filenames[@]}"; do
            if [[ "${completed[$index]}" != "true" ]]; then
              printf 'fixture=%s raw_id=%s terminal=timed_out %s\n' \
                "${filenames[$index]}" "${raw_ids[$index]}" "${last_states[$index]}" >&2
            fi
          done
          exit 1
          REMOTE

      - name: Report staging worker SHA
        shell: bash
        run: |
          set -euo pipefail
          worker_sha="$(ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "docker exec brain-prod-worker printenv GIT_SHA")"
          echo "staging_worker_git_sha=$worker_sha"
