name: ops-staging-northstar-demo-seed

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed-and-validate:
    name: seed and validate isolated Northstar staging tenant
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      API_BASE: https://staging-api.brain.fi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
      - name: Configure staging SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Copy fixed staging scripts
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy \
            scripts/ops/run-northstar-staging-seed.sh \
            scripts/ops/validate-northstar-staging.mjs \
            scripts/ops/probe-northstar-presentation.mjs \
            "azureuser@$VM_HOST:/tmp/"
      - name: Seed, validate, and probe isolated staging tenant
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' API_BASE='$API_BASE' VALIDATOR_PATH=/tmp/validate-northstar-staging.mjs PRESENTATION_PROBE_PATH=/tmp/probe-northstar-presentation.mjs bash /tmp/run-northstar-staging-seed.sh; rc=\$?; rm -f /tmp/run-northstar-staging-seed.sh /tmp/validate-northstar-staging.mjs /tmp/probe-northstar-presentation.mjs; exit \$rc"
