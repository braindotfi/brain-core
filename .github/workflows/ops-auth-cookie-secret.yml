name: ops-auth-cookie-secret

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect or repair."
        required: true
        type: choice
        options:
          - staging
          - production
          - both
      mode:
        description: "inspect reports status only; ensure generates a missing or blank secret."
        required: true
        type: choice
        options:
          - inspect
          - ensure
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    name: staging AUTH_COOKIE_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'staging' || inputs.target == 'both'
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      COMPOSE_PROJECT: brain-staging
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure auth cookie secret
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "auth_cookie_secret_status=env_file_missing"
            exit 1
          fi

          current_line="$(grep -E '^AUTH_COOKIE_SECRET=' "$VM_ENV_FILE" | tail -n 1 || true)"
          if [[ -z "$current_line" ]]; then
            status="missing"
          elif [[ "$current_line" == "AUTH_COOKIE_SECRET=" ]]; then
            status="blank"
          else
            status="present"
          fi

          if [[ "$MODE" == "ensure" && "$status" != "present" ]]; then
            secret="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            chmod --reference="$VM_ENV_FILE" "$tmp"
            if [[ "$status" == "missing" ]]; then
              cp "$VM_ENV_FILE" "$tmp"
              printf '\nAUTH_COOKIE_SECRET=%s\n' "$secret" >> "$tmp"
            else
              awk -v secret="$secret" '
                BEGIN { replaced = 0 }
                /^AUTH_COOKIE_SECRET=/ {
                  if (replaced == 0) {
                    print "AUTH_COOKIE_SECRET=" secret
                    replaced = 1
                  }
                  next
                }
                { print }
                END {
                  if (replaced == 0) {
                    print "AUTH_COOKIE_SECRET=" secret
                  }
                }
              ' "$VM_ENV_FILE" > "$tmp"
            fi
            mv "$tmp" "$VM_ENV_FILE"
            status="generated_from_${status}"
          fi

          echo "env_file=$VM_ENV_FILE"
          echo "auth_cookie_secret_status=$status"

          if [[ "$MODE" == "ensure" ]]; then
            compose_files='-f docker-compose.prod.yml'
            [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
            services="$(docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents config --services)"
            if echo "$services" | grep -qx auth; then
              docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files up -d --no-deps --no-build auth
              last_commit=""
              for _ in $(seq 1 10); do
                body="$(curl -s http://localhost:3003/healthz || true)"
                last_commit="$(echo "$body" | grep -o '"commit":"[^"]*"' | sed 's/.*:"//;s/"$//')"
                [[ -n "$last_commit" ]] && break
                sleep 6
              done
              echo "auth_local_health_commit=$last_commit"
              if [[ -z "$last_commit" ]]; then
                echo "auth_local_health_status=unhealthy"
                exit 1
              fi
              echo "auth_local_health_status=healthy"
            else
              echo "auth_service=not_defined"
            fi
          fi
          REMOTE

  production:
    name: production AUTH_COOKIE_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'production' || inputs.target == 'both'
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_ENV_FILE: .env.prod
      COMPOSE_PROJECT: brain-prod
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure auth cookie secret
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "auth_cookie_secret_status=env_file_missing"
            exit 1
          fi

          current_line="$(grep -E '^AUTH_COOKIE_SECRET=' "$VM_ENV_FILE" | tail -n 1 || true)"
          if [[ -z "$current_line" ]]; then
            status="missing"
          elif [[ "$current_line" == "AUTH_COOKIE_SECRET=" ]]; then
            status="blank"
          else
            status="present"
          fi

          if [[ "$MODE" == "ensure" && "$status" != "present" ]]; then
            secret="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            chmod --reference="$VM_ENV_FILE" "$tmp"
            if [[ "$status" == "missing" ]]; then
              cp "$VM_ENV_FILE" "$tmp"
              printf '\nAUTH_COOKIE_SECRET=%s\n' "$secret" >> "$tmp"
            else
              awk -v secret="$secret" '
                BEGIN { replaced = 0 }
                /^AUTH_COOKIE_SECRET=/ {
                  if (replaced == 0) {
                    print "AUTH_COOKIE_SECRET=" secret
                    replaced = 1
                  }
                  next
                }
                { print }
                END {
                  if (replaced == 0) {
                    print "AUTH_COOKIE_SECRET=" secret
                  }
                }
              ' "$VM_ENV_FILE" > "$tmp"
            fi
            mv "$tmp" "$VM_ENV_FILE"
            status="generated_from_${status}"
          fi

          echo "env_file=$VM_ENV_FILE"
          echo "auth_cookie_secret_status=$status"

          if [[ "$MODE" == "ensure" ]]; then
            compose_files='-f docker-compose.prod.yml'
            [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
            services="$(docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents config --services)"
            if echo "$services" | grep -qx auth; then
