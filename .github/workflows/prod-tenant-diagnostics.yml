name: prod-tenant-diagnostics

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Production tenant id to inspect, e.g. tnt_..."
        required: true
        type: string
      wiki_question_event_id:
        description: "Optional evt_... id for one wiki.question audit row"
        required: false
        type: string
        default: ""
      wiki_question_since:
        description: "Optional ISO timestamp lower bound for wiki.question audit rows"
        required: false
        type: string
        default: ""
      wiki_question_until:
        description: "Optional ISO timestamp upper bound for wiki.question audit rows"
        required: false
        type: string
        default: ""
      wiki_question_search:
        description: "Optional case-insensitive substring for inputs.question"
        required: false
        type: string
        default: ""
      proposal_read_model_smoke:
        description: "When true, mint an execution:read session and smoke GET /v1/proposals serialization"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    name: run fixed production tenant diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: prod-tenant-diagnostics
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      TENANT_ID: ${{ inputs.tenant_id }}
      WIKI_QUESTION_EVENT_ID: ${{ inputs.wiki_question_event_id }}
      WIKI_QUESTION_SINCE: ${{ inputs.wiki_question_since }}
      WIKI_QUESTION_UNTIL: ${{ inputs.wiki_question_until }}
      WIKI_QUESTION_SEARCH: ${{ inputs.wiki_question_search }}
      PROPOSAL_READ_MODEL_SMOKE: ${{ inputs.proposal_read_model_smoke }}
    steps:
      - name: Validate tenant id
        shell: bash
        run: |
          if [[ ! "$TENANT_ID" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "tenant_id must match ^tnt_[0-9A-HJKMNP-TV-Z]{26}$"
            exit 1
          fi
          if [[ -n "$WIKI_QUESTION_EVENT_ID" && ! "$WIKI_QUESTION_EVENT_ID" =~ ^evt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "wiki_question_event_id must match ^evt_[0-9A-HJKMNP-TV-Z]{26}$ when provided"
            exit 1
          fi
          for value in "$WIKI_QUESTION_SINCE" "$WIKI_QUESTION_UNTIL"; do
            if [[ -n "$value" && ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
              echo "wiki_question_since/wiki_question_until must be ISO UTC timestamps when provided"
              exit 1
            fi
          done
          if [[ ${#WIKI_QUESTION_SEARCH} -gt 160 ]]; then
            echo "wiki_question_search must be 160 characters or less"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed diagnostics
        shell: bash
        run: |
          wiki_question_event_id_b64="$(printf '%s' "$WIKI_QUESTION_EVENT_ID" | base64 | tr -d '\n')"
          wiki_question_since_b64="$(printf '%s' "$WIKI_QUESTION_SINCE" | base64 | tr -d '\n')"
          wiki_question_until_b64="$(printf '%s' "$WIKI_QUESTION_UNTIL" | base64 | tr -d '\n')"
          wiki_question_search_b64="$(printf '%s' "$WIKI_QUESTION_SEARCH" | base64 | tr -d '\n')"
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "TENANT_ID='$TENANT_ID' WIKI_QUESTION_EVENT_ID_B64='$wiki_question_event_id_b64' WIKI_QUESTION_SINCE_B64='$wiki_question_since_b64' WIKI_QUESTION_UNTIL_B64='$wiki_question_until_b64' WIKI_QUESTION_SEARCH_B64='$wiki_question_search_b64' PROPOSAL_READ_MODEL_SMOKE='$PROPOSAL_READ_MODEL_SMOKE' bash -s" <<'REMOTE'
          set -euo pipefail

          WIKI_QUESTION_EVENT_ID="$(printf '%s' "$WIKI_QUESTION_EVENT_ID_B64" | base64 -d)"
          WIKI_QUESTION_SINCE="$(printf '%s' "$WIKI_QUESTION_SINCE_B64" | base64 -d)"
          WIKI_QUESTION_UNTIL="$(printf '%s' "$WIKI_QUESTION_UNTIL_B64" | base64 -d)"
          WIKI_QUESTION_SEARCH="$(printf '%s' "$WIKI_QUESTION_SEARCH_B64" | base64 -d)"

          if [[ ! "$TENANT_ID" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "tenant_id failed remote validation"
            exit 1
          fi
          if [[ -n "$WIKI_QUESTION_EVENT_ID" && ! "$WIKI_QUESTION_EVENT_ID" =~ ^evt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "wiki_question_event_id failed remote validation"
            exit 1
          fi
          for value in "$WIKI_QUESTION_SINCE" "$WIKI_QUESTION_UNTIL"; do
            if [[ -n "$value" && ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
              echo "wiki question timestamp failed remote validation"
              exit 1
            fi
          done
          if [[ ${#WIKI_QUESTION_SEARCH} -gt 160 ]]; then
            echo "wiki_question_search failed remote validation"
            exit 1
          fi

          echo "::group::worker runtime"
          echo "worker_git_sha=$(docker exec brain-prod-worker printenv GIT_SHA || true)"
          echo "document extraction worker configured log lines:"
          cd ~/brain-core
          docker compose -p brain-prod --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.caddy.yml \
            logs --tail=200 worker | grep "document extraction worker configured" | tail -n 5 || true
          echo "::endgroup::"

          echo "::group::tenant diagnostics"
          docker exec -i brain-prod-postgres psql -U brain -d brain \
            -v ON_ERROR_STOP=1 \
            -v tenant_id="$TENANT_ID" \
            -v wiki_question_event_id="$WIKI_QUESTION_EVENT_ID" \
            -v wiki_question_since="$WIKI_QUESTION_SINCE" \
            -v wiki_question_until="$WIKI_QUESTION_UNTIL" \
            -v wiki_question_search="$WIKI_QUESTION_SEARCH" <<'SQL'
          \pset pager off
          \pset null '(null)'
          BEGIN TRANSACTION READ ONLY;

          \echo 'tenant'
          SELECT id, kind, sandbox, created_via, created_at
            FROM tenants
           WHERE id = :'tenant_id';

          \echo 'audit action counts'
          SELECT action, COUNT(*) AS count
            FROM audit_events
           WHERE tenant_id = :'tenant_id'
           GROUP BY action
           ORDER BY action;

          \echo 'raw source counts'
          SELECT type,
                 status,
                 metadata->>'demo_seed_kind' AS demo_seed_kind,
                 COUNT(*) AS count
            FROM raw_sources
           WHERE tenant_id = :'tenant_id'
           GROUP BY type, status, metadata->>'demo_seed_kind'
           ORDER BY type, status, demo_seed_kind;

          \echo 'raw artifact counts by file'
          SELECT source_type,
                 source_ref->>'filename' AS filename,
                 bytes,
                 COUNT(*) AS count
            FROM raw_artifacts
           WHERE tenant_id = :'tenant_id'
           GROUP BY source_type, source_ref->>'filename', bytes
           ORDER BY filename, bytes, source_type;

          \echo 'proposal status counts'
          SELECT COALESCE(NULLIF(action->>'type', ''), NULLIF(action->>'kind', ''), 'unknown')
                   AS type,
                 status,
                 COUNT(*) AS count
            FROM proposals
           WHERE tenant_id = :'tenant_id'
           GROUP BY 1, 2
           ORDER BY 1, 2;

          \echo 'proposal details for transaction flags, collections, payment, and reconciliation'
          SELECT p.id,
                 p.created_at,
                 p.proposing_agent,
                 COALESCE(NULLIF(p.action->>'type', ''), NULLIF(p.action->>'kind', ''), 'unknown')
                   AS type,
                 p.status,
                 p.policy_decision,
                 p.required_approvers,
                 p.action->>'summary' AS summary,
                 p.action->>'narrative' AS narrative,
                 p.action->>'description' AS description,
                 p.action->>'counterparty_name' AS counterparty_name,
                 p.action->>'merchant' AS merchant,
                 p.action->>'amount' AS amount,
                 p.action->>'currency' AS currency,
                 p.action->>'confidence' AS confidence,
                 p.action->>'transaction_id' AS transaction_id,
                 p.action->>'payment_intent_id' AS payment_intent_id,
                 p.action AS action_payload,
                 p.action->'evidence_ids' AS evidence_ids,
                 p.action->'evidence_refs' AS evidence_refs,
                 p.policy_trace
            FROM proposals p
           WHERE p.tenant_id = :'tenant_id'
             AND COALESCE(NULLIF(p.action->>'type', ''), NULLIF(p.action->>'kind', ''), 'unknown')
                 IN ('flag_transaction', 'collections', 'payment', 'reconciliation')
           ORDER BY p.created_at DESC, p.id DESC
           LIMIT 50;

          \echo 'recent rejected agent_action policy decisions'
          SELECT id,
                 decided_at,
                 subject_id,
                 outcome,
                 matched_rule_id,
                 required_approvers,
                 trace
            FROM policy_decisions
           WHERE tenant_id = :'tenant_id'
             AND subject_type = 'agent_action'
             AND outcome = 'reject'
           ORDER BY decided_at DESC
           LIMIT 50;

          \echo 'wiki.question audit payloads'
          SELECT id,
                 created_at,
                 actor,
                 event_type,
                 severity,
                 inputs,
                 outputs,
                 policy_decision_id
            FROM audit_events
           WHERE tenant_id = :'tenant_id'
             AND action = 'wiki.question'
             AND (:'wiki_question_event_id' = '' OR id = :'wiki_question_event_id')
             AND (
               NULLIF(:'wiki_question_since', '') IS NULL
               OR created_at >= NULLIF(:'wiki_question_since', '')::timestamptz
             )
             AND (
               NULLIF(:'wiki_question_until', '') IS NULL
               OR created_at <= NULLIF(:'wiki_question_until', '')::timestamptz
             )
             AND (:'wiki_question_search' = ''
                  OR inputs->>'question' ILIKE '%' || :'wiki_question_search' || '%')
           ORDER BY created_at DESC
           LIMIT 20;

          COMMIT;
          SQL
          echo "::endgroup::"

          if [[ "$PROPOSAL_READ_MODEL_SMOKE" == "true" ]]; then
            echo "::group::proposal read-model HTTP smoke"
            cd ~/brain-core
            set -a
            # Keep the platform secret on the VM. The workflow only prints sanitized
            # proposal field summaries from the authenticated read response.
            . ./.env.prod
            set +a
            if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
              echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on the VM"
              exit 1
            fi

            external_ref="$(
              docker exec -i brain-prod-postgres psql -U brain -d brain -At \
                -v ON_ERROR_STOP=1 \
                -v tenant_id="$TENANT_ID" <<'SQL'
              SELECT l.external_ref
                FROM member_identity_links l
                JOIN members m
                  ON m.tenant_id = l.tenant_id
                 AND m.id = l.member_id
               WHERE l.tenant_id = :'tenant_id'
                 AND l.surface = 'platform'
                 AND m.status = 'active'
               ORDER BY CASE WHEN m.role = 'admin' THEN 0 ELSE 1 END,
                        l.linked_at ASC
               LIMIT 1;
          SQL
            )"
            if [[ -z "$external_ref" ]]; then
              echo "No active platform identity link found for tenant"
              exit 1
            fi

            session_json="$(
              EXTERNAL_REF="$external_ref" node -e '
                const externalRef = process.env.EXTERNAL_REF;
                process.stdout.write(JSON.stringify({
                  external_ref: externalRef,
                  scopes: ["execution:read"],
                }));
              ' | curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
                -X POST https://api.brain.fi/v1/sessions \
                -H "Content-Type: application/json" \
                -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
                --data-binary @-
            )"
            token="$(
              printf '%s' "$session_json" | node -e '
                let body = "";
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const parsed = JSON.parse(body);
                  if (typeof parsed.token !== "string" || parsed.token.length === 0) {
                    process.exit(1);
                  }
                  process.stdout.write(parsed.token);
                });
              '
            )"
            proposals_response="$(
              curl -sS --retry 2 --connect-timeout 10 --max-time 30 \
                "https://api.brain.fi/v1/proposals?status=pending&limit=100" \
                -H "Authorization: Bearer ${token}" \
                -w $'\n%{http_code}'
            )"
            proposals_status="${proposals_response##*$'\n'}"
            proposals_json="${proposals_response%$'\n'*}"
            if [[ "$proposals_status" != "200" ]]; then
              echo "GET /v1/proposals returned HTTP $proposals_status"
              printf '%s\n' "$proposals_json"
              echo "recent api logs:"
              docker compose -p brain-prod --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.caddy.yml \
                logs --tail=200 api | tail -n 120 || true
              exit 1
            fi
            cat > /tmp/proposal-read-model-smoke.js <<'NODE'
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const parsed = JSON.parse(body);
              const proposals = Array.isArray(parsed.proposals) ? parsed.proposals : [];
              const targets = [
                "flag_transaction",
                "cash_forecast",
                "treasury",
                "flag_subscription",
                "notify",
              ];
              const fieldNames = [
                "details",
                "policy",
                "presentation",
                "available_decisions",
                "stored_action_type",
              ];

              const meaningful = (value) => {
                if (value === null || value === undefined) return false;
                if (typeof value === "string") return value.trim().length > 0;
                if (typeof value === "number" || typeof value === "boolean") return true;
                if (Array.isArray(value)) return value.length > 0;
                if (typeof value === "object") {
                  return Object.values(value).some((child) => meaningful(child));
                }
                return false;
              };
              const matchesTarget = (proposal, target) =>
                proposal.stored_action_type === target ||
                proposal.type === target ||
                proposal.details?.type === target ||
                proposal.details?.kind === target ||
                proposal.details?.agent_role === target ||
                proposal.details?.agent_id === target;

              const failures = [];
              const summaries = [];
              for (const target of targets) {
                const proposal = proposals.find((candidate) => matchesTarget(candidate, target));
                if (proposal === undefined) {
                  failures.push(`${target}: no matching pending proposal returned`);
                  continue;
                }
                const missing = fieldNames.filter((field) => !meaningful(proposal[field]));
                if (missing.length > 0) {
                  failures.push(`${target}: empty fields ${missing.join(", ")}`);
                }
                summaries.push({
                  target,
                  id: proposal.id,
                  type: proposal.type,
                  status: proposal.status,
                  stored_action_type: proposal.stored_action_type,
                  details_keys: Object.keys(proposal.details ?? {}).slice(0, 12),
                  policy_decision: proposal.policy?.decision ?? null,
                  policy_id: proposal.policy?.policy_id ?? null,
                  matched_rule_id: proposal.policy?.matched_rule_id ?? null,
                  available_decisions: (proposal.available_decisions ?? []).map((item) => item.id),
                  presentation_headline: proposal.presentation?.headline ?? null,
                  presentation_key_fact_count: proposal.presentation?.key_facts?.length ?? 0,
                });
              }
              console.log(JSON.stringify({ checked: targets, summaries }, null, 2));
              if (failures.length > 0) {
                console.error(JSON.stringify({ failures }, null, 2));
                process.exit(1);
              }
            });
          NODE
            printf '%s' "$proposals_json" | node /tmp/proposal-read-model-smoke.js
            rm -f /tmp/proposal-read-model-smoke.js
            echo "::endgroup::"
          fi
          REMOTE
