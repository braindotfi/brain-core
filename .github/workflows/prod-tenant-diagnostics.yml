name: prod-tenant-diagnostics

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    name: inspect test5 invite on the production host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: prod-tenant-diagnostics
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure production SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Copy fixed read-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy scripts/ops/diagnose-test5-production-invite.sh \
            "azureuser@$VM_HOST:/tmp/diagnose-test5-production-invite.sh"
      - name: Query production invite state and sanitized API logs
        shell: bash
        run: |
          set -euo pipefail
          output="$(ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "chmod 700 /tmp/diagnose-test5-production-invite.sh && /tmp/diagnose-test5-production-invite.sh; rc=\$?; rm -f /tmp/diagnose-test5-production-invite.sh; exit \$rc")"
          db_payload="$(printf '%s\n' "$output" | sed -n '1p')"
          runtime_payload="$(printf '%s\n' "$output" | sed -n '2p')"
          logs_payload="$(printf '%s\n' "$output" | sed -n '3p')"
          sentinel="$(printf '%s\n' "$output" | sed -n '4p')"
          [[ "$(printf '%s\n' "$output" | wc -l | tr -d ' ')" == "4" ]]
          [[ "$db_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$runtime_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$logs_payload" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          [[ "$sentinel" == "test5_production_invite_diagnostic_completed" ]]
          printf '%s\n%s\n%s\n' "$db_payload" "$runtime_payload" "$logs_payload"
