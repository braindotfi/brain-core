name: prod-tenant-diagnostics

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: "Production tenant id to inspect, e.g. tnt_... Required unless trust_gate_impact is true."
        required: false
        default: ""
        type: string
      wiki_question_event_id:
        description: "Optional evt_... id for one wiki.question audit row"
        required: false
        type: string
        default: ""
      wiki_question_since:
        description: "Optional ISO timestamp lower bound for wiki.question audit rows"
        required: false
        type: string
        default: ""
      wiki_question_until:
        description: "Optional ISO timestamp upper bound for wiki.question audit rows"
        required: false
        type: string
        default: ""
      wiki_question_search:
        description: "Optional case-insensitive substring for inputs.question"
        required: false
        type: string
        default: ""
      proposal_read_model_smoke:
        description: "When true, mint an execution:read session and smoke GET /v1/proposals serialization"
        required: false
        type: boolean
        default: false
      ingestion_lineage:
        description: "When true, print fixed raw-to-canonical-to-ledger lineage for the tenant"
        required: false
        type: boolean
        default: false
      trust_gate_impact:
        description: "When true, report paused-counterparty payment-intent impact across all production tenants"
        required: false
        type: boolean
        default: false
      compliance_proposal_duplicate_report:
        description: "When true, report one tenant's pending Compliance proposal subject groups."
        required: false
        type: boolean
        default: false
      compliance_proposal_enrichment_extract:
        description: "When true, print one pending Compliance proposal plus referenced ledger rows for BrainMVB enrichment verification."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    name: run fixed production tenant diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: prod-tenant-diagnostics
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      TENANT_ID: ${{ inputs.tenant_id }}
      WIKI_QUESTION_EVENT_ID: ${{ inputs.wiki_question_event_id }}
      WIKI_QUESTION_SINCE: ${{ inputs.wiki_question_since }}
      WIKI_QUESTION_UNTIL: ${{ inputs.wiki_question_until }}
      WIKI_QUESTION_SEARCH: ${{ inputs.wiki_question_search }}
      PROPOSAL_READ_MODEL_SMOKE: ${{ inputs.proposal_read_model_smoke }}
      INGESTION_LINEAGE: ${{ inputs.ingestion_lineage }}
      TRUST_GATE_IMPACT: ${{ inputs.trust_gate_impact }}
      COMPLIANCE_PROPOSAL_DUPLICATE_REPORT: ${{ inputs.compliance_proposal_duplicate_report }}
      COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT: ${{ inputs.compliance_proposal_enrichment_extract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tenant id
        shell: bash
        run: |
          if [[ "$TRUST_GATE_IMPACT" != "true" && "$TRUST_GATE_IMPACT" != "false" ]]; then
            echo "trust_gate_impact must be true or false"
            exit 1
          fi
          if [[ "$TRUST_GATE_IMPACT" == "false" && ! "$TENANT_ID" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "tenant_id must match ^tnt_[0-9A-HJKMNP-TV-Z]{26}$"
            exit 1
          fi
          if [[ "$TRUST_GATE_IMPACT" == "true" && -n "$TENANT_ID" ]]; then
            echo "trust_gate_impact is cross-tenant and requires tenant_id to be empty"
            exit 1
          fi
          if [[ -n "$WIKI_QUESTION_EVENT_ID" && ! "$WIKI_QUESTION_EVENT_ID" =~ ^evt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "wiki_question_event_id must match ^evt_[0-9A-HJKMNP-TV-Z]{26}$ when provided"
            exit 1
          fi
          for value in "$WIKI_QUESTION_SINCE" "$WIKI_QUESTION_UNTIL"; do
            if [[ -n "$value" && ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
              echo "wiki_question_since/wiki_question_until must be ISO UTC timestamps when provided"
              exit 1
            fi
          done
          if [[ ${#WIKI_QUESTION_SEARCH} -gt 160 ]]; then
            echo "wiki_question_search must be 160 characters or less"
            exit 1
          fi
          if [[ "$INGESTION_LINEAGE" != "true" && "$INGESTION_LINEAGE" != "false" ]]; then
            echo "ingestion_lineage must be true or false"
            exit 1
          fi
          if [[ "$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT" != "true" && "$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT" != "false" ]]; then
            echo "compliance_proposal_duplicate_report must be true or false"
            exit 1
          fi
          if [[ "$COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT" != "true" && "$COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT" != "false" ]]; then
            echo "compliance_proposal_enrichment_extract must be true or false"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed diagnostics
        shell: bash
        run: |
          wiki_question_event_id_b64="$(printf '%s' "$WIKI_QUESTION_EVENT_ID" | base64 | tr -d '\n')"
          wiki_question_since_b64="$(printf '%s' "$WIKI_QUESTION_SINCE" | base64 | tr -d '\n')"
          wiki_question_until_b64="$(printf '%s' "$WIKI_QUESTION_UNTIL" | base64 | tr -d '\n')"
          wiki_question_search_b64="$(printf '%s' "$WIKI_QUESTION_SEARCH" | base64 | tr -d '\n')"
          if [[ "$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT" == "true" ]]; then
            scp -i ~/.ssh/id_deploy scripts/ops/report-compliance-proposal-duplicates.sql \
              "azureuser@$VM_HOST:~/brain-core/scripts/ops/report-compliance-proposal-duplicates.sql"
          fi
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "TENANT_ID='$TENANT_ID' WIKI_QUESTION_EVENT_ID_B64='$wiki_question_event_id_b64' WIKI_QUESTION_SINCE_B64='$wiki_question_since_b64' WIKI_QUESTION_UNTIL_B64='$wiki_question_until_b64' WIKI_QUESTION_SEARCH_B64='$wiki_question_search_b64' PROPOSAL_READ_MODEL_SMOKE='$PROPOSAL_READ_MODEL_SMOKE' INGESTION_LINEAGE='$INGESTION_LINEAGE' TRUST_GATE_IMPACT='$TRUST_GATE_IMPACT' COMPLIANCE_PROPOSAL_DUPLICATE_REPORT='$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT' COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT='$COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT' bash -s" <<'REMOTE'
          set -euo pipefail

          WIKI_QUESTION_EVENT_ID="$(printf '%s' "$WIKI_QUESTION_EVENT_ID_B64" | base64 -d)"
          WIKI_QUESTION_SINCE="$(printf '%s' "$WIKI_QUESTION_SINCE_B64" | base64 -d)"
          WIKI_QUESTION_UNTIL="$(printf '%s' "$WIKI_QUESTION_UNTIL_B64" | base64 -d)"
          WIKI_QUESTION_SEARCH="$(printf '%s' "$WIKI_QUESTION_SEARCH_B64" | base64 -d)"

          if [[ "$TRUST_GATE_IMPACT" != "true" && "$TRUST_GATE_IMPACT" != "false" ]]; then
            echo "trust_gate_impact failed remote validation"
            exit 1
          fi
          if [[ "$TRUST_GATE_IMPACT" == "false" && ! "$TENANT_ID" =~ ^tnt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "tenant_id failed remote validation"
            exit 1
          fi
          if [[ "$TRUST_GATE_IMPACT" == "true" && -n "$TENANT_ID" ]]; then
            echo "trust_gate_impact requires an empty tenant_id"
            exit 1
          fi
          if [[ -n "$WIKI_QUESTION_EVENT_ID" && ! "$WIKI_QUESTION_EVENT_ID" =~ ^evt_[0-9A-HJKMNP-TV-Z]{26}$ ]]; then
            echo "wiki_question_event_id failed remote validation"
            exit 1
          fi
          for value in "$WIKI_QUESTION_SINCE" "$WIKI_QUESTION_UNTIL"; do
            if [[ -n "$value" && ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$ ]]; then
              echo "wiki question timestamp failed remote validation"
              exit 1
            fi
          done
          if [[ ${#WIKI_QUESTION_SEARCH} -gt 160 ]]; then
            echo "wiki_question_search failed remote validation"
            exit 1
          fi
          if [[ "$INGESTION_LINEAGE" != "true" && "$INGESTION_LINEAGE" != "false" ]]; then
            echo "ingestion_lineage failed remote validation"
            exit 1
          fi
          if [[ "$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT" != "true" && "$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT" != "false" ]]; then
            echo "compliance_proposal_duplicate_report failed remote validation"
            exit 1
          fi
          if [[ "$COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT" != "true" && "$COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT" != "false" ]]; then
            echo "compliance_proposal_enrichment_extract failed remote validation"
            exit 1
          fi

          if [[ "$COMPLIANCE_PROPOSAL_DUPLICATE_REPORT" == "true" ]]; then
            cd ~/brain-core
            docker exec -i brain-prod-postgres psql -U brain -d brain \
              -v ON_ERROR_STOP=1 -v tenant_id="$TENANT_ID" -f - \
              < scripts/ops/report-compliance-proposal-duplicates.sql
            exit 0
          fi

          if [[ "$COMPLIANCE_PROPOSAL_ENRICHMENT_EXTRACT" == "true" ]]; then
            echo "::group::compliance proposal enrichment extract"
            docker exec -i brain-prod-postgres psql -U brain -d brain \
              -v ON_ERROR_STOP=1 \
              -v tenant_id="$TENANT_ID" <<'SQL'
            \pset pager off
            \pset tuples_only on
            \pset format unaligned
            BEGIN TRANSACTION READ ONLY;
            SET LOCAL statement_timeout = '5s';
            SET LOCAL lock_timeout = '1s';

            WITH target AS (
              SELECT p.id,
                     p.created_at,
                     p.status,
                     p.proposing_agent,
                     p.policy_decision,
                     p.policy_version,
                     p.policy_trace,
                     p.required_approvers,
                     p.action
                FROM proposals p
               WHERE p.tenant_id = :'tenant_id'
                 AND p.status = 'pending'
                 AND (
                   p.action->>'type' = 'compliance'
                   OR p.action->>'agent_role' = 'compliance'
                   OR p.action->>'agent_kind' = 'compliance'
                   OR p.action->>'agent_id' = 'compliance'
                   OR p.action->>'kind' = 'compliance'
                 )
               ORDER BY p.created_at DESC, p.id DESC
               LIMIT 1
            ),
            action_refs AS (
              SELECT t.id,
                     elem.value AS item,
                     elem.ordinality AS ord
                FROM target t
                CROSS JOIN LATERAL jsonb_array_elements(
                  CASE
                    WHEN jsonb_typeof(t.action->'evidence_refs') = 'array' THEN t.action->'evidence_refs'
                    WHEN jsonb_typeof(t.action->'evidence') = 'array' THEN t.action->'evidence'
                    WHEN jsonb_typeof(t.action->'evidence_ids') = 'array' THEN t.action->'evidence_ids'
                    ELSE '[]'::jsonb
                  END
                ) WITH ORDINALITY AS elem(value, ordinality)
            ),
            evidence AS (
              SELECT ar.id,
                     jsonb_agg(
                       jsonb_build_object(
                         'kind',
                         CASE
                           WHEN ref LIKE 'acct_%' THEN 'account'
                           WHEN ref LIKE 'cp_%' THEN 'counterparty'
                           WHEN ref LIKE 'doc_%' THEN 'document'
                           WHEN ref LIKE 'ent_%' THEN 'wiki_entity'
                           WHEN ref LIKE 'evt_%' THEN 'audit_event'
                           WHEN ref LIKE 'inv_%' THEN 'invoice'
                           WHEN ref LIKE 'obl_%' THEN 'obligation'
                           WHEN ref LIKE 'pd_%' THEN 'policy_decision'
                           WHEN ref LIKE 'pi_%' THEN 'payment_intent'
                           WHEN ref LIKE 'pol_%' THEN 'policy'
                           WHEN ref LIKE 'prs_%' THEN 'raw_parsed'
                           WHEN ref LIKE 'raw_%' THEN 'raw_artifact'
                           WHEN ref LIKE 'tx_%' THEN 'transaction'
                           ELSE COALESCE(NULLIF(kind, ''), 'unknown')
                         END,
                         'ref', ref,
                         'resolvable',
                         CASE
                           WHEN ref LIKE 'acct_%' OR ref LIKE 'cp_%' OR ref LIKE 'inv_%'
                             OR ref LIKE 'obl_%' OR ref LIKE 'tx_%' OR ref LIKE 'wiki:%'
                           THEN true
                           ELSE false
                         END
                       )
                       ORDER BY ord
                     ) AS evidence
                FROM (
                  SELECT ar.id,
                         ar.item,
                         ar.ord,
                         CASE
                           WHEN jsonb_typeof(ar.item) = 'string' THEN trim(both '"' from ar.item::text)
                           ELSE COALESCE(ar.item->>'ref', ar.item->>'id', ar.item->>'entity_id', ar.item->>'wiki_entity_id')
                         END AS ref,
                         CASE WHEN jsonb_typeof(ar.item) = 'object' THEN ar.item->>'kind' ELSE NULL END AS kind
                    FROM action_refs ar
                ) ar
               WHERE ref IS NOT NULL AND ref <> ''
               GROUP BY ar.id
            ),
            narrative_refs AS (
              SELECT DISTINCT matches.match[1] AS ref
                FROM target t
                CROSS JOIN LATERAL regexp_matches(
                  COALESCE(t.action->>'narrative', t.action->>'summary', t.action->>'description', ''),
                  '([a-z][a-z0-9]{0,11}_[0-9A-HJKMNP-TV-Z]{26})',
                  'g'
                ) AS matches(match)
            ),
            invoice_rows AS (
              SELECT li.*
                FROM ledger_invoices li
               WHERE li.owner_id = :'tenant_id'
                 AND li.id IN (SELECT ref FROM narrative_refs WHERE ref LIKE 'inv_%')
            ),
            counterparty_rows AS (
              SELECT lc.*
                FROM ledger_counterparties lc
               WHERE lc.owner_id = :'tenant_id'
                 AND (
                   lc.id IN (SELECT counterparty_id FROM invoice_rows WHERE counterparty_id IS NOT NULL)
                   OR lc.id IN (SELECT ref FROM narrative_refs WHERE ref LIKE 'cp_%')
                 )
            ),
            key_facts AS (
              SELECT t.id,
                     jsonb_agg(jsonb_build_object('label', label, 'value', value) ORDER BY ord) AS key_facts
                FROM target t
                CROSS JOIN LATERAL (
                  VALUES
                    (1, 'Finding Type', t.action->>'finding_type'),
                    (2, 'Severity', t.action->>'severity'),
                    (3, 'Rule Id', t.action->>'rule_id'),
                    (4, 'Policy Decision Id', t.action->>'policy_decision_id'),
                    (5, 'Audit Event Id', t.action->>'audit_event_id'),
                    (6, 'Recommended Remediation', t.action->>'recommended_remediation')
                ) AS facts(ord, label, value)
               WHERE value IS NOT NULL AND value <> ''
               GROUP BY t.id
            )
            \echo 'COMPLIANCE_ENRICHMENT_RECORD_JSON_BEGIN'
            SELECT jsonb_pretty(
              jsonb_build_object(
                'tenant_id', :'tenant_id',
                'source', jsonb_build_object(
                  'proposal_table', 'proposals',
                  'proposal_id', t.id,
                  'created_at', t.created_at,
                  'status', t.status,
                  'proposing_agent', t.proposing_agent
                ),
                'raw_proposal', jsonb_build_object(
                  'id', t.id,
                  'type', 'compliance',
                  'created_at', t.created_at,
                  'status', t.status,
                  'risk_band', CASE WHEN t.action->>'risk_band' IN ('low','standard','elevated','high') THEN t.action->>'risk_band' ELSE NULL END,
                  'confidence', CASE WHEN t.action->>'confidence' ~ '^(0(\.\d+)?|1(\.0+)?)$' THEN (t.action->>'confidence')::float8 ELSE NULL END,
                  'mode', CASE WHEN t.action->>'mode' = 'notify_only' THEN 'notify_only' ELSE 'propose' END,
                  'narrative', COALESCE(t.action->>'narrative', t.action->>'summary', t.action->>'description'),
                  'evidence', COALESCE(e.evidence, '[]'::jsonb),
                  'agent', NULL,
                  'payment_intent_id', NULL,
                  'action_type', NULL,
                  'stored_action_type', t.action->>'type',
                  'details', t.action,
                  'policy', jsonb_build_object(
                    'decision', t.policy_decision,
                    'policy_id', t.action->>'policy_id',
                    'policy_version', t.policy_version,
                    'matched_rule_id', t.action->>'matched_rule_id',
                    'required_approvers', COALESCE(to_jsonb(t.required_approvers), '[]'::jsonb),
                    'trace', t.policy_trace
                  ),
                  'presentation', jsonb_build_object(
                    'headline', COALESCE(t.action->>'headline', t.action->>'summary', t.action->>'narrative', t.action->>'description'),
                    'recommendation', COALESCE(t.action->>'recommended_action', t.action->>'recommendation', t.action->>'recommended_payment_decision'),
                    'key_facts', COALESCE(k.key_facts, '[]'::jsonb)
                  ),
                  'available_decisions', jsonb_build_array(jsonb_build_object(
                    'id', 'acknowledge',
                    'label', 'Acknowledge',
                    'meaning', 'Record review of the informational finding without unblocking a blocked action.'
                  ))
                ),
                'ledger_entities', jsonb_build_object(
                  'narrative_refs', COALESCE((SELECT jsonb_agg(ref ORDER BY ref) FROM narrative_refs), '[]'::jsonb),
                  'invoices', COALESCE((
                    SELECT jsonb_agg(jsonb_build_object(
                      'id', li.id,
                      'invoice_number', li.invoice_number,
                      'counterparty_id', li.counterparty_id,
                      'amount_due', li.amount_due::text,
                      'currency', li.currency,
                      'due_date', li.due_date,
                      'status', li.status,
                      'metadata', to_jsonb(li)->'metadata'
                    ) ORDER BY li.id)
                    FROM invoice_rows li
                  ), '[]'::jsonb),
                  'counterparties', COALESCE((
                    SELECT jsonb_agg(jsonb_build_object(
                      'id', lc.id,
                      'name', lc.name,
                      'display_name', lc.name
                    ) ORDER BY lc.id)
                    FROM counterparty_rows lc
                  ), '[]'::jsonb)
                )
              )
            )
            FROM target t
            LEFT JOIN evidence e ON e.id = t.id
            LEFT JOIN key_facts k ON k.id = t.id;
            \echo 'COMPLIANCE_ENRICHMENT_RECORD_JSON_END'

            COMMIT;
          SQL
            echo "::endgroup::"
            exit 0
          fi

          echo "::group::worker runtime"
          echo "worker_git_sha=$(docker exec brain-prod-worker printenv GIT_SHA || true)"
          echo "document extraction worker configured log lines:"
          cd ~/brain-core
          docker compose -p brain-prod --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.caddy.yml \
            logs --tail=200 worker | grep "document extraction worker configured" | tail -n 5 || true
          echo "::endgroup::"

          if [[ "$TRUST_GATE_IMPACT" == "true" ]]; then
            echo "::group::counterparty trust-gate impact"
            docker exec -i brain-prod-postgres psql -U brain -d brain \
              -v ON_ERROR_STOP=1 <<'SQL'
            \pset pager off
            \pset null '(null)'
            BEGIN TRANSACTION READ ONLY;
            SET LOCAL statement_timeout = '5s';
            SET LOCAL lock_timeout = '1s';

            \echo 'counterparty trust-gate impact summary'
            WITH impact AS (
              SELECT cp.owner_id AS tenant_id,
                     t.kind AS tenant_kind,
                     t.sandbox,
                     t.created_via,
                     (t.kind = 'production' AND t.sandbox = FALSE) AS review_required,
                     cp.id AS counterparty_id,
                     cp.name AS counterparty_name,
                     cp.trust_status,
                     COUNT(pi.id) AS payment_intent_count,
                     ARRAY_AGG(pi.id ORDER BY pi.created_at) AS payment_intent_ids,
                     ARRAY_AGG(DISTINCT pi.status ORDER BY pi.status) AS statuses
                FROM ledger_counterparties cp
                JOIN tenants t ON t.id = cp.owner_id
                JOIN ledger_payment_intents pi
                  ON pi.owner_id = cp.owner_id
                 AND pi.destination_counterparty_id = cp.id
               WHERE cp.trust_status = 'paused'
                 AND pi.status IN (
                   'proposed', 'pending_approval', 'awaiting_second_approval',
                   'approved', 'paused', 'dispatching'
                 )
               GROUP BY cp.owner_id, t.kind, t.sandbox, t.created_via, cp.id, cp.name, cp.trust_status
            )
            SELECT COUNT(*) AS paused_counterparty_groups,
                   COALESCE(SUM(payment_intent_count), 0) AS affected_payment_intents,
                   COUNT(*) FILTER (WHERE review_required) AS non_demo_review_groups,
                   COALESCE(SUM(payment_intent_count) FILTER (WHERE review_required), 0)
                     AS non_demo_review_payment_intents,
                   COUNT(*) FILTER (WHERE NOT review_required) AS demo_or_sandbox_groups,
                   COALESCE(SUM(payment_intent_count) FILTER (WHERE NOT review_required), 0)
                     AS demo_or_sandbox_payment_intents
              FROM impact;

            \echo 'counterparty trust-gate impact rows'
            WITH impact AS (
              SELECT cp.owner_id AS tenant_id,
                     t.kind AS tenant_kind,
                     t.sandbox,
                     t.created_via,
                     (t.kind = 'production' AND t.sandbox = FALSE) AS review_required,
                     cp.id AS counterparty_id,
                     cp.name AS counterparty_name,
                     cp.trust_status,
                     COUNT(pi.id) AS payment_intent_count,
                     ARRAY_AGG(pi.id ORDER BY pi.created_at) AS payment_intent_ids,
                     ARRAY_AGG(DISTINCT pi.status ORDER BY pi.status) AS statuses
                FROM ledger_counterparties cp
                JOIN tenants t ON t.id = cp.owner_id
                JOIN ledger_payment_intents pi
                  ON pi.owner_id = cp.owner_id
                 AND pi.destination_counterparty_id = cp.id
               WHERE cp.trust_status = 'paused'
                 AND pi.status IN (
                   'proposed', 'pending_approval', 'awaiting_second_approval',
                   'approved', 'paused', 'dispatching'
                 )
               GROUP BY cp.owner_id, t.kind, t.sandbox, t.created_via, cp.id, cp.name, cp.trust_status
            )
            SELECT tenant_id,
                   tenant_kind,
                   sandbox,
                   created_via,
                   review_required,
                   counterparty_id,
                   counterparty_name,
                   trust_status,
                   payment_intent_count,
                   payment_intent_ids,
                   statuses
              FROM impact
             ORDER BY review_required DESC, tenant_id, counterparty_name, counterparty_id;

            COMMIT;
          SQL
            echo "::endgroup::"
            exit 0
          fi

          echo "::group::tenant diagnostics"
          docker exec -i brain-prod-postgres psql -U brain -d brain \
            -v ON_ERROR_STOP=1 \
            -v tenant_id="$TENANT_ID" \
            -v wiki_question_event_id="$WIKI_QUESTION_EVENT_ID" \
            -v wiki_question_since="$WIKI_QUESTION_SINCE" \
            -v wiki_question_until="$WIKI_QUESTION_UNTIL" \
            -v wiki_question_search="$WIKI_QUESTION_SEARCH" <<'SQL'
          \pset pager off
          \pset null '(null)'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '5s';
          SET LOCAL lock_timeout = '1s';

          \echo 'counterparty trust schema'
          SELECT EXISTS (
                   SELECT 1
                     FROM information_schema.columns
                    WHERE table_schema = 'public'
                      AND table_name = 'ledger_counterparties'
                      AND column_name = 'trust_status'
                 ) AS ledger_counterparties_trust_status_present;

          \echo 'tenant'
          SELECT id, kind, sandbox, created_via, created_at
            FROM tenants
           WHERE id = :'tenant_id';

          \echo 'audit action counts'
          SELECT action, COUNT(*) AS count
            FROM audit_events
           WHERE tenant_id = :'tenant_id'
           GROUP BY action
           ORDER BY action;

          \echo 'raw source counts'
          SELECT type,
                 status,
                 metadata->>'demo_seed_kind' AS demo_seed_kind,
                 COUNT(*) AS count
            FROM raw_sources
           WHERE tenant_id = :'tenant_id'
           GROUP BY type, status, metadata->>'demo_seed_kind'
           ORDER BY type, status, demo_seed_kind;

          \echo 'raw artifact counts by file'
          SELECT source_type,
                 source_ref->>'filename' AS filename,
                 bytes,
                 COUNT(*) AS count
            FROM raw_artifacts
           WHERE tenant_id = :'tenant_id'
           GROUP BY source_type, source_ref->>'filename', bytes
           ORDER BY filename, bytes, source_type;

          \echo 'proposal status counts'
          SELECT COALESCE(NULLIF(action->>'type', ''), NULLIF(action->>'kind', ''), 'unknown')
                   AS type,
                 status,
                 COUNT(*) AS count
            FROM proposals
           WHERE tenant_id = :'tenant_id'
           GROUP BY 1, 2
           ORDER BY 1, 2;

          \echo 'proposal details for transaction flags, collections, payment, and reconciliation'
          SELECT p.id,
                 p.created_at,
                 p.proposing_agent,
                 COALESCE(NULLIF(p.action->>'type', ''), NULLIF(p.action->>'kind', ''), 'unknown')
                   AS type,
                 p.status,
                 p.policy_decision,
                 p.required_approvers,
                 p.action->>'summary' AS summary,
                 p.action->>'narrative' AS narrative,
                 p.action->>'description' AS description,
                 p.action->>'counterparty_name' AS counterparty_name,
                 p.action->>'merchant' AS merchant,
                 p.action->>'amount' AS amount,
                 p.action->>'currency' AS currency,
                 p.action->>'confidence' AS confidence,
                 p.action->>'transaction_id' AS transaction_id,
                 p.action->>'payment_intent_id' AS payment_intent_id,
                 p.action AS action_payload,
                 p.action->'evidence_ids' AS evidence_ids,
                 p.action->'evidence_refs' AS evidence_refs,
                 p.policy_trace
            FROM proposals p
           WHERE p.tenant_id = :'tenant_id'
             AND COALESCE(NULLIF(p.action->>'type', ''), NULLIF(p.action->>'kind', ''), 'unknown')
                 IN ('flag_transaction', 'collections', 'payment', 'reconciliation')
           ORDER BY p.created_at DESC, p.id DESC
           LIMIT 50;

          \echo 'Collections cleanup post-apply verification'
          WITH collections_rows AS (
            SELECT p.id,
                   p.status,
                   p.superseded_by,
                   p.superseded_at,
                   p.action->>'invoice_id' AS invoice_id
              FROM proposals p
             WHERE p.tenant_id = :'tenant_id'
               AND p.proposing_agent = 'collections'
               AND p.action->>'type' = 'collections'
          )
          SELECT invoice_id,
                 status,
                 COUNT(*) AS proposal_count,
                 ARRAY_AGG(id ORDER BY id) AS proposal_ids
            FROM collections_rows
           GROUP BY invoice_id, status
           ORDER BY invoice_id, status;

          \echo 'three deterministic samples of superseded Collections proposals with audit events'
          SELECT p.id AS proposal_id,
                 p.status,
                 p.superseded_by,
                 p.superseded_at,
                 ae.id AS audit_event_id,
                 ae.created_at AS audit_created_at,
                 ae.actor AS audit_actor,
                 ae.action AS audit_action,
                 ae.inputs->>'retained_proposal_id' AS audit_retained_proposal_id
            FROM proposals p
            LEFT JOIN LATERAL (
              SELECT e.id,
                     e.created_at,
                     e.actor,
                     e.action,
                     e.inputs
                FROM audit_events e
               WHERE e.tenant_id = p.tenant_id
                 AND e.action = 'agent.action.superseded'
                 AND e.inputs->>'proposal_id' = p.id
               ORDER BY e.created_at DESC, e.id DESC
               LIMIT 1
            ) ae ON TRUE
           WHERE p.tenant_id = :'tenant_id'
             AND p.proposing_agent = 'collections'
             AND p.status = 'superseded'
             AND p.superseded_by IS NOT NULL
           ORDER BY md5(p.id)
           LIMIT 3;

          \echo 'reconciliation proposal and correlated policy decision details'
          WITH reconciliation_proposals AS (
            SELECT p.id,
                   p.created_at,
                   p.proposing_agent,
                   p.status,
                   p.policy_decision,
                   p.required_approvers,
                   p.action,
                   p.policy_trace
              FROM proposals p
             WHERE p.tenant_id = :'tenant_id'
               AND COALESCE(NULLIF(p.action->>'type', ''), NULLIF(p.action->>'kind', ''), 'unknown')
                   = 'reconciliation'
          )
          SELECT p.id AS proposal_id,
                 p.created_at AS proposal_created_at,
                 p.proposing_agent,
                 p.status AS proposal_status,
                 p.policy_decision AS proposal_policy_decision,
                 p.required_approvers,
                 p.action->>'summary' AS summary,
                 p.action->>'narrative' AS narrative,
                 p.action->>'transaction_id' AS transaction_id,
                 p.action->>'left_entity_id' AS left_entity_id,
                 p.action->>'right_entity_id' AS right_entity_id,
                 p.action->>'match_type' AS match_type,
                 p.action->'match_basis' AS match_basis,
                 p.action->>'confidence' AS confidence,
                 p.action->>'confidence_score' AS confidence_score,
                 p.action AS action_payload,
                 pd.id AS policy_decision_id,
                 pd.subject_id AS policy_subject_id,
                 pd.outcome AS policy_outcome,
                 pd.matched_rule_id,
                 pd.required_approvers AS policy_required_approvers,
                 pd.trace AS policy_trace,
                 pd.decided_at AS policy_decided_at
            FROM reconciliation_proposals p
            LEFT JOIN LATERAL (
              SELECT pd.id,
                     pd.subject_id,
                     pd.outcome,
                     pd.matched_rule_id,
                     pd.required_approvers,
                     pd.trace,
                     pd.decided_at
                FROM policy_decisions pd
               WHERE pd.tenant_id = :'tenant_id'
                 AND pd.subject_type = 'agent_action'
                 AND pd.outcome = p.policy_decision
                 AND pd.trace = p.policy_trace
                 AND pd.decided_at BETWEEN p.created_at - INTERVAL '5 seconds'
                                        AND p.created_at + INTERVAL '1 second'
               ORDER BY ABS(EXTRACT(EPOCH FROM (pd.decided_at - p.created_at)))
               LIMIT 1
            ) pd ON TRUE
           ORDER BY p.created_at DESC, p.id DESC;

          \echo 'recent rejected agent_action policy decisions'
          SELECT id,
                 decided_at,
                 subject_id,
                 outcome,
                 matched_rule_id,
                 required_approvers,
                 trace
            FROM policy_decisions
           WHERE tenant_id = :'tenant_id'
             AND subject_type = 'agent_action'
             AND outcome = 'reject'
           ORDER BY decided_at DESC
           LIMIT 50;

          \echo 'compliance rejected-decision clusters (last 30 days, maximum 200 decisions)'
          WITH recent_rejections AS (
            SELECT id,
                   decided_at,
                   policy_id,
                   policy_version,
                   matched_rule_id,
                   subject_type,
                   subject_id,
                   required_approvers,
                   trace
              FROM policy_decisions
             WHERE tenant_id = :'tenant_id'
               AND subject_type = 'agent_action'
               AND outcome = 'reject'
               AND decided_at >= current_timestamp - INTERVAL '30 days'
             ORDER BY decided_at DESC, id DESC
             LIMIT 200
          )
          SELECT policy_id,
                 policy_version,
                 COALESCE(matched_rule_id, '(no matching rule)') AS matched_rule_id,
                 subject_type,
                 date_trunc('hour', decided_at) AS decided_hour,
                 COUNT(*) AS rejected_count,
                 MIN(decided_at) AS first_decided_at,
                 MAX(decided_at) AS last_decided_at,
                 ARRAY_AGG(subject_id ORDER BY decided_at DESC, id DESC) AS subject_ids
            FROM recent_rejections
           GROUP BY policy_id,
                    policy_version,
                    matched_rule_id,
                    subject_type,
                    date_trunc('hour', decided_at)
           ORDER BY first_decided_at DESC,
                    policy_id,
                    policy_version,
                    matched_rule_id;

          \echo 'policy version history and bounded rule summaries'
          SELECT p.id AS policy_id,
                 p.version,
                 p.state,
                 p.created_at,
                 p.activated_at,
                 p.deactivated_at,
                 encode(p.content_hash, 'hex') AS content_hash,
                 COALESCE(rule_summary.rules, '[]'::jsonb) AS rules,
                 COALESCE(list_summary.lists, '[]'::jsonb) AS lists,
                 COALESCE(agent_action_summary.agent_actions, '[]'::jsonb) AS agent_actions
            FROM policies p
            LEFT JOIN LATERAL (
              SELECT jsonb_agg(
                       jsonb_build_object(
                         'id', rule.value->>'id',
                         'applies_to', rule.value->'applies_to',
                         'when', rule.value->'when',
                         'execute', rule.value->>'execute',
                         'require', rule.value->>'require',
                         'approval_required_above', rule.value->'approval_required_above'
                       )
                       ORDER BY rule.ordinality
                     ) AS rules
                FROM jsonb_array_elements(COALESCE(p.content->'rules', '[]'::jsonb))
                     WITH ORDINALITY AS rule(value, ordinality)
            ) rule_summary ON TRUE
            LEFT JOIN LATERAL (
              SELECT jsonb_agg(
                       jsonb_build_object(
                         'name', list_entry.key,
                         'member_count', jsonb_array_length(list_entry.value)
                       )
                       ORDER BY list_entry.key
                     ) AS lists
                FROM jsonb_each(COALESCE(p.content->'lists', '{}'::jsonb)) AS list_entry(key, value)
            ) list_summary ON TRUE
            LEFT JOIN LATERAL (
              SELECT jsonb_agg(
                       jsonb_build_object(
                         'agent_key', agent_action_entry.key,
                         'action_count', jsonb_array_length(agent_action_entry.value)
                       )
                       ORDER BY agent_action_entry.key
                     ) AS agent_actions
                FROM jsonb_each(COALESCE(p.content->'agent_actions', '{}'::jsonb))
                     AS agent_action_entry(key, value)
            ) agent_action_summary ON TRUE
           WHERE p.tenant_id = :'tenant_id'
           ORDER BY p.version DESC, p.created_at DESC;

          \echo 'spread sample of compliance findings with source decision, audit, and router confidence'
          WITH compliance_candidates AS (
            SELECT p.id,
                   p.created_at,
                   p.proposing_agent,
                   p.status,
                   p.policy_version,
                   p.policy_decision,
                   p.required_approvers,
                   p.policy_trace,
                   p.action
              FROM proposals p
             WHERE p.tenant_id = :'tenant_id'
               AND p.action->>'agent_kind' = 'compliance'
               AND p.created_at >= current_timestamp - INTERVAL '30 days'
             ORDER BY p.created_at ASC, p.id ASC
             LIMIT 100
          ),
          bucketed_candidates AS (
            SELECT c.*,
                   ntile(8) OVER (ORDER BY c.created_at ASC, c.id ASC) AS sample_bucket
              FROM compliance_candidates c
          ),
          sampled_findings AS (
            SELECT DISTINCT ON (sample_bucket) *
              FROM bucketed_candidates
             ORDER BY sample_bucket, created_at ASC, id ASC
          )
          SELECT finding.sample_bucket,
                 finding.id AS compliance_proposal_id,
                 finding.created_at AS compliance_proposal_created_at,
                 finding.proposing_agent AS compliance_proposing_agent,
                 finding.status AS compliance_proposal_status,
                 finding.policy_version AS compliance_policy_version,
                 finding.policy_decision AS compliance_policy_decision,
                 finding.required_approvers AS compliance_required_approvers,
                 finding.action AS compliance_action_payload,
                 source_decision.id AS source_policy_decision_id,
                 source_decision.decided_at AS source_policy_decided_at,
                 source_decision.policy_id AS source_policy_id,
                 source_decision.policy_version AS source_policy_version,
                 source_decision.subject_type AS source_subject_type,
                 source_decision.subject_id AS source_subject_id,
                 source_decision.outcome AS source_policy_outcome,
                 source_decision.matched_rule_id AS source_matched_rule_id,
                 source_decision.required_approvers AS source_required_approvers,
                 source_decision.trace AS source_policy_trace,
                 source_audit.id AS source_audit_event_id,
                 source_audit.created_at AS source_audit_created_at,
                 source_audit.action AS source_audit_action,
                 source_audit.inputs AS source_audit_inputs,
                 source_audit.outputs AS source_audit_outputs,
                 original_proposal.id AS correlated_original_proposal_id,
                 original_proposal.created_at AS correlated_original_proposal_created_at,
                 original_proposal.status AS correlated_original_proposal_status,
                 original_proposal.action AS correlated_original_action_payload,
                 original_proposal.correlation_method AS original_action_correlation_method,
                 compliance_run.id AS compliance_agent_run_id,
                 compliance_run.created_at AS compliance_agent_run_created_at,
                 compliance_run.confidence AS router_confidence,
                 compliance_run.evidence_score AS router_evidence_score,
                 compliance_run.execution_mode AS router_execution_mode,
                 compliance_run.reason AS compliance_agent_run_reason,
                 routing.id AS routing_decision_id,
                 routing.confidence AS routing_decision_confidence,
                 routing.evidence_score AS routing_decision_evidence_score,
                 routing.reason AS routing_decision_reason,
                 router_audit.id AS router_selection_audit_id,
                 router_audit.created_at AS router_selection_audit_created_at,
                 router_audit.outputs->'signals' AS router_signal_components,
                 router_audit.outputs->>'confidence' AS router_selection_confidence,
                 router_audit.correlation_seconds AS router_audit_correlation_seconds
            FROM sampled_findings finding
            LEFT JOIN policy_decisions source_decision
              ON source_decision.tenant_id = :'tenant_id'
             AND source_decision.id = finding.action->>'policy_decision_id'
            LEFT JOIN audit_events source_audit
              ON source_audit.tenant_id = :'tenant_id'
             AND source_audit.id = finding.action->>'audit_event_id'
            LEFT JOIN LATERAL (
              SELECT p.id,
                     p.created_at,
                     p.status,
                     p.action,
                     'policy_trace_and_time_window'::text AS correlation_method
                FROM proposals p
               WHERE p.tenant_id = :'tenant_id'
                 AND source_decision.id IS NOT NULL
                 AND p.policy_decision = source_decision.outcome
                 AND p.policy_version = source_decision.policy_version
                 AND p.policy_trace = source_decision.trace
                 AND p.created_at BETWEEN source_decision.decided_at - INTERVAL '5 seconds'
                                      AND source_decision.decided_at + INTERVAL '5 seconds'
               ORDER BY ABS(EXTRACT(EPOCH FROM (p.created_at - source_decision.decided_at))), p.id
               LIMIT 1
            ) original_proposal ON TRUE
            LEFT JOIN agent_runs compliance_run
              ON compliance_run.tenant_id = :'tenant_id'
             AND compliance_run.proposal_id = finding.id
            LEFT JOIN agent_routing_decisions routing
              ON routing.tenant_id = :'tenant_id'
             AND routing.id = compliance_run.routing_decision_id
            LEFT JOIN LATERAL (
              SELECT ae.id,
                     ae.created_at,
                     ae.outputs,
                     ABS(EXTRACT(EPOCH FROM (ae.created_at - compliance_run.created_at)))
                       AS correlation_seconds
                FROM audit_events ae
               WHERE ae.tenant_id = :'tenant_id'
                 AND ae.action = 'agent.router.selected'
                 AND ae.outputs->>'selected_agent_id' = 'compliance'
                 AND compliance_run.created_at IS NOT NULL
                 AND ae.created_at BETWEEN compliance_run.created_at - INTERVAL '5 seconds'
                                       AND compliance_run.created_at + INTERVAL '5 seconds'
               ORDER BY ABS(EXTRACT(EPOCH FROM (ae.created_at - compliance_run.created_at))), ae.id
               LIMIT 1
            ) router_audit ON TRUE
           ORDER BY finding.created_at ASC, finding.id ASC;

          \echo 'wiki.question audit payloads'
          SELECT id,
                 created_at,
                 actor,
                 event_type,
                 severity,
                 inputs,
                 outputs,
                 policy_decision_id
            FROM audit_events
           WHERE tenant_id = :'tenant_id'
             AND action = 'wiki.question'
             AND (:'wiki_question_event_id' = '' OR id = :'wiki_question_event_id')
             AND (
               NULLIF(:'wiki_question_since', '') IS NULL
               OR created_at >= NULLIF(:'wiki_question_since', '')::timestamptz
             )
             AND (
               NULLIF(:'wiki_question_until', '') IS NULL
               OR created_at <= NULLIF(:'wiki_question_until', '')::timestamptz
             )
             AND (:'wiki_question_search' = ''
                  OR inputs->>'question' ILIKE '%' || :'wiki_question_search' || '%')
           ORDER BY created_at DESC
           LIMIT 20;

          COMMIT;
          SQL
          echo "::endgroup::"

          if [[ "$INGESTION_LINEAGE" == "true" ]]; then
            echo "::group::ingestion lineage"
            docker exec -i brain-prod-postgres psql -U brain -d brain \
              -v ON_ERROR_STOP=1 \
              -v tenant_id="$TENANT_ID" <<'SQL'
            \pset pager off
            \pset null '(null)'
            BEGIN TRANSACTION READ ONLY;
            SET LOCAL statement_timeout = '5s';
            SET LOCAL lock_timeout = '1s';

            \echo 'raw artifacts and projection status'
            SELECT ra.id AS raw_artifact_id,
                   ra.ingested_at,
                   ra.source_type,
                   ra.mime_type,
                   ra.bytes,
                   to_jsonb(ra)->>'source_schema' AS source_schema,
                   to_jsonb(ra)->>'object_type' AS object_type,
                   to_jsonb(ra)->>'external_id' AS external_id,
                   to_jsonb(ra)->>'operation' AS operation,
                   to_jsonb(ra)->>'effective_at' AS effective_at,
                   to_jsonb(ra)->>'observed_at' AS observed_at,
                   to_jsonb(ra)->>'original_source' AS original_source,
                   to_jsonb(ra)->>'source_id' AS source_id,
                   to_jsonb(ra)->>'source_version' AS source_version,
                   to_jsonb(ra)->>'idempotency_key' AS idempotency_key,
                   ra.source_ref,
                   to_jsonb(ra)->>'projection_status' AS projection_status,
                   to_jsonb(ra)->>'projection_status_updated_at' AS projection_status_updated_at,
                   COUNT(rp.id) AS parsed_row_count
              FROM raw_artifacts ra
              LEFT JOIN raw_parsed rp
                ON rp.tenant_id = ra.tenant_id
               AND rp.raw_artifact_id = ra.id
             WHERE ra.tenant_id = :'tenant_id'
             GROUP BY ra.id
             ORDER BY ra.ingested_at ASC, ra.id ASC;

            \echo 'parsed extraction payloads'
            SELECT rp.id AS raw_parsed_id,
                   rp.raw_artifact_id,
                   rp.parser,
                   rp.parser_version,
                   rp.confidence,
                   rp.extracted_at,
                   rp.extracted AS extracted_payload
              FROM raw_parsed rp
             WHERE rp.tenant_id = :'tenant_id'
             ORDER BY rp.extracted_at ASC, rp.id ASC;

            \echo 'raw interpretation outcomes'
            SELECT ril.raw_artifact_id,
                   ril.source_schema,
                   ril.parsed_id,
                   ril.error,
                   ril.attempt_count,
                   ril.next_attempt_at,
                   ril.interpreted_at
              FROM raw_interpretation_log ril
             WHERE ril.tenant_id = :'tenant_id'
             ORDER BY ril.interpreted_at ASC, ril.raw_artifact_id ASC;

            \echo 'document extraction job outcomes'
            SELECT ej.id AS extraction_job_id,
                   ej.raw_id AS raw_artifact_id,
                   ej.status,
                   ej.parsed_id,
                   ej.confidence,
                   ej.error,
                   ej.attempt_count,
                   ej.next_attempt_at,
                   ej.requested_by,
                   ej.started_at,
                   ej.finished_at,
                   ej.created_at,
                   ej.updated_at
              FROM extraction_jobs ej
             WHERE ej.tenant_id = :'tenant_id'
             ORDER BY ej.created_at ASC, ej.id ASC;

            \echo 'canonical projection log'
            SELECT cpl.raw_parsed_id,
                   rp.raw_artifact_id,
                   cpl.projector,
                   cpl.domain,
                   cpl.records_written,
                   cpl.error,
                   to_jsonb(cpl)->>'quarantined' AS quarantined,
                   cpl.parsed_extracted_at,
                   cpl.projected_at
              FROM canonical_projection_log cpl
              LEFT JOIN raw_parsed rp
                ON rp.tenant_id = cpl.tenant_id
               AND rp.id = cpl.raw_parsed_id
             WHERE cpl.tenant_id = :'tenant_id'
             ORDER BY cpl.projected_at ASC, cpl.raw_parsed_id ASC;

            \echo 'canonical counterparties'
            SELECT id,
                   source_system,
                   source_natural_key,
                   name,
                   type,
                   provenance,
                   confidence,
                   source_ids,
                   evidence_ids,
                   extensions,
                   created_at,
                   updated_at
              FROM canonical_counterparty
             WHERE tenant_id = :'tenant_id'
             ORDER BY source_system, source_natural_key, id;

            \echo 'canonical obligations'
            SELECT id,
                   source_system,
                   source_natural_key,
                   direction,
                   type,
                   canonical_counterparty_id,
                   counterparty_source_key,
                   amount,
                   currency,
                   issue_date,
                   due_date,
                   status,
                   provenance,
                   confidence,
                   source_ids,
                   evidence_ids,
                   extensions,
                   created_at,
                   updated_at
              FROM canonical_obligation
             WHERE tenant_id = :'tenant_id'
             ORDER BY source_system, source_natural_key, id;

            \echo 'ledger counterparties'
            SELECT lc.id,
                   lc.name,
                   lc.type,
                   lc.provenance,
                   lc.confidence,
                   lc.source_ids,
                   lc.evidence_ids,
                   to_jsonb(lc)->'metadata' AS metadata,
                   lc.created_at,
                   lc.updated_at
              FROM ledger_counterparties lc
             WHERE lc.owner_id = :'tenant_id'
             ORDER BY lc.name, lc.id;

            \echo 'ledger invoices'
            SELECT li.id,
                   li.invoice_number,
                   li.counterparty_id,
                   lc.name AS counterparty_name,
                   li.amount_due,
                   li.amount_paid,
                   li.currency,
                   li.issue_date,
                   li.due_date,
                   li.status,
                   li.provenance,
                   li.confidence,
                   li.source_ids,
                   li.evidence_ids,
                   to_jsonb(li)->'metadata' AS metadata,
                   li.created_at,
                   li.updated_at
              FROM ledger_invoices li
              LEFT JOIN ledger_counterparties lc
                ON lc.owner_id = li.owner_id
               AND lc.id = li.counterparty_id
             WHERE li.owner_id = :'tenant_id'
             ORDER BY li.issue_date, li.invoice_number, li.id;

            \echo 'ledger obligations'
            SELECT lo.id,
                   lo.type,
                   to_jsonb(lo)->>'direction' AS direction,
                   lo.counterparty_id,
                   lc.name AS counterparty_name,
                   lo.amount_due,
                   lo.minimum_due,
                   lo.currency,
                   lo.due_date,
                   lo.status,
                   lo.provenance,
                   lo.confidence,
                   lo.source_ids,
                   lo.evidence_ids,
                   to_jsonb(lo)->'metadata' AS metadata,
                   lo.created_at,
                   lo.updated_at
              FROM ledger_obligations lo
              LEFT JOIN ledger_counterparties lc
                ON lc.owner_id = lo.owner_id
               AND lc.id = lo.counterparty_id
             WHERE lo.owner_id = :'tenant_id'
             ORDER BY lo.due_date, lo.id;

            COMMIT;
          SQL
            echo "::endgroup::"
          fi

          if [[ "$PROPOSAL_READ_MODEL_SMOKE" == "true" ]]; then
            echo "::group::proposal read-model HTTP smoke"
            cd ~/brain-core
            set -a
            # Keep the platform secret on the VM. The workflow only prints sanitized
            # proposal field summaries from the authenticated read response.
            . ./.env.prod
            set +a
            if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
              echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on the VM"
              exit 1
            fi

            external_ref="$(
              docker exec -i brain-prod-postgres psql -U brain -d brain -At \
                -v ON_ERROR_STOP=1 \
                -v tenant_id="$TENANT_ID" <<'SQL'
              SELECT l.external_ref
                FROM member_identity_links l
                JOIN members m
                  ON m.tenant_id = l.tenant_id
                 AND m.id = l.member_id
               WHERE l.tenant_id = :'tenant_id'
                 AND l.surface = 'platform'
                 AND m.status = 'active'
               ORDER BY CASE WHEN m.role = 'admin' THEN 0 ELSE 1 END,
                        l.linked_at ASC
               LIMIT 1;
          SQL
            )"
            if [[ -z "$external_ref" ]]; then
              echo "No active platform identity link found for tenant"
              exit 1
            fi

            session_json="$(
              docker exec -e EXTERNAL_REF="$external_ref" brain-prod-api node -e '
                const externalRef = process.env.EXTERNAL_REF;
                process.stdout.write(JSON.stringify({
                  external_ref: externalRef,
                  scopes: ["execution:read"],
                }));
              ' | curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
                -X POST https://api.brain.fi/v1/sessions \
                -H "Content-Type: application/json" \
                -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
                --data-binary @-
            )"
            token="$(
              printf '%s' "$session_json" | docker exec -i brain-prod-api node -e '
                let body = "";
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  const parsed = JSON.parse(body);
                  if (typeof parsed.token !== "string" || parsed.token.length === 0) {
                    process.exit(1);
                  }
                  process.stdout.write(parsed.token);
                });
              '
            )"
            proposals_response="$(
              curl -sS --retry 2 --connect-timeout 10 --max-time 30 \
                "https://api.brain.fi/v1/proposals?status=pending&limit=100" \
                -H "Authorization: Bearer ${token}" \
                -w $'\n%{http_code}'
            )"
            proposals_status="${proposals_response##*$'\n'}"
            proposals_json="${proposals_response%$'\n'*}"
            if [[ "$proposals_status" != "200" ]]; then
              echo "GET /v1/proposals returned HTTP $proposals_status"
              printf '%s\n' "$proposals_json"
              echo "recent api logs:"
              docker compose -p brain-prod --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.caddy.yml \
                logs --tail=200 api | tail -n 120 || true
              exit 1
            fi
            cat > /tmp/proposal-read-model-smoke.js <<'NODE'
            let body = "";
            process.stdin.on("data", (chunk) => { body += chunk; });
            process.stdin.on("end", () => {
              const parsed = JSON.parse(body);
              const proposals = Array.isArray(parsed.proposals) ? parsed.proposals : [];
              const targets = [
                "flag_transaction",
                "cash_forecast",
                "treasury",
                "flag_subscription",
                "notify",
              ];
              const fieldNames = [
                "details",
                "policy",
                "presentation",
                "available_decisions",
                "stored_action_type",
              ];

              const meaningful = (value) => {
                if (value === null || value === undefined) return false;
                if (typeof value === "string") return value.trim().length > 0;
                if (typeof value === "number" || typeof value === "boolean") return true;
                if (Array.isArray(value)) return value.length > 0;
                if (typeof value === "object") {
                  return Object.values(value).some((child) => meaningful(child));
                }
                return false;
              };
              const matchesTarget = (proposal, target) =>
                proposal.stored_action_type === target ||
                proposal.type === target ||
                proposal.details?.type === target ||
                proposal.details?.kind === target ||
                proposal.details?.agent_role === target ||
                proposal.details?.agent_id === target;

              const failures = [];
              const summaries = [];
              for (const target of targets) {
                const proposal = proposals.find((candidate) => matchesTarget(candidate, target));
                if (proposal === undefined) {
                  failures.push(`${target}: no matching pending proposal returned`);
                  continue;
                }
                const missing = fieldNames.filter((field) => !meaningful(proposal[field]));
                if (missing.length > 0) {
                  failures.push(`${target}: empty fields ${missing.join(", ")}`);
                }
                summaries.push({
                  target,
                  id: proposal.id,
                  type: proposal.type,
                  status: proposal.status,
                  stored_action_type: proposal.stored_action_type,
                  details_keys: Object.keys(proposal.details ?? {}).slice(0, 12),
                  policy_decision: proposal.policy?.decision ?? null,
                  policy_id: proposal.policy?.policy_id ?? null,
                  matched_rule_id: proposal.policy?.matched_rule_id ?? null,
                  available_decisions: (proposal.available_decisions ?? []).map((item) => item.id),
                  presentation_headline: proposal.presentation?.headline ?? null,
                  presentation_key_fact_count: proposal.presentation?.key_facts?.length ?? 0,
                });
              }
              console.log(JSON.stringify({ checked: targets, summaries }, null, 2));
              if (failures.length > 0) {
                console.error(JSON.stringify({ failures }, null, 2));
                process.exit(1);
              }
            });
          NODE
            docker cp /tmp/proposal-read-model-smoke.js brain-prod-api:/tmp/proposal-read-model-smoke.js
            printf '%s' "$proposals_json" | docker exec -i brain-prod-api node /tmp/proposal-read-model-smoke.js
            docker exec brain-prod-api rm -f /tmp/proposal-read-model-smoke.js
            rm -f /tmp/proposal-read-model-smoke.js
            echo "::endgroup::"
          fi
          REMOTE
