name: ops-postgres-owner-password

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect or repair."
        required: true
        type: choice
        options:
          - staging
          - production
          - both
      mode:
        description: "inspect reports status only; ensure rotates missing, blank, or weak POSTGRES_PASSWORD and aligns the brain role."
        required: true
        type: choice
        options:
          - inspect
          - ensure
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    name: staging Postgres owner password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'staging' || inputs.target == 'both'
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      # docker-compose.prod.yml hard-codes container_name: brain-prod-postgres.
      POSTGRES_CONTAINER: brain-prod-postgres
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure Postgres owner password
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' POSTGRES_CONTAINER='$POSTGRES_CONTAINER' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi

          line="$(grep -E '^POSTGRES_PASSWORD=' "$VM_ENV_FILE" | tail -n 1 || true)"
          status="present_strong"
          if [[ -z "$line" ]]; then
            status="missing"
          elif [[ "$line" == "POSTGRES_PASSWORD=" ]]; then
            status="blank"
          else
            value="${line#POSTGRES_PASSWORD=}"
            normalized="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              brain|postgres|changeme|password)
                status="weak_default"
                ;;
            esac
          fi

          role_exists="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain');" 2>/dev/null || echo unknown)"

          if [[ "$MODE" == "ensure" && "$status" != "present_strong" ]]; then
            secret="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            chmod --reference="$VM_ENV_FILE" "$tmp"
            awk -v secret="$secret" '
              BEGIN { replaced = 0 }
              /^POSTGRES_PASSWORD=/ {
                if (replaced == 0) {
                  print "POSTGRES_PASSWORD=" secret
                  replaced = 1
                }
                next
              }
              { print }
              END {
                if (replaced == 0) {
                  print "POSTGRES_PASSWORD=" secret
                }
              }
            ' "$VM_ENV_FILE" > "$tmp"
            printf "ALTER ROLE brain WITH PASSWORD '%s';\n" "$secret" \
              | docker exec -i "$POSTGRES_CONTAINER" psql -U brain -d brain -v ON_ERROR_STOP=1 >/dev/null
            mv "$tmp" "$VM_ENV_FILE"
            status="rotated_from_${status}"
          fi

          role_exists_after="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain');" 2>/dev/null || echo unknown)"
          echo "env_file=$VM_ENV_FILE"
          echo "POSTGRES_PASSWORD_status=$status"
          echo "brain_role_exists_before=$role_exists"
          echo "brain_role_exists_after=$role_exists_after"
          REMOTE

  production:
    name: production Postgres owner password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'production' || inputs.target == 'both'
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_ENV_FILE: .env.prod
      POSTGRES_CONTAINER: brain-prod-postgres
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure Postgres owner password
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' POSTGRES_CONTAINER='$POSTGRES_CONTAINER' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi

          line="$(grep -E '^POSTGRES_PASSWORD=' "$VM_ENV_FILE" | tail -n 1 || true)"
          status="present_strong"
          if [[ -z "$line" ]]; then
            status="missing"
          elif [[ "$line" == "POSTGRES_PASSWORD=" ]]; then
            status="blank"
          else
            value="${line#POSTGRES_PASSWORD=}"
            normalized="$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')"
            case "$normalized" in
              brain|postgres|changeme|password)
                status="weak_default"
                ;;
            esac
          fi

          role_exists="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain');" 2>/dev/null || echo unknown)"

          if [[ "$MODE" == "ensure" && "$status" != "present_strong" ]]; then
            secret="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            chmod --reference="$VM_ENV_FILE" "$tmp"
            awk -v secret="$secret" '
              BEGIN { replaced = 0 }
              /^POSTGRES_PASSWORD=/ {
                if (replaced == 0) {
                  print "POSTGRES_PASSWORD=" secret
                  replaced = 1
                }
                next
              }
              { print }
              END {
                if (replaced == 0) {
                  print "POSTGRES_PASSWORD=" secret
                }
              }
            ' "$VM_ENV_FILE" > "$tmp"
            printf "ALTER ROLE brain WITH PASSWORD '%s';\n" "$secret" \
              | docker exec -i "$POSTGRES_CONTAINER" psql -U brain -d brain -v ON_ERROR_STOP=1 >/dev/null
            mv "$tmp" "$VM_ENV_FILE"
            status="rotated_from_${status}"
          fi

          role_exists_after="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain');" 2>/dev/null || echo unknown)"
          echo "env_file=$VM_ENV_FILE"
          echo "POSTGRES_PASSWORD_status=$status"
          echo "brain_role_exists_before=$role_exists"
          echo "brain_role_exists_after=$role_exists_after"
          REMOTE
