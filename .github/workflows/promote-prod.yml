# Brain manual production promotion.
# Decoupled from main.yml so that promoting production is not gated inside
# the same run as build + staging deploy. When promote_production lived in
# main.yml, GitHub's concurrency semantics meant the OLDEST queued run held
# the production approval slot, so approving it could ship a stale SHA while
# newer runs piled up as cancelled noise. This workflow is dispatched by hand,
# resolves the SHA to promote (explicit input, or whatever commit is
# currently live on staging), and deploys exactly that.

name: promote-prod

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to promote. Leave blank to promote whatever is currently live on staging."
        required: false
        type: string
        default: ""

jobs:
  promote:
    name: promote production VM (api.brain.fi)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the deploy/prod/* review tag after a green promote
    environment: production
    # Single slot: never promote two SHAs to prod at once.
    concurrency:
      group: promote-prod
      cancel-in-progress: false # never cancel a deploy mid-flight
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_ENV_FILE: .env.prod
      COMPOSE_PROJECT: brain-prod
      HEALTH_URL: https://api.brain.fi/health
    steps:
      # Resolve which commit to promote before checking anything out. An
      # explicit input always wins; otherwise ask staging what it's
      # currently running, so "promote production" defaults to "match
      # staging" rather than requiring the operator to look up a SHA by hand.
      - name: Resolve SHA
        id: resolve
        run: |
          sha="${{ inputs.sha }}"
          if [ -z "$sha" ]; then
            body=$(curl -s https://staging-api.brain.fi/health || true)
            sha=$(echo "$body" | grep -o '"commit":"[^"]*"' | sed 's/.*:"//;s/"$//')
          fi
          if [ -z "$sha" ]; then
            echo "Could not resolve a SHA to promote (no input given and staging-api.brain.fi/health returned no commit)."
            exit 1
          fi
          echo "Promoting commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Check out the resolved SHA, not whatever triggered this dispatch, so
      # the compose file / db-roles.sql / scripts shipped to the box match
      # the image being deployed below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      # Images alone are not enough: the VM's ~/brain-core is a copied tree,
      # not a git checkout, so changes to docker-compose.prod.yml and the
      # host files it bind-mounts into containers (db-roles.sql,
      # tools/postgres-init, docker-compose.caddy.yml, Caddyfile) never reach
      # the box on their own. Ship exactly the repo-tracked paths compose
      # depends on, before any compose invocation below. VM_ENV_FILE remains
      # host-only, it is not in this repo. The caddy container mounts the
      # Caddyfile read-only, so shipping it here is not enough on its own to
      # apply it, see the Caddy reload step below.
      - name: Sync compose and bind-mounted host files to VM
        run: |
          ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" \
            'mkdir -p ~/brain-core/infra ~/brain-core/tools/postgres-init'
          scp -i ~/.ssh/id_deploy docker-compose.prod.yml "azureuser@$VM_HOST:~/brain-core/docker-compose.prod.yml"
          if [ -f docker-compose.caddy.yml ]; then
            scp -i ~/.ssh/id_deploy docker-compose.caddy.yml "azureuser@$VM_HOST:~/brain-core/docker-compose.caddy.yml"
          fi
          if [ -f Caddyfile ]; then
            scp -i ~/.ssh/id_deploy Caddyfile "azureuser@$VM_HOST:~/brain-core/Caddyfile"
          fi
          scp -i ~/.ssh/id_deploy infra/db-roles.sql "azureuser@$VM_HOST:~/brain-core/infra/db-roles.sql"
          scp -i ~/.ssh/id_deploy -r tools/postgres-init/. "azureuser@$VM_HOST:~/brain-core/tools/postgres-init/"

      # Prune images untouched for 24h+ so the rollback tags minted
      # above don't accumulate forever and fill the disk. `docker image
      # prune -a` never removes an image a container (running or stopped)
      # still references, so the live stack stays safe even on a box that
      # hasn't deployed in over a day. `|| true` so a prune failure never
      # blocks a deploy. 24h rather than 72h for the disk-pressure reason
      # spelled out in deploy_staging's matching step in main.yml.
      - name: Tag rollback images on VM
        run: |
          ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" \
            'ts=$(date +%Y%m%d-%H%M%S); docker tag brain-core:prod brain-core:prod-rollback-$ts || true; docker tag brain-agents:prod brain-agents:prod-rollback-$ts || true; docker image prune -af --filter until=24h || true'

      - name: Pull images from GHCR
        # See deploy_staging's "Pull images from GHCR" step: relies on the box's
        # stored `docker login`, no token over SSH; retag keeps compose unchanged.
        # Pulls by the resolved SHA, not the dispatch SHA: build_image already
        # pushed ghcr.io/braindotfi/brain-core:<sha> and brain-agents:<sha> for
        # every merged commit, so this works for any SHA that landed on main.
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "docker pull ghcr.io/braindotfi/brain-core:${{ steps.resolve.outputs.sha }} && \
             docker pull ghcr.io/braindotfi/brain-agents:${{ steps.resolve.outputs.sha }} && \
             docker tag ghcr.io/braindotfi/brain-core:${{ steps.resolve.outputs.sha }} brain-core:prod && \
             docker tag ghcr.io/braindotfi/brain-agents:${{ steps.resolve.outputs.sha }} brain-agents:prod"

      # Cold-start safety: bring up infra + caddy if the box is fresh.
      # Idempotent on a warm box: --no-recreate leaves running containers
      # (incl. postgres) untouched; depends_on sequences a cold box correctly.
      #
      # The one-shots (migrate, db-roles) are deliberately NOT in this list.
      # --no-recreate restarts the *existing* container, which is frozen with
      # the entrypoint and image id of the last deploy, while the files it
      # bind-mounts (infra/db-roles.sql) are the freshly shipped ones. That
      # mismatch broke the deploy right after the sync step landed: the old
      # db-roles entrypoint had no -v for the new role passwords, so psql got
      # an unsubstituted :'var' and exited 3. The next step runs both as
      # `run --rm`, which always builds a fresh container from the current
      # compose file, so they belong there and only there.
      - name: Ensure infra up on VM (cold-start safe)
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [ -f docker-compose.caddy.yml ] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             compose=\"docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files\"; \
             services=\$(\$compose --profile agents config --services); \
             up_services=''; \
             for service in postgres redis minio minio-setup jwks caddy; do \
               echo \"\$services\" | grep -qx \"\$service\" && up_services=\"\$up_services \$service\"; \
             done; \
             [ -n \"\$up_services\" ] && \$compose up -d --no-build --no-recreate \$up_services"

      # `auth` is now the single JWKS source for api/worker/surface-gateway
      # (Phase 4, OAUTH-AS-PLAN.md section 8), and it boots behind five
      # independent process.exit(1) fences (AUTH_SIGN_KEY, AUTH_COOKIE_SECRET,
      # a valid AUTH_ISSUER, the three BRAIN_*_DB_URL role URLs, and the
      # EMAIL_ENDPOINT/EMAIL_API_KEY pair) where the retired `jwks` sidecar had
      # exactly one. `docker compose up -d` exits 0 even when the container
      # dies moments later, so recreate `auth` alone first and prove it is
      # actually listening (next step) BEFORE recreating anything that
      # verifies tokens against it.
      - name: Migrate + recreate auth on VM
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [ -f docker-compose.caddy.yml ] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             compose=\"docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files\"; \
             services=\$(\$compose --profile agents config --services); \
             \$compose run --rm --no-deps migrate node tools/migrate/dist/cli.js up && \
             \$compose run --rm --no-deps db-roles && \
             if echo \"\$services\" | grep -qx auth; then \
               (\$compose up -d --no-deps --no-build auth || \
                (\$compose logs --tail=200 auth && false)); \
             else \
               echo 'auth service not defined by target compose; skipping auth recreate'; \
             fi"

      # Pre-flight gate, not the post-recreate smoke below (that one stays
      # where it is). auth opens three Postgres pools before it starts
      # listening, so give it a bounded wait rather than a single curl.
      # auth.brain.fi DNS does not resolve yet, so this SSHes into the VM and
      # curls the container's 127.0.0.1-bound port directly instead of going
      # over Caddy/DNS, same as the post-recreate auth smoke test below.
      - name: Wait for auth healthy on VM before recreating verifiers
        run: |
          expected="${{ steps.resolve.outputs.sha }}"
          has_auth=$(ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [ -f docker-compose.caddy.yml ] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files --profile agents config --services | grep -qx auth && echo yes || echo no")
          if [ "$has_auth" != "yes" ]; then
            echo "auth service not defined by target compose; skipping auth health gate"
            exit 0
          fi
          last_commit=""
          for i in $(seq 1 10); do
            body=$(ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" 'curl -s http://localhost:3003/healthz' || true)
            last_commit=$(echo "$body" | grep -o '"commit":"[^"]*"' | sed 's/.*:"//;s/"$//')
            [ "$last_commit" = "$expected" ] && exit 0
            sleep 6
          done
          echo "auth /healthz never reported commit=$expected before recreating api/worker/surface-gateway (last seen: '$last_commit')"
          exit 1

      # --no-deps here too: auth was just recreated above and proven healthy,
      # so it is deliberately left out of this list rather than recreated
      # twice.
      - name: Recreate api/worker/agents/surface-gateway on VM
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [ -f docker-compose.caddy.yml ] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             compose=\"docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files\"; \
             compose_agents=\"\$compose --profile agents\"; \
             services=\$(\$compose_agents config --services); \
             app_services=''; \
             for service in api worker agents surface-gateway; do \
               echo \"\$services\" | grep -qx \"\$service\" && app_services=\"\$app_services \$service\"; \
             done; \
             ( [ -n \"\$app_services\" ] && \$compose_agents up -d --no-deps --no-build \$app_services || exit 1 ) || \
              (\$compose_agents logs --tail=200 \$app_services && false)"

      # The Caddyfile shipped above is bind-mounted read-only into the caddy
      # container; a plain scp does not make Caddy re-read it, and the infra
      # step above uses --no-recreate so a warm caddy container is left
      # untouched. Caddy reload applies the new config over its local admin
      # API without dropping connections.
      #
      # This runs AFTER migrate/recreate, not before: nothing about
      # api.brain.fi or mcp.brain.fi routing depends on the reload running
      # first (those Caddyfile blocks are unchanged), and a reload failure
      # here must never abort an approved production deploy before
      # api/worker/agents/auth are recreated. Two real triggers for that
      # failure: on a cold box the infra step's `up -d --no-recreate` returns
      # as soon as the caddy container starts, before its admin API on
      # localhost:2019 is listening (`caddy reload` then exits with
      # connection refused); and a crashed or restarting caddy container makes
      # `docker compose exec` itself exit 1. The retry loop below self-heals
      # both. `caddy reload` validates the new config before applying it and
      # keeps serving the old config on failure, so a genuinely invalid config
      # still fails this step (fail loud) once retries are exhausted. `-T`:
      # no other step in this repo runs `compose exec`, so there is no in-repo
      # evidence this box's compose version defaults correctly over a non-tty
      # ssh session; it costs nothing to pass explicitly.
      - name: Reload Caddy config on VM
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [ -f docker-compose.caddy.yml ] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             compose=\"docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files\"; \
             services=\$(\$compose --profile agents config --services); \
             if ! echo \"\$services\" | grep -qx caddy; then \
               echo 'caddy service not defined by target compose; skipping caddy reload'; \
               exit 0; \
             fi; \
             ok=0; \
             for i in 1 2 3 4 5; do \
               \$compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile && ok=1 && break; \
               sleep 3; \
             done; \
             [ \$ok -eq 1 ]"

      - name: Smoke test /health
        # A bare 200 is not enough: /health returns 200 before a deploy too, so
        # a deploy that silently failed to recreate the container would still
        # pass. Assert the live commit matches the SHA we resolved and shipped.
        run: |
          expected="${{ steps.resolve.outputs.sha }}"
          last_commit=""
          for i in $(seq 1 10); do
            body=$(curl -s "$HEALTH_URL" || true)
            last_commit=$(echo "$body" | grep -o '"commit":"[^"]*"' | sed 's/.*:"//;s/"$//')
            [ "$last_commit" = "$expected" ] && exit 0
            sleep 6
          done
          echo "$HEALTH_URL never reported commit=$expected (last seen: '$last_commit')"
          exit 1

      # docker compose up returning 0 only means the container started; a
      # node process that exits(1) moments later (e.g. missing/malformed
      # AUTH_SIGN_KEY, see services/auth/src/main.ts) is invisible to that
      # exit code and would otherwise ship a green promote with a dead
      # authorization server. auth.brain.fi DNS does not resolve yet
      # (OAUTH-AS-PLAN.md), so this SSHes into the VM and curls the container's
      # 127.0.0.1-bound port directly instead of going over Caddy/DNS.
      - name: Smoke test auth /healthz
        run: |
          expected="${{ steps.resolve.outputs.sha }}"
          has_auth=$(ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [ -f docker-compose.caddy.yml ] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files --profile agents config --services | grep -qx auth && echo yes || echo no")
          if [ "$has_auth" != "yes" ]; then
            echo "auth service not defined by target compose; skipping auth smoke test"
            exit 0
          fi
          last_commit=""
          for i in $(seq 1 10); do
            body=$(ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" 'curl -s http://localhost:3003/healthz' || true)
            last_commit=$(echo "$body" | grep -o '"commit":"[^"]*"' | sed 's/.*:"//;s/"$//')
            [ "$last_commit" = "$expected" ] && exit 0
            sleep 6
          done
          echo "auth /healthz never reported commit=$expected (last seen: '$last_commit')"
          exit 1

      - name: Tag deployed commit for review
        # Lightweight tag recording exactly what shipped to prod, so every deploy
        # is reviewable by tag. Non-`v*` namespace so it never becomes a
        # `git describe` base (those are human tier tags only: v0.1.0, v1.0.0).
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          tag="deploy/prod/${ts}-$(echo '${{ steps.resolve.outputs.sha }}' | cut -c1-7)"
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs" \
            -d "{\"ref\":\"refs/tags/${tag}\",\"sha\":\"${{ steps.resolve.outputs.sha }}\"}"
          echo "Tagged prod deploy: ${tag}"
