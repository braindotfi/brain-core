# Brain production deploy to managed Azure (brain-production-rg, canadacentral).
#
# Separate from promote-prod.yml, which deploys the legacy single VM over SSH.
# Both exist while the VM is still authoritative; this one becomes the only
# production path once DNS moves. Do not merge them -- they target different
# infrastructure with different failure modes.
#
# Auth is workload identity federation: no client secret is stored anywhere.
# The federated credential is bound to `environment:production`, so Azure will
# only mint a token for a run that a human has already approved through the
# environment's required-reviewers gate. The approval is part of the
# credential, not merely a workflow step.
#
# ⚠️ TERRAFORM DOES NOT RUN HERE. It runs in the in-VNet Container App Job
# `brain-production-terraform`, and this workflow only starts it and streams the
# result back. The Key Vault sits behind a private endpoint with
# `default_action = Deny`, and Terraform reads every azurerm_key_vault_secret
# during refresh -- so a plan from a public GitHub runner cannot even refresh,
# let alone apply. Starting the job goes through the ARM control plane, which is
# not IP-restricted. Do not "simplify" this back into a local terraform apply.
name: deploy-azure-prod

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy. Blank deploys the current main."
        required: false
        type: string
        default: ""
      terraform_action:
        description: "plan = dry run, changes nothing. apply = execute."
        required: false
        type: choice
        options: [apply, plan]
        default: apply
      build_images:
        description: "Build and push app images. Skip for an infra-only change; the app images then stay on whatever tag is already deployed."
        required: false
        type: boolean
        default: true
      run_migrations:
        description: "Run migrate -> db-roles after apply. Ignored for a plan."
        required: false
        type: boolean
        default: true
      terraform_target:
        description: "Optional space-separated -target addresses, to apply one change without sweeping in unrelated pending work."
        required: false
        type: string
        default: ""

permissions:
  id-token: write # OIDC token for azure/login
  contents: read

env:
  ACR: brainproductionacr
  RG: brain-production-rg
  API_APP: brain-production-api
  TF_JOB: brain-production-terraform
  ENV_NAME: brain-production-env

jobs:
  deploy:
    name: deploy production (Azure)
    runs-on: ubuntu-latest
    environment: production
    # Single slot: never run two production applies at once. Terraform's state
    # lock would reject the second anyway, but failing here is cleaner than
    # failing halfway through an apply.
    concurrency:
      group: deploy-azure-prod
      cancel-in-progress: false # never cancel a deploy mid-flight

    steps:
      - name: Resolve SHA
        id: resolve
        run: |
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          # Short form is the image tag. It must match what terraform asks for,
          # or the apply references a tag that was never pushed.
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo "$SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "deploying $SHA (tag $(echo "$SHA" | cut -c1-8))"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Every containerapp command below lives in an az EXTENSION. The default
      # install mode prompts, and a prompt on a non-interactive runner fails the
      # step rather than installing -- so opt in explicitly instead of relying on
      # whatever the hosted image happens to ship with.
      - name: Allow az extension installs
        run: az config set extension.use_dynamic_install=yes_without_prompt

      # A CI checkout has no node_modules, so the repo root is already a clean
      # build context. (Locally it is not -- az packs the context with a Python
      # walker that dies on Windows MAX_PATH inside node_modules/.pnpm, which is
      # why the local path uses `git archive` instead.)
      - name: Build and push app images
        if: ${{ inputs.build_images }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # az acr build resolves --file relative to the REPO ROOT, not to the
          # context argument. Naming it "Dockerfile" while passing a subdirectory
          # context pairs that context with the root Node image, which then fails
          # on a COPY of a file the subdirectory does not contain.
          az acr build --registry "$ACR" --image "brain-api:latest" --image "brain-api:${TAG}" --file Dockerfile .
          az acr build --registry "$ACR" --image "brain-agents:latest" --image "brain-agents:${TAG}" --file services/agents/Dockerfile services/agents
          az acr build --registry "$ACR" --image "brain-db-roles:latest" --image "brain-db-roles:${TAG}" --file infra/db-roles.Dockerfile infra

      # Unconditional, and deliberately not part of the step above: this image
      # CARRIES THE TERRAFORM CONFIG (infra/*.tf is COPYed in, there is no repo
      # clone inside the VNet). An infra-only deploy skips the app images and
      # still needs this one, or the runner would execute the previous commit's
      # config while reporting the new SHA.
      - name: Build and push the in-VNet runner image
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          az acr build --registry "$ACR" --image "brain-terraform:${TAG}" \
            --file infra/terraform.Dockerfile infra

      # image_tag is SHA-pinned, not "latest". Pushing a new :latest does NOT
      # roll a Container Apps revision -- revisions are created when the template
      # changes, and an unchanged image reference is an unchanged template. A
      # moving tag would silently leave the old build serving.
      #
      # When app images were not built, read the tag that is actually deployed
      # rather than assuming this SHA. Passing an unbuilt tag would point the
      # apps at images that do not exist, and the revision fails to provision.
      - name: Resolve app image tag
        id: apptag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_images }}" = "true" ]; then
            APP_TAG="$TAG"
          else
            APP_TAG=$(az containerapp show -n "$API_APP" -g "$RG" \
              --query "properties.template.containers[0].image" -o tsv | sed 's/.*://')
            echo "infra-only deploy: app images stay on the deployed tag '$APP_TAG'"
          fi
          echo "tag=$APP_TAG" >> "$GITHUB_OUTPUT"

      # ⚠️ `--env-vars` REPLACES the container spec, it does not merge. Anything
      # not re-passed is dropped, including the Key Vault secret reference the
      # runner authenticates with -- which surfaces as a confusing auth failure
      # rather than a missing-variable error. So the existing env is read back
      # from the job and replayed verbatim, with only the run-specific variables
      # overridden. That also means a rotated secret name or a changed client id
      # is picked up here automatically instead of drifting in this file.
      - name: Terraform via the in-VNet runner
        id: tf
        env:
          ACTION: ${{ inputs.terraform_action }}
          APP_TAG: ${{ steps.apptag.outputs.tag }}
          TF_TAG: ${{ steps.resolve.outputs.tag }}
          TARGET: ${{ inputs.terraform_target }}
        run: |
          set -euo pipefail

          mapfile -t JOB_ENV < <(
            az containerapp job show -n "$TF_JOB" -g "$RG" \
              --query "properties.template.containers[0].env" -o json |
            jq -r '
              .[]
              | select(.name | test("^(ACTION|TF_IMAGE_TAG|TF_TERRAFORM_IMAGE_TAG|TF_TARGET)$") | not)
              | if .secretRef then "\(.name)=secretref:\(.secretRef)" else "\(.name)=\(.value)" end
            '
          )
          if [ "${#JOB_ENV[@]}" -eq 0 ]; then
            echo "::error::read no env back from $TF_JOB; refusing to start it with a stripped spec"
            exit 1
          fi

          echo "action=$ACTION  image_tag=$APP_TAG  terraform_image_tag=$TF_TAG  target=${TARGET:-<all>}"

          EXEC=$(az containerapp job start -n "$TF_JOB" -g "$RG" \
            --image "${ACR}.azurecr.io/brain-terraform:${TF_TAG}" \
            --env-vars "${JOB_ENV[@]}" \
              "ACTION=${ACTION}" \
              "TF_IMAGE_TAG=${APP_TAG}" \
              "TF_TERRAFORM_IMAGE_TAG=${TF_TAG}" \
              "TF_TARGET=${TARGET}" \
            --query name -o tsv)
          echo "execution: $EXEC"
          echo "execution=$EXEC" >> "$GITHUB_OUTPUT"

          # The job's replica timeout is 3600s; poll a little past it. A Front
          # Door or Postgres change can legitimately run for tens of minutes.
          STATUS=""
          for _ in $(seq 1 190); do
            STATUS=$(az containerapp job execution show -n "$TF_JOB" -g "$RG" \
              --job-execution-name "$EXEC" --query properties.status -o tsv 2>/dev/null || echo "")
            case "$STATUS" in
              Succeeded) echo "terraform $ACTION: Succeeded"; exit 0 ;;
              Failed|Degraded) echo "::error::terraform $ACTION failed ($STATUS)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::terraform $ACTION timed out (last status: ${STATUS:-unknown})"
          exit 1

      # Always, and especially on failure: without this a failed apply reports a
      # status and nothing else. `az containerapp job logs show` does NOT work
      # here -- once the replica exits it answers "No replicas found" -- so the
      # output has to come from Log Analytics. Best-effort: a missing log must
      # not turn a good deploy red.
      - name: Terraform runner output
        if: ${{ always() && steps.tf.outputs.execution != '' }}
        continue-on-error: true
        env:
          EXEC: ${{ steps.tf.outputs.execution }}
        run: |
          set -uo pipefail
          az extension add -n log-analytics -y >/dev/null 2>&1 || true
          WS=$(az containerapp env show -n "$ENV_NAME" -g "$RG" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          echo "::group::terraform runner log ($EXEC)"
          az monitor log-analytics query -w "$WS" --analytics-query \
            "ContainerAppConsoleLogs_CL
             | where ContainerGroupName_s startswith '${EXEC}'
             | project TimeGenerated, Log_s
             | order by TimeGenerated asc
             | limit 5000" \
            -o json | jq -r '.[].Log_s' || echo "(log query failed; job status above is authoritative)"
          echo "::endgroup::"

      # Order is load-bearing and not enforceable by Terraform, which can only
      # order resource CREATION, never job EXECUTION:
      #   migrate -> db-roles
      # db-roles.sql grants by looping over tables that already exist, so
      # running it before migrate silently leaves the canonical and ledger
      # projector roles ungranted -- surfacing in production as 42501 every
      # ~10s rather than as a failed job.
      - name: Run database jobs
        if: ${{ inputs.run_migrations && inputs.terraform_action == 'apply' }}
        run: |
          set -euo pipefail

          run_job() {
            local job="$1"
            echo "::group::$job"
            local exec_name
            exec_name=$(az containerapp job start -n "$job" -g "$RG" --query name -o tsv)
            echo "execution: $exec_name"
            local status=""
            for _ in $(seq 1 60); do
              status=$(az containerapp job execution show -n "$job" -g "$RG" \
                --job-execution-name "$exec_name" --query properties.status -o tsv 2>/dev/null || echo "")
              case "$status" in
                Succeeded) echo "$job: Succeeded"; echo "::endgroup::"; return 0 ;;
                Failed|Degraded) echo "::error::$job failed ($status)"; echo "::endgroup::"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$job timed out (last status: $status)"
            echo "::endgroup::"
            return 1
          }

          run_job brain-production-migrate
          run_job brain-production-db-roles

      - name: Health check
        if: ${{ inputs.terraform_action == 'apply' }}
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show -n "$API_APP" -g "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "api: https://$FQDN"
          for i in $(seq 1 30); do
            code=$(curl -s -m 20 -o /tmp/health.json -w "%{http_code}" "https://$FQDN/health" || echo 000)
            if [ "$code" = "200" ]; then
              echo "health OK: $(cat /tmp/health.json)"
              # Fail the deploy if a healthy response reports the wrong build.
              grep -q '"ok":true' /tmp/health.json
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::health check never returned 200"
          exit 1
