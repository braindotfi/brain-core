name: ops-set-staging-email-config

on:
  workflow_dispatch:
    inputs:
      email_from:
        description: "New EMAIL_FROM address (must be on a domain verified with the ESP)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: apply new staging email config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      COMPOSE_PROJECT: brain-staging
      EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY_STAGING }}
      EMAIL_FROM: ${{ inputs.email_from }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      # Same upsert pattern as main.yml's "Enable staging API key auth" step:
      # a local patch file of KEY=value lines, a python script that replaces
      # matching keys in place (preserving everything else) and appends any
      # that are new, with a timestamped backup written before any change.
      # Only EMAIL_API_KEY and EMAIL_FROM are touched -- EMAIL_ENDPOINT is
      # left as-is (Resend's send endpoint is fixed and already correct).
      - name: Patch EMAIL_API_KEY and EMAIL_FROM on the VM
        run: |
          test -n "$EMAIL_API_KEY"
          test -n "$EMAIL_FROM"
          tmp="$(mktemp)"
          script_tmp="$(mktemp)"
          chmod 600 "$tmp"
          {
            printf 'EMAIL_API_KEY=%s\n' "$EMAIL_API_KEY"
            printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
          } > "$tmp"
          cat > "$script_tmp" <<'PY'
          from pathlib import Path
          import sys
          import time

          env_path = Path(sys.argv[1])
          patch_path = Path(sys.argv[2])
          updates = dict(line.split("=", 1) for line in patch_path.read_text().splitlines())
          existing = env_path.read_text().splitlines() if env_path.exists() else []
          seen = set()
          output = []

          for line in existing:
              key = line.split("=", 1)[0].strip() if "=" in line and not line.lstrip().startswith("#") else None
              if key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)

          if output and output[-1] != "":
              output.append("")
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")

          backup = env_path.with_name(f"{env_path.name}.bak-email-config-{time.strftime('%Y%m%d-%H%M%S')}")
          if env_path.exists():
              backup.write_text(env_path.read_text())
          env_path.write_text("\n".join(output) + "\n")
          patch_path.unlink(missing_ok=True)
          PY
          remote_tmp="/tmp/brain-email-config-${{ github.run_id }}-${{ github.run_attempt }}"
          remote_script="$remote_tmp.py"
          scp -i ~/.ssh/id_deploy "$tmp" "azureuser@$VM_HOST:$remote_tmp"
          scp -i ~/.ssh/id_deploy "$script_tmp" "azureuser@$VM_HOST:$remote_script"
          rm -f "$tmp" "$script_tmp"
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && python3 '$remote_script' '$VM_ENV_FILE' '$remote_tmp'; rc=\$?; rm -f '$remote_script' '$remote_tmp'; exit \$rc"

      # Both auth (hard boot fence, no flag) and api/worker/agents/surface-gateway
      # read these same shared vars, so both must be force-recreated to pick up
      # the change -- env_file contents are only read at container create time.
      # --force-recreate guarantees the pickup rather than relying on compose's
      # config-hash change detection.
      - name: Force-recreate auth on VM
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [[ -f docker-compose.caddy.yml ]] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files up -d --no-deps --no-build --force-recreate auth"

      - name: Wait for auth healthy on VM
        run: |
          for i in $(seq 1 10); do
            body=$(ssh -i ~/.ssh/id_deploy "azureuser@$VM_HOST" 'curl -s http://localhost:3003/healthz' || true)
            echo "$body" | grep -q '"ok":true' && exit 0
            sleep 6
          done
          echo "auth /healthz never reported ok:true after recreate"
          exit 1

      - name: Force-recreate api/worker/agents/surface-gateway on VM
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "cd ~/brain-core && \
             compose_files='-f docker-compose.prod.yml'; \
             [[ -f docker-compose.caddy.yml ]] && compose_files=\"\$compose_files -f docker-compose.caddy.yml\"; \
             docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE \$compose_files --profile agents up -d --no-deps --no-build --force-recreate api worker agents surface-gateway"

      - name: Wait for api healthy on VM
        run: |
          for i in $(seq 1 10); do
            body=$(curl -s https://staging-api.brain.fi/health || true)
            echo "$body" | grep -q '"ok":true' && exit 0
            sleep 6
          done
          echo "https://staging-api.brain.fi/health never reported ok:true after recreate"
          exit 1
