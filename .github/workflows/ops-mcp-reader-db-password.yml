name: ops-mcp-reader-db-password

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect or repair."
        required: true
        type: choice
        options:
          - staging
          - production
          - both
      mode:
        description: "inspect reports status only; ensure generates a missing or blank password and reapplies db-roles."
        required: true
        type: choice
        options:
          - inspect
          - ensure
        default: inspect

permissions:
  contents: read

jobs:
  staging:
    name: staging MCP reader DB password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'staging' || inputs.target == 'both'
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      COMPOSE_PROJECT: brain-staging
      POSTGRES_CONTAINER: brain-staging-postgres
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure MCP reader DB password
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' POSTGRES_CONTAINER='$POSTGRES_CONTAINER' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "mcp_reader_db_password_status=env_file_missing"
            exit 1
          fi

          role_exists_before="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain_mcp_reader');" 2>/dev/null || echo unknown)"
          current_line="$(grep -E '^BRAIN_MCP_READER_DB_PASSWORD=' "$VM_ENV_FILE" | tail -n 1 || true)"
          if [[ -z "$current_line" ]]; then
            status="missing"
          elif [[ "$current_line" == "BRAIN_MCP_READER_DB_PASSWORD=" ]]; then
            status="blank"
          else
            status="present"
          fi

          if [[ "$MODE" == "ensure" && "$status" != "present" ]]; then
            secret="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            chmod --reference="$VM_ENV_FILE" "$tmp"
            if [[ "$status" == "missing" ]]; then
              cp "$VM_ENV_FILE" "$tmp"
              printf '\nBRAIN_MCP_READER_DB_PASSWORD=%s\n' "$secret" >> "$tmp"
            else
              awk -v secret="$secret" '
                BEGIN { replaced = 0 }
                /^BRAIN_MCP_READER_DB_PASSWORD=/ {
                  if (replaced == 0) {
                    print "BRAIN_MCP_READER_DB_PASSWORD=" secret
                    replaced = 1
                  }
                  next
                }
                { print }
                END {
                  if (replaced == 0) {
                    print "BRAIN_MCP_READER_DB_PASSWORD=" secret
                  }
                }
              ' "$VM_ENV_FILE" > "$tmp"
            fi
            mv "$tmp" "$VM_ENV_FILE"
            status="generated_from_${status}"
          fi

          echo "env_file=$VM_ENV_FILE"
          echo "brain_mcp_reader_role_exists_before=$role_exists_before"
          echo "mcp_reader_db_password_status=$status"

          if [[ "$MODE" == "ensure" ]]; then
            compose_files='-f docker-compose.prod.yml'
            [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
            docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files run --rm --no-deps db-roles
            role_exists_after="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain_mcp_reader');")"
            echo "brain_mcp_reader_role_exists_after=$role_exists_after"
          fi
          REMOTE

  production:
    name: production MCP reader DB password
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: inputs.target == 'production' || inputs.target == 'both'
    environment: production
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      VM_ENV_FILE: .env.prod
      COMPOSE_PROJECT: brain-prod
      POSTGRES_CONTAINER: brain-prod-postgres
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Inspect or ensure MCP reader DB password
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' POSTGRES_CONTAINER='$POSTGRES_CONTAINER' MODE='$MODE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ "$MODE" != "inspect" && "$MODE" != "ensure" ]]; then
            echo "mode must be inspect or ensure"
            exit 1
          fi
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "mcp_reader_db_password_status=env_file_missing"
            exit 1
          fi

          role_exists_before="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain_mcp_reader');" 2>/dev/null || echo unknown)"
          current_line="$(grep -E '^BRAIN_MCP_READER_DB_PASSWORD=' "$VM_ENV_FILE" | tail -n 1 || true)"
          if [[ -z "$current_line" ]]; then
            status="missing"
          elif [[ "$current_line" == "BRAIN_MCP_READER_DB_PASSWORD=" ]]; then
            status="blank"
          else
            status="present"
          fi

          if [[ "$MODE" == "ensure" && "$status" != "present" ]]; then
            secret="$(openssl rand -hex 32)"
            tmp="$(mktemp)"
            chmod --reference="$VM_ENV_FILE" "$tmp"
            if [[ "$status" == "missing" ]]; then
              cp "$VM_ENV_FILE" "$tmp"
              printf '\nBRAIN_MCP_READER_DB_PASSWORD=%s\n' "$secret" >> "$tmp"
            else
              awk -v secret="$secret" '
                BEGIN { replaced = 0 }
                /^BRAIN_MCP_READER_DB_PASSWORD=/ {
                  if (replaced == 0) {
                    print "BRAIN_MCP_READER_DB_PASSWORD=" secret
                    replaced = 1
                  }
                  next
                }
                { print }
                END {
                  if (replaced == 0) {
                    print "BRAIN_MCP_READER_DB_PASSWORD=" secret
                  }
                }
              ' "$VM_ENV_FILE" > "$tmp"
            fi
            mv "$tmp" "$VM_ENV_FILE"
            status="generated_from_${status}"
          fi

          echo "env_file=$VM_ENV_FILE"
          echo "brain_mcp_reader_role_exists_before=$role_exists_before"
          echo "mcp_reader_db_password_status=$status"

          if [[ "$MODE" == "ensure" ]]; then
            compose_files='-f docker-compose.prod.yml'
            [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
            docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files run --rm --no-deps db-roles
            role_exists_after="$(docker exec "$POSTGRES_CONTAINER" psql -U brain -d brain -Atc "SELECT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'brain_mcp_reader');")"
            echo "brain_mcp_reader_role_exists_after=$role_exists_after"
          fi
          REMOTE
