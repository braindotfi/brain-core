name: prod-collections-narrative-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: verify a newly generated collections proposal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: prod-collections-narrative-smoke
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Generate and read a collections proposal
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          set -a
          # The platform secret remains on the VM. This smoke emits only the
          # isolated tenant and proposal identifiers plus the generated narrative.
          . ./.env.prod
          set +a
          if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
            echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on the VM"
            exit 1
          fi

          create_payload="$(
            docker exec brain-prod-api node -e '
              const { randomUUID } = require("node:crypto");
              const suffix = randomUUID().replace(/-/g, "");
              process.stdout.write(JSON.stringify({
                company_name: "Collections narrative smoke",
                founder: {
                  email: `collections-narrative-smoke+${suffix}@brain.invalid`,
                  display_name: "Collections Narrative Smoke",
                },
                founder_external_ref: `collections-narrative-smoke:${suffix}`,
                demo_seed: true,
              }));
            '
          )"
          create_response="$(
            printf '%s' "$create_payload" | curl -fsS --retry 2 --connect-timeout 10 --max-time 60 \
              -X POST https://api.brain.fi/v1/tenants \
              -H "Content-Type: application/json" \
              -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
              --data-binary @-
          )"
          smoke_tenant_id="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.tenant_id !== "string" || !/^tnt_[0-9A-HJKMNP-TV-Z]{26}$/.test(parsed.tenant_id)) process.exit(1);
                process.stdout.write(parsed.tenant_id);
              });
            '
          )"
          smoke_agent_token="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.agent?.token !== "string" || parsed.agent.token.length === 0) process.exit(1);
                process.stdout.write(parsed.agent.token);
              });
            '
          )"
          invoice_row="$(
            docker exec -i brain-prod-postgres psql -U brain -d brain -At -F $'\t' \
              -v ON_ERROR_STOP=1 \
              -c "SELECT i.id, i.counterparty_id, i.amount_due, i.currency, i.due_date::date, cp.name, i.invoice_number FROM ledger_invoices i JOIN ledger_counterparties cp ON cp.owner_id = i.owner_id AND cp.id = i.counterparty_id WHERE i.owner_id = '${smoke_tenant_id}' AND i.status = 'overdue' ORDER BY i.due_date ASC, i.id ASC LIMIT 1;"
          )"
          if [[ -z "$invoice_row" ]]; then
            echo "No overdue invoice found on isolated smoke tenant $smoke_tenant_id"
            exit 1
          fi
          IFS=$'\t' read -r invoice_id counterparty_id amount currency due_date counterparty_name invoice_number <<<"$invoice_row"
          run_payload="$(
            INVOICE_ID="$invoice_id" COUNTERPARTY_ID="$counterparty_id" AMOUNT="$amount" CURRENCY="$currency" \
            DUE_DATE="$due_date" COUNTERPARTY_NAME="$counterparty_name" INVOICE_NUMBER="$invoice_number" \
              docker exec -e INVOICE_ID -e COUNTERPARTY_ID -e AMOUNT -e CURRENCY -e DUE_DATE -e COUNTERPARTY_NAME -e INVOICE_NUMBER \
                brain-prod-api node -e '
                  process.stdout.write(JSON.stringify({
                    event: "payment.failed",
                    context: {
                      invoice_id: process.env.INVOICE_ID,
                      counterparty_id: process.env.COUNTERPARTY_ID,
                      amount: process.env.AMOUNT,
                      currency: process.env.CURRENCY,
                      due_date: process.env.DUE_DATE,
                      counterparty_name: process.env.COUNTERPARTY_NAME,
                      invoice_number: process.env.INVOICE_NUMBER,
                      days_overdue: 30,
                    },
                  }));
                '
          )"
          run_response="$(
            printf '%s' "$run_payload" | curl -fsS --retry 2 --connect-timeout 10 --max-time 60 \
              -X POST https://api.brain.fi/v1/agents/run \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${smoke_agent_token}" \
              --data-binary @-
          )"
          smoke_proposal_id="$(
            printf '%s' "$run_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (parsed.status !== "proposal_created" || typeof parsed.proposed?.id !== "string") process.exit(1);
                process.stdout.write(parsed.proposed.id);
              });
            '
          )"
          proposal_response="$(
            curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
              "https://api.brain.fi/v1/proposals/${smoke_proposal_id}" \
              -H "Authorization: Bearer ${smoke_agent_token}"
          )"
          narrative="$(
            printf '%s' "$proposal_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const proposal = JSON.parse(body);
                const narrative = proposal.details?.narrative;
                if (proposal.type !== "collections" || typeof narrative !== "string") process.exit(1);
                if (!narrative.includes("Recommend escalation with urgent tone at the escalation tier.")) process.exit(1);
                if (narrative.includes("escalation escalation")) process.exit(1);
                process.stdout.write(narrative);
              });
            '
          )"
          printf 'smoke_tenant_id=%s\n' "$smoke_tenant_id"
          printf 'proposal_id=%s\n' "$smoke_proposal_id"
          printf 'narrative=%s\n' "$narrative"
          REMOTE
