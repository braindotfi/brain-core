name: ops-demo-seed-pipeline-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: staging demo seed upload-pipeline smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Do not overlap a staging deploy while this job reads worker-created rows.
    concurrency:
      group: deploy-staging-refs/heads/main
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_ENV_FILE: .env.staging
      API_BASE: https://staging-api.brain.fi
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Seed and verify upload projection through staging API
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' API_BASE='$API_BASE' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          set -a
          . "./$VM_ENV_FILE"
          set +a
          if [[ -z "${BRAIN_PLATFORM_SERVICE_SECRET:-}" ]]; then
            echo "BRAIN_PLATFORM_SERVICE_SECRET is not configured on the staging VM"
            exit 1
          fi

          create_payload="$(
            docker exec brain-prod-api node -e '
              const { randomUUID } = require("node:crypto");
              const suffix = randomUUID().replace(/-/g, "");
              process.stdout.write(JSON.stringify({
                company_name: "Demo seed upload pipeline smoke",
                founder: {
                  email: `demo-seed-upload-smoke+${suffix}@brain.invalid`,
                  display_name: "Demo Seed Upload Smoke",
                },
                founder_external_ref: `demo-seed-upload-smoke:${suffix}`,
                demo_seed: true,
              }));
            '
          )"
          create_response="$(
            printf '%s' "$create_payload" | curl -fsS --retry 2 --connect-timeout 10 --max-time 90 \
              -X POST "$API_BASE/v1/tenants" \
              -H "Content-Type: application/json" \
              -H "X-Platform-Service-Auth: ${BRAIN_PLATFORM_SERVICE_SECRET}" \
              --data-binary @-
          )"
          smoke_tenant_id="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.tenant_id !== "string" || !/^tnt_[0-9A-HJKMNP-TV-Z]{26}$/.test(parsed.tenant_id)) process.exit(1);
                process.stdout.write(parsed.tenant_id);
              });
            '
          )"
          smoke_user_token="$(
            printf '%s' "$create_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (typeof parsed.session?.token !== "string" || parsed.session.token.length === 0) process.exit(1);
                process.stdout.write(parsed.session.token);
              });
            '
          )"
          # Retain the isolated tenant id even when a bounded poll fails.
          printf 'smoke_tenant_id=%s\n' "$smoke_tenant_id" >&2

          for attempt in $(seq 1 40); do
            state="$(
              docker exec -i brain-prod-postgres psql -U brain -d brain -At -F '|' -v ON_ERROR_STOP=1 \
                -c "SELECT COUNT(*), COUNT(*) FILTER (WHERE projection_status = 'projected'), COUNT(*) FILTER (WHERE projection_status = 'projection_failed') FROM raw_artifacts WHERE tenant_id = '$smoke_tenant_id';"
            )"
            IFS='|' read -r raw_count projected_count failed_count <<< "$state"
            if [[ "$raw_count" == "4" && "$projected_count" == "4" && "$failed_count" == "0" ]]; then
              break
            fi
            if [[ "$attempt" == "40" ]]; then
              echo "raw_projection_terminal=false raw_count=$raw_count projected_count=$projected_count failed_count=$failed_count"
              exit 1
            fi
            sleep 15
          done

          artifact_summary="$(
            docker exec -i brain-prod-postgres psql -U brain -d brain -At -F '|' -v ON_ERROR_STOP=1 \
              -c "SELECT source_ref->>'filename', projection_status FROM raw_artifacts WHERE tenant_id = '$smoke_tenant_id' ORDER BY source_ref->>'filename';"
          )"
          payroll_obligation_summary="$(
            docker exec -i brain-prod-postgres psql -U brain -d brain -At -F '|' -v ON_ERROR_STOP=1 \
              -c "SELECT lo.id, lo.amount_due::TEXT, lo.currency, lo.direction FROM ledger_obligations lo JOIN raw_artifacts ra ON ra.tenant_id = lo.owner_id AND ra.id = ANY(lo.source_ids) WHERE lo.owner_id = '$smoke_tenant_id' AND ra.source_ref->>'filename' = 'payroll_register_2026-08-04.xlsx' ORDER BY lo.due_date, lo.id;"
          )"
          if [[ -z "$payroll_obligation_summary" ]]; then
            echo "payroll_ledger_obligations=false"
            exit 1
          fi

          ap_summary="$(
            docker exec -i brain-prod-postgres psql -U brain -d brain -At -F '|' -v ON_ERROR_STOP=1 \
              -c "SELECT lo.id, cp.name, lo.amount_due::TEXT, lo.direction FROM ledger_obligations lo JOIN ledger_counterparties cp ON cp.owner_id = lo.owner_id AND cp.id = lo.counterparty_id WHERE lo.owner_id = '$smoke_tenant_id' AND lo.direction = 'payable' AND cp.name IN ('CloudOps Inc', 'Datacenter Hosting Ltd', 'Quick Pay Solutions') ORDER BY cp.name;"
          )"
          expected_ap="$(printf '%s\n' "$ap_summary" | awk -F'|' '$2 == "CloudOps Inc" && $3 == "19400.00000000" && $4 == "payable" {a++} $2 == "Datacenter Hosting Ltd" && $3 == "187000.00000000" && $4 == "payable" {b++} $2 == "Quick Pay Solutions" && $3 == "4800.00000000" && $4 == "payable" {c++} END {print a,b,c}')"
          if [[ "$expected_ap" != "1 1 1" ]]; then
            echo "seeded_ap_obligations=false"
            exit 1
          fi

          obligations_response="$(
            curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
              "$API_BASE/v1/ledger/obligations?limit=100" \
              -H "Authorization: Bearer ${smoke_user_token}"
          )"
          endpoint_summary="$(
            printf '%s' "$obligations_response" | AP_SUMMARY="$ap_summary" docker exec -i -e AP_SUMMARY brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const parsed = JSON.parse(body);
                if (!Array.isArray(parsed.obligations)) process.exit(1);
                const expectedIds = process.env.AP_SUMMARY.split("\n").filter(Boolean).map((line) => line.split("|")[0]);
                const actual = parsed.obligations;
                if (!expectedIds.every((id) => actual.some((row) => row.id === id && row.direction === "payable"))) process.exit(1);
                if (actual.some((row) => row.direction !== "payable")) process.exit(1);
                process.stdout.write(`endpoint_payable_count=${actual.length} endpoint_seeded_ap_ids=${expectedIds.join(",")}`);
              });
            '
          )"

          # Emit only tenant-scoped identifiers and financial test fixtures, never credentials.
          printf 'smoke_tenant_id=%s\n' "$smoke_tenant_id" >&2
          printf 'raw_projection_terminal=true raw_count=%s projected_count=%s failed_count=%s\n' "$raw_count" "$projected_count" "$failed_count" >&2
          printf 'raw_artifacts:\n%s\n' "$artifact_summary" >&2
          printf 'seeded_ap_obligations:\n%s\n' "$ap_summary" >&2
          printf 'payroll_ledger_obligations:\n%s\n' "$payroll_obligation_summary" >&2
          printf '%s\n' "$endpoint_summary" >&2
          REMOTE
