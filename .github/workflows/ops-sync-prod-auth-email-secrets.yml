name: ops-sync-prod-auth-email-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync production auth email settings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      VM_HOST_STAGING: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY_STAGING: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_HOST_PRODUCTION: ${{ secrets.VM_HOST }}
      VM_SSH_KEY_PRODUCTION: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY_STAGING" > ~/.ssh/id_staging
          echo "$VM_SSH_KEY_PRODUCTION" > ~/.ssh/id_production
          chmod 600 ~/.ssh/id_staging ~/.ssh/id_production
          ssh-keyscan -H "$VM_HOST_STAGING" >> ~/.ssh/known_hosts
          ssh-keyscan -H "$VM_HOST_PRODUCTION" >> ~/.ssh/known_hosts

      - name: Read staging email settings
        id: staging
        shell: bash
        run: |
          staging_values="$(ssh -i ~/.ssh/id_staging -o ServerAliveInterval=30 "azureuser@$VM_HOST_STAGING" bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/brain-core
          env_file=.env.staging
          if [[ ! -f "$env_file" ]]; then
            echo "staging_env_file_missing"
            exit 1
          fi
          get_value() {
            local key="$1"
            grep -E "^${key}=" "$env_file" | tail -n 1 | sed "s/^${key}=//"
          }
          endpoint="$(get_value EMAIL_ENDPOINT || true)"
          api_key="$(get_value EMAIL_API_KEY || true)"
          from="$(get_value EMAIL_FROM || true)"
          if [[ -z "$endpoint" || -z "$api_key" ]]; then
            echo "staging_email_settings_missing"
            exit 1
          fi
          printf 'EMAIL_ENDPOINT_B64=%s\n' "$(printf '%s' "$endpoint" | base64 | tr -d '\n')"
          printf 'EMAIL_API_KEY_B64=%s\n' "$(printf '%s' "$api_key" | base64 | tr -d '\n')"
          printf 'EMAIL_FROM_B64=%s\n' "$(printf '%s' "$from" | base64 | tr -d '\n')"
          REMOTE
          )"
          endpoint_b64="$(printf '%s\n' "$staging_values" | sed -n 's/^EMAIL_ENDPOINT_B64=//p' | tail -n 1)"
          api_key_b64="$(printf '%s\n' "$staging_values" | sed -n 's/^EMAIL_API_KEY_B64=//p' | tail -n 1)"
          from_b64="$(printf '%s\n' "$staging_values" | sed -n 's/^EMAIL_FROM_B64=//p' | tail -n 1)"
          if [[ -z "$endpoint_b64" || -z "$api_key_b64" ]]; then
            echo "failed to read required staging email settings"
            exit 1
          fi
          {
            echo "::add-mask::$endpoint_b64"
            echo "::add-mask::$api_key_b64"
            [[ -n "$from_b64" ]] && echo "::add-mask::$from_b64"
          }
          {
            echo "EMAIL_ENDPOINT_B64=$endpoint_b64"
            echo "EMAIL_API_KEY_B64=$api_key_b64"
            echo "EMAIL_FROM_B64=$from_b64"
          } >> "$GITHUB_OUTPUT"
          echo "staging_email_endpoint=present"
          echo "staging_email_api_key=present"
          if [[ -n "$from_b64" ]]; then
            echo "staging_email_from=present"
          else
            echo "staging_email_from=blank_or_missing"
          fi

      - name: Write production email settings and restart auth
        shell: bash
        env:
          EMAIL_ENDPOINT_B64: ${{ steps.staging.outputs.EMAIL_ENDPOINT_B64 }}
          EMAIL_API_KEY_B64: ${{ steps.staging.outputs.EMAIL_API_KEY_B64 }}
          EMAIL_FROM_B64: ${{ steps.staging.outputs.EMAIL_FROM_B64 }}
        run: |
          ssh -i ~/.ssh/id_production -o ServerAliveInterval=30 "azureuser@$VM_HOST_PRODUCTION" \
            "EMAIL_ENDPOINT_B64='$EMAIL_ENDPOINT_B64' EMAIL_API_KEY_B64='$EMAIL_API_KEY_B64' EMAIL_FROM_B64='$EMAIL_FROM_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/brain-core
          env_file=.env.prod
          if [[ ! -f "$env_file" ]]; then
            echo "production_env_file_missing"
            exit 1
          fi
          endpoint="$(printf '%s' "$EMAIL_ENDPOINT_B64" | base64 -d)"
          api_key="$(printf '%s' "$EMAIL_API_KEY_B64" | base64 -d)"
          from=""
          if [[ -n "$EMAIL_FROM_B64" ]]; then
            from="$(printf '%s' "$EMAIL_FROM_B64" | base64 -d)"
          fi
          if [[ -z "$endpoint" || -z "$api_key" ]]; then
            echo "required email settings decoded empty"
            exit 1
          fi
          tmp="$(mktemp)"
          chmod --reference="$env_file" "$tmp"
          awk -v endpoint="$endpoint" -v api_key="$api_key" -v from="$from" '
            BEGIN {
              saw_endpoint = 0
              saw_api_key = 0
              saw_from = 0
            }
            /^EMAIL_ENDPOINT=/ {
              if (saw_endpoint == 0) {
                print "EMAIL_ENDPOINT=" endpoint
                saw_endpoint = 1
              }
              next
            }
            /^EMAIL_API_KEY=/ {
              if (saw_api_key == 0) {
                print "EMAIL_API_KEY=" api_key
                saw_api_key = 1
              }
              next
            }
            /^EMAIL_FROM=/ {
              if (saw_from == 0) {
                print "EMAIL_FROM=" from
                saw_from = 1
              }
              next
            }
            { print }
            END {
              if (saw_endpoint == 0) print "EMAIL_ENDPOINT=" endpoint
              if (saw_api_key == 0) print "EMAIL_API_KEY=" api_key
              if (saw_from == 0 && from != "") print "EMAIL_FROM=" from
            }
          ' "$env_file" > "$tmp"
          mv "$tmp" "$env_file"
          echo "production_email_endpoint=present"
          echo "production_email_api_key=present"
          if [[ -n "$from" ]]; then
            echo "production_email_from=present"
          else
            echo "production_email_from=blank_or_missing"
          fi

          compose_files='-f docker-compose.prod.yml'
          [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
          docker compose -p brain-prod --env-file "$env_file" $compose_files --profile agents up -d --no-deps --no-build auth
          last_commit=""
          for _ in $(seq 1 20); do
            body="$(curl -s http://localhost:3003/healthz || true)"
            last_commit="$(echo "$body" | grep -o '"commit":"[^"]*"' | sed 's/.*:"//;s/"$//' || true)"
            [[ -n "$last_commit" ]] && break
            sleep 6
          done
          echo "auth_local_health_commit=$last_commit"
          if [[ -z "$last_commit" ]]; then
            echo "auth_local_health_status=unhealthy"
            docker compose -p brain-prod --env-file "$env_file" $compose_files --profile agents logs --tail=120 auth \
              | sed -E \
                  -e 's/(AUTH_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                  -e 's/(EMAIL_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                  -e 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g'
            exit 1
          fi
          echo "auth_local_health_status=healthy"
          REMOTE
