name: prod-anchor-reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: reconcile publisher wallet anchorBatch calls
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: prod-anchor-reconciliation
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      # Promote run 31454141796 deployed adaptive batching at this time.
      WINDOW_START: "2026-08-11T03:04:56Z"
      PUBLISHER_WALLET: "0x41d4ce9d9fe968ca1230bdc296b28fdc9aa6ff6e"
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Reconcile fixed production anchor window
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "WINDOW_START='$WINDOW_START' PUBLISHER_WALLET='$PUBLISHER_WALLET' bash -s" <<'REMOTE'
          set -euo pipefail

          if [[ ! "$WINDOW_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "fixed window start failed validation" >&2
            exit 1
          fi
          if [[ ! "$PUBLISHER_WALLET" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "fixed publisher wallet failed validation" >&2
            exit 1
          fi

          echo '::group::runtime and retained worker history'
          echo "window_start=$WINDOW_START"
          echo "api_health=$(curl -fsS --max-time 10 https://api.brain.fi/health || true)"
          echo "api_git_sha=$(docker exec brain-prod-api printenv GIT_SHA 2>/dev/null || true)"
          echo "worker_git_sha=$(docker exec brain-prod-worker printenv GIT_SHA 2>/dev/null || true)"
          docker ps -a --filter name=brain-prod-worker \
            --format 'worker_container id={{.ID}} created={{.CreatedAt}} status={{.Status}}' || true
          # This is intentionally limited to anchoring and process-start lines.
          # It never prints environment values or arbitrary application traffic.
          docker logs --since "$WINDOW_START" brain-prod-worker 2>&1 \
            | grep -E 'anchor (cycle|publish|publisher)|adaptive anchor|GIT_SHA|startup|started' \
            | sed -E 's/(authorization|cookie|token|secret)":"[^"]*"/\1":"[REDACTED]"/gi' \
            || true
          echo '::endgroup::'

          db_anchors_json="$(docker exec -i brain-prod-postgres psql -U brain -d brain -qAt \
            -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '15s';
          SET LOCAL lock_timeout = '1s';
          SELECT COALESCE(json_agg(row_to_json(anchor_row)), '[]'::json)
            FROM (
              SELECT a.tenant_id,
                     encode(a.merkle_root, 'hex') AS merkle_root,
                     '0x' || encode(a.onchain_tx_hash, 'hex') AS transaction_hash,
                     lower(a.onchain_contract_address) AS contract_address,
                     a.onchain_block_number,
                     a.created_at,
                     a.period_start,
                     a.period_end,
                     a.event_count,
                     a.onchain_status
                FROM audit_anchors a
               WHERE a.onchain_status = 'confirmed'
                 AND a.onchain_tx_hash IS NOT NULL
               ORDER BY a.created_at ASC
            ) anchor_row;
          COMMIT;
          SQL
          )"
          if [[ ! "$db_anchors_json" =~ ^\[ ]]; then
            echo "anchor database input was not a JSON array" >&2
            exit 1
          fi

          echo '::group::onchain and database pair reconciliation'
          # The confirmed-anchor history can exceed the host argv/env limit.
          # Stream it to the diagnostic over stdin instead of passing it as an
          # environment variable. This remains read-only and avoids a VM write.
          node_script_b64="$(base64 -w0 <<'NODE'
          (async () => {
          const dbInput = await new Promise((resolve, reject) => {
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => resolve(input));
            process.stdin.on("error", reject);
          });
          const dbRows = JSON.parse(dbInput);
          const rpcUrl = process.env.BASE_RPC_URL;
          if (!rpcUrl) throw new Error("BASE_RPC_URL is not configured in the running API container");
          const windowStart = Date.parse(process.env.WINDOW_START);
          const wallet = process.env.PUBLISHER_WALLET.toLowerCase();
          const anchorBatchSelector = "0x56994e60";
          const anchorPublishedTopic = "0x48edb572a76f9bd499e4d57fd18d35e7c7763a9ad4988cfae0b0fe87df090980";

          let rpcId = 0;
          async function rpc(method, params) {
            const response = await fetch(rpcUrl, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method, params }),
            });
            if (!response.ok) throw new Error(`RPC ${method} returned HTTP ${response.status}`);
            const body = await response.json();
            if (body.error) throw new Error(`RPC ${method} failed: ${body.error.message}`);
            return body.result;
          }

          async function allWalletTransactions() {
            const base = `https://base-sepolia.blockscout.com/api/v2/addresses/${wallet}/transactions`;
            let next = base;
            const items = [];
            for (let page = 0; next !== null && page < 20; ++page) {
              const response = await fetch(next);
              if (!response.ok) throw new Error(`Blockscout transaction history returned HTTP ${response.status}`);
              const body = await response.json();
              const pageItems = body.items ?? [];
              items.push(...pageItems);
              // Blockscout orders this endpoint newest first. The diagnostic
              // needs only its fixed post-deploy window, so stop as soon as a
              // page crosses the lower bound instead of scanning old wallet
              // history until the safety cap is hit.
              const oldestTimestamp = Math.min(...pageItems.map((item) => Date.parse(item.timestamp)));
              if (pageItems.length === 0 || oldestTimestamp < windowStart) {
                next = null;
                break;
              }
              next = body.next_page_params === null || body.next_page_params === undefined
                ? null
                : `${base}?${new URLSearchParams(body.next_page_params)}`;
            }
            if (next !== null) throw new Error("fixed reconciliation window exceeded 20 Blockscout pages");
            return items.filter((item) => Date.parse(item.timestamp) >= windowStart);
          }

          function readWord(body, wordIndex) {
            const start = wordIndex * 64;
            const value = body.slice(start, start + 64);
            if (value.length !== 64) throw new Error("truncated anchorBatch calldata");
            return value;
          }
          function readArray(body, headIndex) {
            const offset = Number(BigInt(`0x${readWord(body, headIndex)}`));
            const lengthIndex = offset / 32;
            if (!Number.isSafeInteger(lengthIndex)) throw new Error("unsafe anchorBatch calldata offset");
            const length = Number(BigInt(`0x${readWord(body, lengthIndex)}`));
            if (!Number.isSafeInteger(length) || length > 50) throw new Error("invalid anchorBatch calldata length");
            return Array.from({ length }, (_, index) => `0x${readWord(body, lengthIndex + 1 + index)}`.toLowerCase());
          }
          function decodeAnchorBatch(input) {
            if (typeof input !== "string" || !input.startsWith(anchorBatchSelector)) {
              throw new Error("transaction calldata is not anchorBatch");
            }
            const body = input.slice(anchorBatchSelector.length);
            const tenantIds = readArray(body, 0);
            const roots = readArray(body, 1);
            const eventCounts = readArray(body, 2).map((value) => BigInt(value).toString());
            const periodStarts = readArray(body, 3).map((value) => BigInt(value).toString());
            const periodEnds = readArray(body, 4).map((value) => BigInt(value).toString());
            if (![roots, eventCounts, periodStarts, periodEnds].every((values) => values.length === tenantIds.length)) {
              throw new Error("anchorBatch calldata arrays have mismatched lengths");
            }
            return tenantIds.map((tenantIdHash, index) => ({
              tenant_id_hash: tenantIdHash,
              merkle_root: roots[index],
              event_count: eventCounts[index],
              period_start: periodStarts[index],
              period_end: periodEnds[index],
            }));
          }
          function eventPairs(receipt) {
            return (receipt.logs ?? [])
              .filter((log) => log.topics?.[0]?.toLowerCase() === anchorPublishedTopic)
              .map((log) => ({
                tenant_id_hash: log.topics[1].toLowerCase(),
                merkle_root: `0x${log.data.slice(2, 66)}`.toLowerCase(),
                contract_address: log.address.toLowerCase(),
              }));
          }
          // `merkle_root` is cryptographic output and the reconciliation is
          // only safe when it maps to exactly one confirmed DB anchor. The
          // production runtime image intentionally omits `viem`, so this uses
          // the root rather than recreating the tenant-id Keccak hash here.
          const dbByRoot = new Map();
          for (const row of dbRows) {
            const root = `0x${row.merkle_root}`.toLowerCase();
            if (dbByRoot.has(root)) {
              throw new Error(`ambiguous database correlation for Merkle root ${root}`);
            }
            dbByRoot.set(root, {
              tenant_id: row.tenant_id,
              transaction_hash: row.transaction_hash.toLowerCase(),
              contract_address: row.contract_address?.toLowerCase() ?? null,
              created_at: row.created_at,
              onchain_block_number: row.onchain_block_number,
            });
          }

          const history = await allWalletTransactions();
          const candidateTransactions = history.filter((item) =>
            item.status === "ok" && item.method?.toLowerCase() === anchorBatchSelector,
          );
          const details = [];
          for (const item of candidateTransactions) {
            const [transaction, receipt] = await Promise.all([
              rpc("eth_getTransactionByHash", [item.hash]),
              rpc("eth_getTransactionReceipt", [item.hash]),
            ]);
            if (!transaction || !receipt) throw new Error(`missing transaction or receipt for ${item.hash}`);
            const pairs = decodeAnchorBatch(transaction.input);
            const emitted = eventPairs(receipt);
            const emittedRoots = new Set(emitted.map((pair) => pair.merkle_root));
            const contractAddress = transaction.to?.toLowerCase() ?? null;
            const pairDetails = pairs.map((pair) => {
              const db = dbByRoot.get(pair.merkle_root) ?? null;
              const emittedOnchain = emittedRoots.has(pair.merkle_root);
              let classification;
              if (!emittedOnchain) {
                classification = db === null
                  ? "unrecorded_prior_onchain_anchor"
                  : "duplicate_noop_of_recorded_anchor";
              } else if (db === null) {
                classification = "onchain_anchor_missing_database_row";
              } else if (db.transaction_hash === item.hash.toLowerCase()) {
                classification = "database_linked_anchor";
              } else if (db.contract_address !== null && db.contract_address === contractAddress) {
                classification = "same_contract_database_transaction_mismatch";
              } else {
                classification = "cross_contract_republished_anchor";
              }
              return {
                ...pair,
                emitted_onchain: emittedOnchain,
                classification,
                database_anchor: db,
              };
            });
            details.push({
              transaction_hash: item.hash.toLowerCase(),
              timestamp: item.timestamp,
              to: contractAddress,
              from: transaction.from?.toLowerCase() ?? null,
              status: receipt.status,
              gas_used: BigInt(receipt.gasUsed).toString(),
              effective_gas_price_wei: BigInt(receipt.effectiveGasPrice ?? transaction.gasPrice).toString(),
              l1_fee_wei: receipt.l1Fee == null ? null : BigInt(receipt.l1Fee).toString(),
              input_pair_count: pairs.length,
              emitted_pair_count: emitted.length,
              database_linked_transaction: pairDetails.every((pair) =>
                pair.classification === "database_linked_anchor",
              ),
              pairs: pairDetails,
            });
          }
          const unlinked = details.filter((entry) => !entry.database_linked_transaction);
          const pairCounts = {};
          for (const transaction of unlinked) {
            for (const pair of transaction.pairs) {
              pairCounts[pair.classification] = (pairCounts[pair.classification] ?? 0) + 1;
            }
          }
          console.log(JSON.stringify({
            window_start: process.env.WINDOW_START,
            publisher_wallet: wallet,
            wallet_anchor_batch_transactions: details.length,
            database_linked_transactions: details.length - unlinked.length,
            unlinked_transactions: unlinked.length,
            unlinked_pair_classification_counts: pairCounts,
            transactions: details,
          }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          )"
          printf '%s' "$db_anchors_json" | docker exec -i \
            -e "WINDOW_START=$WINDOW_START" \
            -e "PUBLISHER_WALLET=$PUBLISHER_WALLET" \
            brain-prod-api node -e "eval(Buffer.from('$node_script_b64', 'base64').toString('utf8'))"
          echo '::endgroup::'
          REMOTE

      - name: Production deploy history for fixed window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '::group::promote history'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/braindotfi/brain-core/actions/workflows/promote-prod.yml/runs?per_page=100' \
            | node -e '
              let input = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const start = Date.parse("2026-08-11T03:04:56Z") - 12 * 60 * 60 * 1000;
                const end = Date.parse("2026-08-11T03:04:56Z") + 24 * 60 * 60 * 1000;
                const runs = JSON.parse(input).workflow_runs ?? [];
                for (const run of runs.filter((entry) => {
                  const at = Date.parse(entry.created_at);
                  return at >= start && at <= end;
                })) {
                  console.log(JSON.stringify({
                    id: run.id,
                    status: run.status,
                    conclusion: run.conclusion,
                    head_sha: run.head_sha,
                    created_at: run.created_at,
                    updated_at: run.updated_at,
                    html_url: run.html_url,
                  }));
                }
              });
            '
          echo '::endgroup::'
