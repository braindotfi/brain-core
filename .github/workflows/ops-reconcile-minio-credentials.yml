name: ops-reconcile-minio-credentials

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to reconcile."
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  reconcile:
    name: reconcile MinIO credentials and smoke raw ingest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    concurrency:
      group: ${{ inputs.target == 'production' && 'promote-prod' || 'deploy-staging-refs/heads/main' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target }}
      VM_HOST_STAGING: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY_STAGING: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_HOST_PRODUCTION: ${{ secrets.VM_HOST }}
      VM_SSH_KEY_PRODUCTION: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Select target
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET" in
            staging)
              echo "VM_HOST=$VM_HOST_STAGING" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_STAGING"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.staging" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-staging" >> "$GITHUB_ENV"
              echo "API_BASE=https://staging-api.brain.fi" >> "$GITHUB_ENV"
              ;;
            production)
              echo "VM_HOST=$VM_HOST_PRODUCTION" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_PRODUCTION"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.prod" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-prod" >> "$GITHUB_ENV"
              echo "API_BASE=https://api.brain.fi" >> "$GITHUB_ENV"
              ;;
            *)
              echo "target must be staging or production"
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Recreate MinIO and smoke raw ingest
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' API_BASE='$API_BASE' RUN_ID='${{ github.run_id }}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file_status=missing"
            exit 1
          fi

          set -a
          . "./$VM_ENV_FILE"
          set +a
          for key in MINIO_ROOT_USER MINIO_ROOT_PASSWORD BRAIN_DEMO_PROVISION_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "required_env_status=${key}:missing_or_blank"
              exit 1
            fi
          done
          if [[ "${BRAIN_DEMO_PROVISION_ENABLED:-false}" != "true" ]]; then
            echo "required_env_status=BRAIN_DEMO_PROVISION_ENABLED:not_enabled"
            exit 1
          fi

          compose_files='-f docker-compose.prod.yml'
          [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"
          compose="docker compose -p $COMPOSE_PROJECT --env-file $VM_ENV_FILE $compose_files"

          echo '::group::minio credential reconciliation'
          $compose up -d --no-deps --force-recreate minio
          timeout 90s $compose run --rm --no-deps minio-setup
          echo 'minio_credential_reconciliation=passed'
          echo '::endgroup::'

          echo '::group::raw ingest smoke'
          provision_response="$(
            curl -fsS --retry 2 --connect-timeout 10 --max-time 90 \
              -X POST "$API_BASE/v1/demo/provision-run" \
              -H "X-Demo-Provision-Auth: ${BRAIN_DEMO_PROVISION_SECRET}" \
              -H "X-Request-Id: ops-minio-reconcile-${RUN_ID}"
          )"
          smoke_tenant_id="$(
            printf '%s' "$provision_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(body);
                if (typeof value.tenant_id !== "string" || !/^tnt_[0-9A-HJKMNP-TV-Z]{26}$/.test(value.tenant_id)) process.exit(1);
                process.stdout.write(value.tenant_id);
              });
            '
          )"
          member_token="$(
            printf '%s' "$provision_response" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(body);
                if (typeof value.member_token !== "string" || value.member_token.length === 0) process.exit(1);
                process.stdout.write(value.member_token);
              });
            '
          )"
          fixture_file="$(mktemp)"
          trap 'rm -f "$fixture_file"' EXIT
          printf 'date,amount,description\n2026-08-11,1.00,MinIO credential reconciliation smoke\n' > "$fixture_file"
          upload_response="$(
            curl -sS --connect-timeout 10 --max-time 90 -w $'\n%{http_code}' \
              -X POST "$API_BASE/v1/raw/ingest" \
              -H "Authorization: Bearer ${member_token}" \
              -H "X-Request-Id: ops-minio-reconcile-upload-${RUN_ID}" \
              -F 'source_type=csv_upload' \
              -F 'source_ref={"filename":"minio_credential_reconciliation_smoke.csv","fixture_origin":"brain_core_ops"}' \
              -F 'mime_type=text/csv' \
              -F "file=@${fixture_file};type=text/csv"
          )"
          upload_status="${upload_response##*$'\n'}"
          upload_body="${upload_response%$'\n'*}"
          if [[ "$upload_status" != '200' && "$upload_status" != '201' ]]; then
            echo "raw_ingest_smoke_http_status=$upload_status"
            echo "raw_ingest_smoke_body=$upload_body"
            exit 1
          fi
          smoke_raw_id="$(
            printf '%s' "$upload_body" | docker exec -i brain-prod-api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                const value = JSON.parse(body);
                if (typeof value.raw_id !== "string" || !/^raw_[0-9A-HJKMNP-TV-Z]{26}$/.test(value.raw_id)) process.exit(1);
                process.stdout.write(value.raw_id);
              });
            '
          )"
          echo "raw_ingest_smoke_http_status=$upload_status"
          echo "raw_ingest_smoke_tenant_id=$smoke_tenant_id"
          echo "raw_ingest_smoke_raw_id=$smoke_raw_id"
          echo '::endgroup::'

          echo '::group::api health'
          curl -fsS --max-time 10 "$API_BASE/health"
          echo
          echo '::endgroup::'
          REMOTE
