name: prod-commercial-name-exception-characterization

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    name: characterize commercial name exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: prod-tenant-diagnostics
      cancel-in-progress: false
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run read-only characterization
        shell: bash
        run: |
          scp -i ~/.ssh/id_deploy \
            scripts/ops/report-commercial-name-exception-characterization.sql \
            scripts/ops/commercial-name-exceptions-2026-09-03.csv \
            "azureuser@$VM_HOST:/tmp/"
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker cp /tmp/commercial-name-exceptions-2026-09-03.csv \
            brain-prod-postgres:/tmp/commercial-name-exceptions.csv
          docker exec -i brain-prod-postgres psql -U brain -d brain \
            -f /dev/stdin \
            < /tmp/report-commercial-name-exception-characterization.sql
          docker cp brain-prod-postgres:/tmp/commercial-name-exception-characterization.csv \
            /tmp/commercial-name-exception-characterization.csv
          REMOTE
          scp -i ~/.ssh/id_deploy \
            "azureuser@$VM_HOST:/tmp/commercial-name-exception-characterization.csv" \
            commercial-name-exception-characterization.csv

      - name: Upload characterization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commercial-name-exception-characterization
          path: commercial-name-exception-characterization.csv
          if-no-files-found: error
          retention-days: 7
