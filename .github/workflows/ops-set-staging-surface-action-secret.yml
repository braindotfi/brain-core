name: ops-set-staging-surface-action-secret

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type staging-surface-action-secret to continue."
        required: true
        type: string

permissions:
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      VM_HOST: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_STAGING }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate fixed staging target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "staging-surface-action-secret" ]]; then
            echo "confirmation did not match"
            exit 1
          fi

      - name: Ensure secret without logging it
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$VM_SSH_KEY" > "$RUNNER_TEMP/id_staging"
          chmod 600 "$RUNNER_TEMP/id_staging"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i "$RUNNER_TEMP/id_staging" -o ServerAliveInterval=30 "azureuser@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/brain-core
          env_file=.env.staging
          if grep -Eq '^BRAIN_SURFACE_ACTION_SECRET=.+$' "$env_file"; then
            echo "BRAIN_SURFACE_ACTION_SECRET is already present"
            exit 0
          fi
          secret="$(openssl rand -hex 32)"
          temp_file="$(mktemp)"
          chmod 600 "$temp_file"
          awk -v replacement="BRAIN_SURFACE_ACTION_SECRET=$secret" '
            BEGIN { replaced = 0 }
            /^BRAIN_SURFACE_ACTION_SECRET=/ { print replacement; replaced = 1; next }
            { print }
            END { if (!replaced) print replacement }
          ' "$env_file" > "$temp_file"
          chmod --reference="$env_file" "$temp_file"
          chown --reference="$env_file" "$temp_file"
          mv "$temp_file" "$env_file"
          unset secret
          echo "BRAIN_SURFACE_ACTION_SECRET was added to the staging environment file"
          REMOTE
