name: ops-api-health-diagnostics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect."
        required: true
        type: choice
        options:
          - staging
          - production
      expected_sha:
        description: "Full production commit SHA to verify."
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: commercial demo retirement phase A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      TARGET: ${{ inputs.target }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Check out fixed phase A diagnostic
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate target and deployed deletion path
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" == "production" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${EXPECTED_SHA}^{commit}"
          git show "${EXPECTED_SHA}:scripts/ops/execute-commercial-demo-retirement.mjs" \
            | grep -F 'tenant-deletion/batched-delete.js'
          git show "${EXPECTED_SHA}:scripts/ops/execute-commercial-demo-retirement.mjs" \
            | grep -F 'BEGIN ISOLATION LEVEL READ COMMITTED'
          git show "${EXPECTED_SHA}:scripts/ops/run-commercial-demo-retirement.sh" \
            | grep -F 'DATABASE_EXECUTION_WATCHDOG_SECONDS=10800'
          git show "${EXPECTED_SHA}:.github/workflows/ops-delete-orphan-demo-tenants.yml" \
            | grep -F 'timeout-minutes: 210'

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fenced read-only phase A preflight
        shell: bash
        run: scripts/ops/run-commercial-demo-retirement-phase-a.sh

      - name: Upload phase A evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commercial-demo-retirement-phase-a
          path: commercial-demo-retirement-phase-a/
          if-no-files-found: warn
          retention-days: 30
