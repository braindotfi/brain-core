name: ops-revoke-brainmvb-delete-jti

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect."
        required: true
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  revoke:
    name: revoke BrainMVB tenant-delete jti
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET: ${{ inputs.target }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Require production target
        shell: bash
        run: |
          if [[ "$TARGET" != "production" ]]; then
            echo "target must be production"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Revoke exact jti and verify rejection
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          docker inspect -f '{{.State.Status}}' brain-prod-api | grep -Fx running
          docker inspect -f '{{.State.Status}}' brain-prod-auth | grep -Fx running

          docker exec -i -w /app/services/api brain-prod-api node --input-type=module <<'NODE'
          import Redis from "ioredis";
          import { RedisRevocationStore, redisRevocationKey } from "@brain/shared";

          const jti = "token_01M1XHBVK3TCFHTTGQVRF9NFRS";
          const exp = 1796547429;
          const redis = new Redis(process.env.REDIS_URL, {
            enableReadyCheck: true,
            maxRetriesPerRequest: 1,
          });

          try {
            const store = new RedisRevocationStore(redis);
            await store.revoke(jti, exp);
            const revoked = await store.isRevoked(jti);
            const ttlSeconds = await redis.ttl(redisRevocationKey(jti));
            const maximumTtl = exp - Math.floor(Date.now() / 1000);

            if (!revoked || ttlSeconds <= 0 || ttlSeconds > maximumTtl) {
              throw new Error(
                `revocation verification failed: revoked=${revoked} ttl_seconds=${ttlSeconds}`,
              );
            }

            console.log(
              JSON.stringify({
                jti,
                revoked,
                ttl_seconds: ttlSeconds,
                expires_at: exp,
              }),
            );
          } finally {
            await redis.quit();
          }
          NODE

          docker exec -i -w /app/services/auth brain-prod-auth node --input-type=module <<'NODE'
          import { JwtSigner } from "@brain/shared";

          const jti = "token_01M1XHBVK3TCFHTTGQVRF9NFRS";
          const exp = 1796547429;
          const signingKey = JSON.parse(process.env.AUTH_SIGN_KEY);
          const signer = new JwtSigner({
            issuer: process.env.AUTH_ISSUER,
            audience: "brain-api",
            key: signingKey,
            algorithm: signingKey.alg ?? "RS256",
          });
          const token = await signer.sign({
            id: "partner_01M1XHBVJZXPEFDAB98E70CBRF",
            type: "api_partner",
            tenantId: "tnt_00000000010000000000000000",
            scopes: ["tenant:delete"],
            tokenId: jti,
            expiresAt: exp,
          });

          const response = await fetch(
            "http://api:3000/v1/admin/tenant-deletions/tdel_01M1XSRCC2799C4DWPX6FYG7BH",
            { headers: { authorization: `Bearer ${token}` } },
          );
          const body = await response.json().catch(() => ({}));
          const code = body?.error?.code ?? body?.code ?? null;

          if (response.status !== 401 || code !== "auth_token_invalid") {
            throw new Error(
              `old-jti rejection failed: http_status=${response.status} error_code=${String(code)}`,
            );
          }

          console.log(
            JSON.stringify({
              jti,
              old_jti_http_status: response.status,
              old_jti_error_code: code,
            }),
          );
          NODE
          REMOTE
