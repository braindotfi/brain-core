name: ops-api-health-diagnostics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect."
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  diagnose:
    name: api health diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      TARGET: ${{ inputs.target }}
      VM_HOST_STAGING: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY_STAGING: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_HOST_PRODUCTION: ${{ secrets.VM_HOST }}
      VM_SSH_KEY_PRODUCTION: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Select target
        shell: bash
        run: |
          case "$TARGET" in
            staging)
              echo "VM_HOST=$VM_HOST_STAGING" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_STAGING"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.staging" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-staging" >> "$GITHUB_ENV"
              ;;
            production)
              echo "VM_HOST=$VM_HOST_PRODUCTION" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_PRODUCTION"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.prod" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-prod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "target must be staging or production"
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed api diagnostics
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          compose_files='-f docker-compose.prod.yml'
          [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"

          echo "::group::api signup env presence"
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi
          echo "env_file=$VM_ENV_FILE"
          for key in \
            BRAIN_SELF_SERVE_SIGNUP \
            EMAIL_ENDPOINT \
            EMAIL_API_KEY \
            EMAIL_FROM
          do
            line="$(grep -E "^${key}=" "$VM_ENV_FILE" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              echo "${key}=missing"
            elif [[ "$line" == "${key}=" ]]; then
              echo "${key}=blank"
            else
              echo "${key}=present"
            fi
          done
          echo "::endgroup::"

          echo "::group::api compose status"
          docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents ps api || true
          echo "::endgroup::"

          echo "::group::api local health"
          curl -sS --max-time 5 http://localhost:3000/health || true
          echo
          echo "::endgroup::"

          if [[ "$COMPOSE_PROJECT" == "brain-prod" ]]; then
            echo "::group::northstar listing question probe"
            tenant_id='tnt_01M0KHRVY3RT3EXN7WT2SPDFMZ'
            member_id='user_01M0KKTY83A2V3QYAVEN9452RQ'

            docker exec -i brain-prod-postgres psql -U brain -d brain -At \
              -v ON_ERROR_STOP=1 \
              -v tenant_id="$tenant_id" <<'SQL'
            SELECT json_build_object(
              'event', 'northstar_listing_dataset_counts',
              'tenant_id', :'tenant_id',
              'transactions', (SELECT count(*) FROM ledger_transactions WHERE owner_id = :'tenant_id'),
              'open_obligations', (SELECT count(*) FROM ledger_obligations WHERE owner_id = :'tenant_id' AND status IN ('upcoming', 'due', 'overdue')),
              'overdue_invoices', (SELECT count(*) FROM ledger_invoices WHERE owner_id = :'tenant_id' AND status = 'overdue'),
              'pending_proposals', (SELECT count(*) FROM proposals WHERE tenant_id = :'tenant_id' AND status = 'pending')
            );
          SQL

            external_ref="$(
              docker exec -i brain-prod-postgres psql -U brain -d brain -At \
                -v ON_ERROR_STOP=1 \
                -v tenant_id="$tenant_id" \
                -v member_id="$member_id" <<'SQL'
              SELECT l.external_ref
                FROM member_identity_links l
                JOIN members m
                  ON m.tenant_id = l.tenant_id
                 AND m.id = l.member_id
               WHERE l.tenant_id = :'tenant_id'
                 AND l.member_id = :'member_id'
                 AND l.surface = 'platform'
                 AND m.status = 'active'
               LIMIT 1;
          SQL
            )"
            if [[ -z "$external_ref" ]]; then
              echo "No active platform identity link found for fixed Northstar member"
              exit 1
            fi

            set -a
            . "./$VM_ENV_FILE"
            set +a
            : "${BRAIN_PLATFORM_SERVICE_SECRET:?BRAIN_PLATFORM_SERVICE_SECRET is required}"

            docker exec \
              -e BRAIN_PLATFORM_SERVICE_SECRET \
              -e NORTHSTAR_EXTERNAL_REF="$external_ref" \
              -e NORTHSTAR_TENANT_ID="$tenant_id" \
              brain-prod-api node --input-type=module -e '
                const apiBase = "https://api.brain.fi/v1";
                const sessionResponse = await fetch(`${apiBase}/sessions`, {
                  method: "POST",
                  headers: {
                    "content-type": "application/json",
                    "x-platform-service-auth": process.env.BRAIN_PLATFORM_SERVICE_SECRET,
                  },
                  body: JSON.stringify({
                    external_ref: process.env.NORTHSTAR_EXTERNAL_REF,
                    scopes: ["wiki:read"],
                  }),
                });
                const session = await sessionResponse.json();
                if (
                  !sessionResponse.ok ||
                  typeof session.token !== "string" ||
                  session.member?.tenantId !== process.env.NORTHSTAR_TENANT_ID
                ) {
                  throw new Error(`Session exchange failed with HTTP ${sessionResponse.status}`);
                }

                const checks = [
                  ["overdue_exact", "Which invoices are overdue?"],
                  ["overdue_variant", "Which customer invoices are overdue?"],
                  ["payables_exact", "List all our open vendor payables."],
                  ["payables_variant", "List all open payables by vendor."],
                  ["outreach_exact", "Which outreach recommendations need approval?"],
                  ["outreach_variant", "Which recommendation needs approval before outreach?"],
                ];
                for (const [check, question] of checks) {
                  const response = await fetch(`${apiBase}/wiki/question`, {
                    method: "POST",
                    headers: {
                      authorization: `Bearer ${session.token}`,
                      "content-type": "application/json",
                    },
                    body: JSON.stringify({ question }),
                  });
                  const result = await response.json();
                  process.stdout.write(`${JSON.stringify({
                    event: "northstar_listing_question_probe",
                    environment: "true_production_api.brain.fi",
                    check,
                    question,
                    http_status: response.status,
                    answered: result.answered,
                    answer: result.answer,
                    deterministic_intent_id: result.deterministicIntentId ?? null,
                    evidence_count: Array.isArray(result.evidence) ? result.evidence.length : 0,
                    evidence: result.evidence ?? [],
                    model: result.model ?? null,
                    usage: result.usage ?? null,
                  })}\n`);
                  if (!response.ok) {
                    throw new Error(`${check} failed with HTTP ${response.status}`);
                  }
                }
              '
            echo "::endgroup::"
          fi

          echo "::group::api redacted logs"
          docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents \
            logs --tail=160 api 2>&1 \
            | sed -E \
                -e 's/(AUTH_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                -e 's/(EMAIL_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                -e 's/(BRAIN_[A-Z0-9_]*PASSWORD=)[^[:space:]]+/\1[redacted]/g' \
                -e 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' \
                -e 's#(https?://)[^[:space:]]*(@)#\1[redacted]\2#g' \
            || true
          echo "::endgroup::"
          REMOTE
