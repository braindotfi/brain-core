name: ops-mint-brainmvb-delete-jwt

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target for credential issuance."
        required: true
        type: choice
        options:
          - production

permissions:
  contents: read

jobs:
  mint:
    name: mint encrypted BrainMVB tenant-delete JWT
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET: ${{ inputs.target }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Require production target
        shell: bash
        run: |
          if [[ "$TARGET" != "production" ]]; then
            echo "target must be production"
            exit 1
          fi

      - name: Check out encrypted-delivery recipient
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Mint and envelope-encrypt credential
        shell: bash
        run: |
          set -euo pipefail
          encrypted_path="$RUNNER_TEMP/brainmvb-tenant-delete-jwt.cms"

          {
            ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
              "docker exec -i -w /app/services/auth brain-prod-auth node --input-type=module" <<'NODE'
          import { JwtSigner } from "@brain/shared";

          const jti = "token_01M1XYGA2Y96GYKWD7HF16808Z";
          const now = Math.floor(Date.now() / 1000);
          const exp = now + 90 * 24 * 60 * 60;
          const signingKey = JSON.parse(process.env.AUTH_SIGN_KEY);
          const signer = new JwtSigner({
            issuer: process.env.AUTH_ISSUER,
            audience: "brain-api",
            key: signingKey,
            algorithm: signingKey.alg ?? "RS256",
          });

          const token = await signer.sign({
            id: "partner_01M1XHBVJZXPEFDAB98E70CBRF",
            type: "api_partner",
            tenantId: "tnt_00000000010000000000000000",
            scopes: ["tenant:delete"],
            tokenId: jti,
            expiresAt: exp,
          });

          const response = await fetch(
            "http://api:3000/v1/admin/tenant-deletions/tdel_01M1XSRCC2799C4DWPX6FYG7BH",
            { headers: { authorization: `Bearer ${token}` } },
          );
          if (response.status !== 200) {
            const body = await response.json().catch(() => ({}));
            const code = body?.error?.code ?? body?.code ?? null;
            throw new Error(
              `new credential validation failed: http_status=${response.status} error_code=${String(code)}`,
            );
          }

          process.stdout.write(token);
          NODE
          } | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER \
            -out "$encrypted_path" \
            .github/ops/brainmvb-rotation-recipient-20260907.pem

          test -s "$encrypted_path"
          openssl cms -cmsout -inform DER -in "$encrypted_path" -noout

      - name: Upload encrypted credential
        uses: actions/upload-artifact@v4
        with:
          name: brainmvb-tenant-delete-jwt-encrypted
          path: ${{ runner.temp }}/brainmvb-tenant-delete-jwt.cms
          if-no-files-found: error
          retention-days: 1
