name: ops-api-health-diagnostics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect."
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  diagnose:
    name: api health diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      TARGET: ${{ inputs.target }}
      VM_HOST_STAGING: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY_STAGING: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_HOST_PRODUCTION: ${{ secrets.VM_HOST }}
      VM_SSH_KEY_PRODUCTION: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Select target
        shell: bash
        run: |
          case "$TARGET" in
            staging)
              echo "VM_HOST=$VM_HOST_STAGING" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_STAGING"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.staging" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-staging" >> "$GITHUB_ENV"
              ;;
            production)
              echo "VM_HOST=$VM_HOST_PRODUCTION" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_PRODUCTION"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.prod" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-prod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "target must be staging or production"
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed api diagnostics
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          compose_files='-f docker-compose.prod.yml'
          [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"

          echo "::group::api signup env presence"
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi
          echo "env_file=$VM_ENV_FILE"
          for key in \
            BRAIN_SELF_SERVE_SIGNUP \
            EMAIL_ENDPOINT \
            EMAIL_API_KEY \
            EMAIL_FROM
          do
            line="$(grep -E "^${key}=" "$VM_ENV_FILE" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              echo "${key}=missing"
            elif [[ "$line" == "${key}=" ]]; then
              echo "${key}=blank"
            else
              echo "${key}=present"
            fi
          done
          echo "::endgroup::"

          echo "::group::api compose status"
          docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents ps api || true
          echo "::endgroup::"

          echo "::group::api local health"
          curl -sS --max-time 5 http://localhost:3000/health || true
          echo
          echo "::endgroup::"

          echo "::group::api redacted logs"
          docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents \
            logs --tail=160 api 2>&1 \
            | sed -E \
                -e 's/(AUTH_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                -e 's/(EMAIL_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                -e 's/(BRAIN_[A-Z0-9_]*PASSWORD=)[^[:space:]]+/\1[redacted]/g' \
                -e 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' \
                -e 's#(https?://)[^[:space:]]*(@)#\1[redacted]\2#g' \
            || true
          echo "::endgroup::"
          REMOTE

      - name: Run production audit-chain integrity preflight
        if: inputs.target == 'production'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" == "production" ]]
          [[ "$VM_ENV_FILE" == ".env.prod" ]]
          [[ "$COMPOSE_PROJECT" == "brain-prod" ]]
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker exec -i brain-prod-postgres psql -X -qAt -v ON_ERROR_STOP=1 -U brain -d brain <<'SQL'
          SET transaction_read_only = on;
          WITH
          fork_groups AS MATERIALIZED (
            SELECT tenant_id, prev_event_hash, count(*)::bigint AS successor_count
              FROM audit_events
             WHERE prev_event_hash IS NOT NULL
             GROUP BY tenant_id, prev_event_hash
            HAVING count(*) > 1
          ),
          gaps AS MATERIALIZED (
            SELECT event.tenant_id, event.id
              FROM audit_events event
             WHERE event.prev_event_hash IS NOT NULL
               AND NOT EXISTS (
                 SELECT 1
                   FROM audit_events predecessor
                  WHERE predecessor.tenant_id = event.tenant_id
                    AND predecessor.event_hash = event.prev_event_hash
               )
          ),
          tenant_counts AS MATERIALIZED (
            SELECT tenant_id,
                   count(*)::bigint AS event_count,
                   count(*) FILTER (WHERE prev_event_hash IS NULL)::bigint AS genesis_count
              FROM audit_events
             GROUP BY tenant_id
          ),
          head_state AS MATERIALIZED (
            SELECT counts.tenant_id,
                   counts.event_count,
                   head.sequence,
                   head.head_event_id,
                   head.head_event_hash,
                   head.tenant_id IS NOT NULL AS head_exists,
                   referenced.id IS NOT NULL AS head_reference_matches,
                   NOT EXISTS (
                     SELECT 1
                       FROM audit_events successor
                      WHERE successor.tenant_id = head.tenant_id
                        AND successor.prev_event_hash = head.head_event_hash
                   ) AS head_is_tail
              FROM tenant_counts counts
              LEFT JOIN audit_chain_heads head ON head.tenant_id = counts.tenant_id
              LEFT JOIN audit_events referenced
                ON referenced.tenant_id = head.tenant_id
               AND referenced.id = head.head_event_id
               AND referenced.event_hash = head.head_event_hash
          ),
          index_state AS MATERIALIZED (
            SELECT index_class.relname AS index_name,
                   index_meta.indisunique,
                   index_meta.indisvalid,
                   index_meta.indisready,
                   pg_get_expr(index_meta.indpred, index_meta.indrelid) AS predicate
              FROM pg_index index_meta
              JOIN pg_class index_class ON index_class.oid = index_meta.indexrelid
             WHERE index_class.relname IN (
               'uq_audit_events_one_genesis_per_tenant',
               'uq_audit_events_one_successor_per_predecessor'
             )
          ),
          trigger_state AS MATERIALIZED (
            SELECT trigger.tgenabled,
                   procedure.proname
              FROM pg_trigger trigger
              JOIN pg_proc procedure ON procedure.oid = trigger.tgfoid
             WHERE trigger.tgrelid = 'audit_events'::regclass
               AND trigger.tgname = 'audit_events_advance_chain_head'
               AND NOT trigger.tgisinternal
          )
          SELECT json_build_object(
            'total_events', (SELECT count(*) FROM audit_events),
            'event_tenants', (SELECT count(*) FROM tenant_counts),
            'chain_heads', (SELECT count(*) FROM audit_chain_heads),
            'fork_groups', (SELECT count(*) FROM fork_groups),
            'forked_successor_rows',
              (SELECT coalesce(sum(successor_count), 0) FROM fork_groups),
            'forked_tenants',
              (SELECT coalesce(json_agg(tenant_id ORDER BY tenant_id), '[]'::json)
                 FROM (SELECT DISTINCT tenant_id FROM fork_groups) affected),
            'gap_rows', (SELECT count(*) FROM gaps),
            'gap_tenants',
              (SELECT coalesce(json_agg(tenant_id ORDER BY tenant_id), '[]'::json)
                 FROM (SELECT DISTINCT tenant_id FROM gaps) affected),
            'zero_genesis_tenants',
              (SELECT coalesce(json_agg(tenant_id ORDER BY tenant_id), '[]'::json)
                 FROM tenant_counts WHERE genesis_count = 0),
            'multi_genesis_tenants',
              (SELECT coalesce(json_agg(tenant_id ORDER BY tenant_id), '[]'::json)
                 FROM tenant_counts WHERE genesis_count > 1),
            'missing_head_tenants',
              (SELECT count(*) FROM head_state WHERE NOT head_exists),
            'head_reference_mismatches',
              (SELECT count(*) FROM head_state WHERE NOT head_reference_matches),
            'head_not_tail_tenants',
              (SELECT count(*) FROM head_state WHERE NOT head_is_tail),
            'head_sequence_mismatches',
              (SELECT count(*) FROM head_state WHERE sequence <> event_count),
            'orphan_head_rows',
              (SELECT count(*)
                 FROM audit_chain_heads head
                WHERE NOT EXISTS (
                  SELECT 1 FROM tenant_counts counts WHERE counts.tenant_id = head.tenant_id
                )),
            'invalid_head_indexes',
              (SELECT coalesce(json_agg(index_name ORDER BY index_name), '[]'::json)
                 FROM index_state
                WHERE NOT indisunique OR NOT indisvalid OR NOT indisready),
            'installed_head_indexes',
              (SELECT coalesce(json_agg(
                 json_build_object(
                   'name', index_name,
                   'unique', indisunique,
                   'valid', indisvalid,
                   'ready', indisready,
                   'predicate', predicate
                 ) ORDER BY index_name
               ), '[]'::json) FROM index_state),
            'chain_head_trigger',
              (SELECT coalesce(json_agg(json_build_object(
                 'enabled', tgenabled,
                 'function', proname
               )), '[]'::json) FROM trigger_state)
          );

          RESET transaction_read_only;

          BEGIN;
          CREATE TEMP TABLE audit_chain_enforcement_results (
            check_name TEXT PRIMARY KEY,
            passed BOOLEAN NOT NULL,
            detail TEXT NOT NULL
          ) ON COMMIT DROP;

          INSERT INTO audit_events (
            id, tenant_id, layer, actor, action, inputs, outputs,
            event_hash, prev_event_hash, created_at
          ) VALUES (
            'evt_ops_chain_probe_genesis',
            'tnt_ops_audit_chain_enforcement_probe',
            'audit',
            'agent_ops_preflight',
            'audit.chain.preflight',
            '{}'::jsonb,
            '{}'::jsonb,
            decode(repeat('11', 32), 'hex'),
            NULL,
            clock_timestamp()
          );

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
                FROM audit_chain_heads
               WHERE tenant_id = 'tnt_ops_audit_chain_enforcement_probe'
                 AND head_event_id = 'evt_ops_chain_probe_genesis'
                 AND head_event_hash = decode(repeat('11', 32), 'hex')
                 AND sequence = 1
            ) THEN
              RAISE EXCEPTION 'authoritative head did not initialize at sequence 1';
            END IF;
            INSERT INTO audit_chain_enforcement_results
              VALUES ('head_initialization', true, 'sequence=1');
          END $$;

          DO $$
          DECLARE
            rejected_by TEXT;
          BEGIN
            BEGIN
              INSERT INTO audit_events (
                id, tenant_id, layer, actor, action, inputs, outputs,
                event_hash, prev_event_hash, created_at
              ) VALUES (
                'evt_ops_chain_probe_second_genesis',
                'tnt_ops_audit_chain_enforcement_probe',
                'audit', 'agent_ops_preflight', 'audit.chain.preflight',
                '{}'::jsonb, '{}'::jsonb,
                decode(repeat('22', 32), 'hex'), NULL, clock_timestamp()
              );
              RAISE EXCEPTION 'duplicate genesis was accepted';
            EXCEPTION WHEN unique_violation THEN
              GET STACKED DIAGNOSTICS rejected_by = CONSTRAINT_NAME;
              IF rejected_by <> 'uq_audit_events_one_genesis_per_tenant' THEN
                RAISE;
              END IF;
            END;
            INSERT INTO audit_chain_enforcement_results
              VALUES ('duplicate_genesis_rejected', true, rejected_by);
          END $$;

          INSERT INTO audit_events (
            id, tenant_id, layer, actor, action, inputs, outputs,
            event_hash, prev_event_hash, created_at
          ) VALUES (
            'evt_ops_chain_probe_successor',
            'tnt_ops_audit_chain_enforcement_probe',
            'audit',
            'agent_ops_preflight',
            'audit.chain.preflight',
            '{}'::jsonb,
            '{}'::jsonb,
            decode(repeat('33', 32), 'hex'),
            decode(repeat('11', 32), 'hex'),
            clock_timestamp()
          );

          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
                FROM audit_chain_heads
               WHERE tenant_id = 'tnt_ops_audit_chain_enforcement_probe'
                 AND head_event_id = 'evt_ops_chain_probe_successor'
                 AND head_event_hash = decode(repeat('33', 32), 'hex')
                 AND sequence = 2
            ) THEN
              RAISE EXCEPTION 'authoritative head did not advance to sequence 2';
            END IF;
            INSERT INTO audit_chain_enforcement_results
              VALUES ('head_advancement', true, 'sequence=2');
          END $$;

          DO $$
          DECLARE
            rejected_by TEXT;
          BEGIN
            BEGIN
              INSERT INTO audit_events (
                id, tenant_id, layer, actor, action, inputs, outputs,
                event_hash, prev_event_hash, created_at
              ) VALUES (
                'evt_ops_chain_probe_second_successor',
                'tnt_ops_audit_chain_enforcement_probe',
                'audit', 'agent_ops_preflight', 'audit.chain.preflight',
                '{}'::jsonb, '{}'::jsonb,
                decode(repeat('44', 32), 'hex'),
                decode(repeat('11', 32), 'hex'),
                clock_timestamp()
              );
              RAISE EXCEPTION 'duplicate successor was accepted';
            EXCEPTION WHEN unique_violation THEN
              GET STACKED DIAGNOSTICS rejected_by = CONSTRAINT_NAME;
              IF rejected_by <> 'uq_audit_events_one_successor_per_predecessor' THEN
                RAISE;
              END IF;
            END;
            INSERT INTO audit_chain_enforcement_results
              VALUES ('duplicate_successor_rejected', true, rejected_by);
          END $$;

          DO $$
          BEGIN
            BEGIN
              INSERT INTO audit_events (
                id, tenant_id, layer, actor, action, inputs, outputs,
                event_hash, prev_event_hash, created_at
              ) VALUES (
                'evt_ops_chain_probe_stale_predecessor',
                'tnt_ops_audit_chain_enforcement_probe',
                'audit', 'agent_ops_preflight', 'audit.chain.preflight',
                '{}'::jsonb, '{}'::jsonb,
                decode(repeat('55', 32), 'hex'),
                decode(repeat('66', 32), 'hex'),
                clock_timestamp()
              );
              RAISE EXCEPTION 'stale predecessor was accepted';
            EXCEPTION WHEN check_violation THEN
              IF SQLERRM <> 'audit event predecessor does not match authoritative tenant chain head' THEN
                RAISE;
              END IF;
            END;
            INSERT INTO audit_chain_enforcement_results
              VALUES ('stale_predecessor_rejected', true, 'authoritative head compare-and-swap');
          END $$;

          SELECT json_build_object(
            'enforcement_checks', json_agg(
              json_build_object('name', check_name, 'passed', passed, 'detail', detail)
              ORDER BY check_name
            )
          )
            FROM audit_chain_enforcement_results;
          ROLLBACK;

          SELECT json_build_object(
            'probe_event_rows_after_rollback',
              (SELECT count(*) FROM audit_events
                WHERE tenant_id = 'tnt_ops_audit_chain_enforcement_probe'),
            'probe_head_rows_after_rollback',
              (SELECT count(*) FROM audit_chain_heads
                WHERE tenant_id = 'tnt_ops_audit_chain_enforcement_probe')
          );
          SQL
          REMOTE
