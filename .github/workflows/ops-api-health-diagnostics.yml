name: ops-api-health-diagnostics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target to inspect."
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  diagnose:
    name: api health diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      TARGET: ${{ inputs.target }}
      VM_HOST_STAGING: ${{ secrets.VM_HOST_STAGING }}
      VM_SSH_KEY_STAGING: ${{ secrets.VM_SSH_KEY_STAGING }}
      VM_HOST_PRODUCTION: ${{ secrets.VM_HOST }}
      VM_SSH_KEY_PRODUCTION: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Select target
        shell: bash
        run: |
          case "$TARGET" in
            staging)
              echo "VM_HOST=$VM_HOST_STAGING" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_STAGING"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.staging" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-staging" >> "$GITHUB_ENV"
              ;;
            production)
              echo "VM_HOST=$VM_HOST_PRODUCTION" >> "$GITHUB_ENV"
              {
                echo "VM_SSH_KEY<<EOF"
                echo "$VM_SSH_KEY_PRODUCTION"
                echo "EOF"
              } >> "$GITHUB_ENV"
              echo "VM_ENV_FILE=.env.prod" >> "$GITHUB_ENV"
              echo "COMPOSE_PROJECT=brain-prod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "target must be staging or production"
              exit 1
              ;;
          esac

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Run fixed api diagnostics
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "azureuser@$VM_HOST" \
            "VM_ENV_FILE='$VM_ENV_FILE' COMPOSE_PROJECT='$COMPOSE_PROJECT' bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/brain-core
          compose_files='-f docker-compose.prod.yml'
          [[ -f docker-compose.caddy.yml ]] && compose_files="$compose_files -f docker-compose.caddy.yml"

          echo "::group::api signup env presence"
          if [[ ! -f "$VM_ENV_FILE" ]]; then
            echo "env_file=$VM_ENV_FILE"
            echo "env_file_status=missing"
            exit 1
          fi
          echo "env_file=$VM_ENV_FILE"
          for key in \
            BRAIN_SELF_SERVE_SIGNUP \
            EMAIL_ENDPOINT \
            EMAIL_API_KEY \
            EMAIL_FROM
          do
            line="$(grep -E "^${key}=" "$VM_ENV_FILE" | tail -n 1 || true)"
            if [[ -z "$line" ]]; then
              echo "${key}=missing"
            elif [[ "$line" == "${key}=" ]]; then
              echo "${key}=blank"
            else
              echo "${key}=present"
            fi
          done
          echo "::endgroup::"

          echo "::group::api compose status"
          docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents ps api || true
          echo "::endgroup::"

          echo "::group::api local health"
          curl -sS --max-time 5 http://localhost:3000/health || true
          echo
          echo "::endgroup::"

          echo "::group::three tenant deletion jobs"
          docker exec -i brain-prod-postgres psql -U brain -d brain -AtX \
            -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '30s';
          SET LOCAL lock_timeout = '1s';

          WITH target_deletions(job_id, tenant_id) AS (VALUES
            ('tdel_01M1XSRCC2799C4DWPX6FYG7BH', 'tnt_01M1VDRWWFWR56GGWZ95BJJ1GW'),
            ('tdel_01M1XSRD4FDZ8PGDDQK1D4TJ94', 'tnt_01M1WH52ZYD4HN2F43K3YRNQHM'),
            ('tdel_01M1XSRDZA8VG7AVR8YZWTZ6HR', 'tnt_01M1WH5DKBA1A50Z1G3FTR6YBK')
          )
          SELECT json_build_object(
            'event', 'tenant_deletion_job',
            'job_id', job.id,
            'tenant_id', job.tenant_id,
            'mapping_matches', job.tenant_id = target.tenant_id,
            'status', job.status,
            'expected_rows', job.expected_rows,
            'deleted_rows', job.deleted_rows,
            'total_rows_deleted', job.total_rows_deleted,
            'blob_purge_job_id', job.blob_purge_job_id,
            'blob_artifact_count', job.blob_artifact_count,
            'last_error', job.last_error,
            'created_at', job.created_at,
            'started_at', job.started_at,
            'completed_at', job.completed_at
          )::text
            FROM target_deletions target
            LEFT JOIN tenant_deletion_jobs job ON job.id = target.job_id
           ORDER BY target.job_id;

          WITH target_deletions(job_id, tenant_id) AS (VALUES
            ('tdel_01M1XSRCC2799C4DWPX6FYG7BH', 'tnt_01M1VDRWWFWR56GGWZ95BJJ1GW'),
            ('tdel_01M1XSRD4FDZ8PGDDQK1D4TJ94', 'tnt_01M1WH52ZYD4HN2F43K3YRNQHM'),
            ('tdel_01M1XSRDZA8VG7AVR8YZWTZ6HR', 'tnt_01M1WH5DKBA1A50Z1G3FTR6YBK')
          )
          SELECT json_build_object(
            'event', 'tenant_blob_purge_job',
            'deletion_job_id', deletion.id,
            'purge_job_id', purge.id,
            'tenant_id', purge.tenant_id,
            'status', purge.status,
            'attempts', purge.attempts,
            'blob_artifact_count', purge.blob_artifact_count,
            'deleted_count', purge.deleted_count,
            'legal_hold_paths', purge.legal_hold_paths,
            'last_error', purge.last_error,
            'requested_at', purge.requested_at,
            'completed_at', purge.completed_at
          )::text
            FROM target_deletions target
            JOIN tenant_deletion_jobs deletion ON deletion.id = target.job_id
            LEFT JOIN tenant_blob_purge_jobs purge ON purge.id = deletion.blob_purge_job_id
           ORDER BY target.job_id;

          WITH target_deletions(job_id, tenant_id) AS (VALUES
            ('tdel_01M1XSRCC2799C4DWPX6FYG7BH', 'tnt_01M1VDRWWFWR56GGWZ95BJJ1GW'),
            ('tdel_01M1XSRD4FDZ8PGDDQK1D4TJ94', 'tnt_01M1WH52ZYD4HN2F43K3YRNQHM'),
            ('tdel_01M1XSRDZA8VG7AVR8YZWTZ6HR', 'tnt_01M1WH5DKBA1A50Z1G3FTR6YBK')
          )
          SELECT json_build_object(
            'event', 'tenant_deletion_audit_outbox',
            'deletion_job_id', deletion.id,
            'tenant_id', outbox.tenant_id,
            'action', outbox.action,
            'status', outbox.status,
            'attempts', outbox.attempts,
            'audit_event_id', outbox.audit_event_id,
            'last_error', outbox.last_error,
            'payload', outbox.payload,
            'published_at', outbox.published_at
          )::text
            FROM target_deletions target
            JOIN tenant_deletion_jobs deletion ON deletion.id = target.job_id
            JOIN tenant_blob_purge_audit_outbox outbox
              ON outbox.tenant_id = target.tenant_id
             AND (outbox.job_id IN (deletion.id, deletion.blob_purge_job_id)
                  OR outbox.event_key LIKE deletion.id || ':%')
           ORDER BY target.job_id, outbox.created_at, outbox.id;

          WITH target_deletions(job_id, tenant_id) AS (VALUES
            ('tdel_01M1XSRCC2799C4DWPX6FYG7BH', 'tnt_01M1VDRWWFWR56GGWZ95BJJ1GW'),
            ('tdel_01M1XSRD4FDZ8PGDDQK1D4TJ94', 'tnt_01M1WH52ZYD4HN2F43K3YRNQHM'),
            ('tdel_01M1XSRDZA8VG7AVR8YZWTZ6HR', 'tnt_01M1WH5DKBA1A50Z1G3FTR6YBK')
          )
          SELECT json_build_object(
            'event', 'preserved_audit_events',
            'tenant_id', target.tenant_id,
            'total_preserved', COALESCE(SUM(audit.action_count), 0),
            'actions', COALESCE(
              json_object_agg(audit.action, audit.action_count ORDER BY audit.action)
                FILTER (WHERE audit.action IS NOT NULL),
              '{}'::json
            )
          )::text
            FROM target_deletions target
            LEFT JOIN LATERAL (
              SELECT action, COUNT(*)::integer AS action_count, MIN(id) AS id
                FROM audit_events
               WHERE tenant_id = target.tenant_id
               GROUP BY action
            ) audit ON true
           GROUP BY target.tenant_id
           ORDER BY target.tenant_id;

          WITH target_deletions(job_id, tenant_id) AS (VALUES
            ('tdel_01M1XSRCC2799C4DWPX6FYG7BH', 'tnt_01M1VDRWWFWR56GGWZ95BJJ1GW'),
            ('tdel_01M1XSRD4FDZ8PGDDQK1D4TJ94', 'tnt_01M1WH52ZYD4HN2F43K3YRNQHM'),
            ('tdel_01M1XSRDZA8VG7AVR8YZWTZ6HR', 'tnt_01M1WH5DKBA1A50Z1G3FTR6YBK')
          ),
          job_summary AS (
            SELECT COUNT(job.id)::integer AS found,
                   COUNT(*) FILTER (WHERE job.tenant_id = target.tenant_id)::integer AS mappings,
                   COUNT(*) FILTER (WHERE job.status = 'completed')::integer AS completed,
                   COALESCE(SUM(job.total_rows_deleted), 0)::bigint AS rows_deleted,
                   COALESCE(SUM(job.blob_artifact_count), 0)::integer AS blob_artifacts
              FROM target_deletions target
              LEFT JOIN tenant_deletion_jobs job ON job.id = target.job_id
          ),
          purge_summary AS (
            SELECT COUNT(purge.id)::integer AS found,
                   COUNT(*) FILTER (WHERE purge.status = 'completed')::integer AS completed,
                   COALESCE(SUM(purge.deleted_count), 0)::integer AS deleted,
                   COALESCE(SUM(cardinality(purge.legal_hold_paths)), 0)::integer AS holds_remaining
              FROM target_deletions target
              JOIN tenant_deletion_jobs deletion ON deletion.id = target.job_id
              LEFT JOIN tenant_blob_purge_jobs purge ON purge.id = deletion.blob_purge_job_id
          ),
          tenant_summary AS (
            SELECT COUNT(tenant.id)::integer AS remaining
              FROM target_deletions target
              LEFT JOIN tenants tenant ON tenant.id = target.tenant_id
          ),
          outbox_summary AS (
            SELECT COUNT(*) FILTER (WHERE outbox.status <> 'published')::integer AS unpublished,
                   COUNT(*) FILTER (WHERE outbox.action = 'tenant_blob.legal_hold_release_requested' AND outbox.status = 'published')::integer AS release_requested,
                   COUNT(*) FILTER (WHERE outbox.action = 'tenant_blob.legal_hold_released' AND outbox.status = 'published')::integer AS holds_released,
                   COUNT(*) FILTER (WHERE outbox.action = 'tenant_blob.purge_completed' AND outbox.status = 'published')::integer AS purges_completed,
                   COUNT(*) FILTER (WHERE outbox.action = 'tenant.delete_completed' AND outbox.status = 'published')::integer AS deletions_completed,
                   COUNT(*) FILTER (WHERE outbox.audit_event_id IS NOT NULL AND audit.id IS NULL)::integer AS published_audit_events_missing
              FROM target_deletions target
              JOIN tenant_deletion_jobs deletion ON deletion.id = target.job_id
              JOIN tenant_blob_purge_audit_outbox outbox
                ON outbox.tenant_id = target.tenant_id
               AND (outbox.job_id IN (deletion.id, deletion.blob_purge_job_id)
                    OR outbox.event_key LIKE deletion.id || ':%')
              LEFT JOIN audit_events audit ON audit.id = outbox.audit_event_id
          )
          SELECT json_build_object(
            'event', 'three_tenant_deletion_summary',
            'jobs_found', job_summary.found,
            'job_mappings_matched', job_summary.mappings,
            'jobs_completed', job_summary.completed,
            'total_rows_deleted', job_summary.rows_deleted,
            'blob_artifact_rows', job_summary.blob_artifacts,
            'purge_jobs_found', purge_summary.found,
            'purge_jobs_completed', purge_summary.completed,
            'objects_deleted', purge_summary.deleted,
            'legal_hold_paths_remaining', purge_summary.holds_remaining,
            'tenant_rows_remaining', tenant_summary.remaining,
            'outbox_unpublished', outbox_summary.unpublished,
            'release_requested_events', outbox_summary.release_requested,
            'legal_hold_released_events', outbox_summary.holds_released,
            'purge_completed_events', outbox_summary.purges_completed,
            'delete_completed_events', outbox_summary.deletions_completed,
            'published_audit_events_missing', outbox_summary.published_audit_events_missing,
            'contract_passed', job_summary.found = 3
              AND job_summary.mappings = 3
              AND job_summary.completed = 3
              AND purge_summary.found = 3
              AND purge_summary.completed = 3
              AND purge_summary.holds_remaining = 0
              AND tenant_summary.remaining = 0
              AND outbox_summary.unpublished = 0
              AND outbox_summary.holds_released = 3
              AND outbox_summary.purges_completed = 3
              AND outbox_summary.deletions_completed = 3
              AND outbox_summary.published_audit_events_missing = 0
          )::text
            FROM job_summary, purge_summary, tenant_summary, outbox_summary;

          COMMIT;
          SQL

          minio_evidence="$(docker compose -p "$COMPOSE_PROJECT" \
            --env-file "$VM_ENV_FILE" $compose_files --profile agents \
            run --rm -T --no-deps --entrypoint /bin/sh minio-setup -c '
              set -eu
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null
              checked=0
              remaining=0
              for tenant_id in \
                tnt_01M1VDRWWFWR56GGWZ95BJJ1GW \
                tnt_01M1WH52ZYD4HN2F43K3YRNQHM \
                tnt_01M1WH5DKBA1A50Z1G3FTR6YBK
              do
                versions="$(mc ls --versions --recursive "local/$BLOB_CONTAINER/$tenant_id/" 2>/dev/null || true)"
                if [ -n "$versions" ]; then
                  count="$(printf "%s\n" "$versions" | wc -l | tr -d " ")"
                else
                  count=0
                fi
                checked=$((checked + 1))
                remaining=$((remaining + count))
                printf "minio_tenant=%s remaining_versions_or_markers=%s\n" "$tenant_id" "$count"
              done
              printf "minio_tenants_checked=%s remaining_versions_or_markers=%s\n" "$checked" "$remaining"
              [ "$checked" -eq 3 ] && [ "$remaining" -eq 0 ]
            ')"
          printf '%s\n' "$minio_evidence"
          echo "::endgroup::"

          echo "::group::api redacted logs"
          docker compose -p "$COMPOSE_PROJECT" --env-file "$VM_ENV_FILE" $compose_files --profile agents \
            logs --tail=160 api 2>&1 \
            | sed -E \
                -e 's/(AUTH_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                -e 's/(EMAIL_[A-Z0-9_]*=)[^[:space:]]+/\1[redacted]/g' \
                -e 's/(BRAIN_[A-Z0-9_]*PASSWORD=)[^[:space:]]+/\1[redacted]/g' \
                -e 's#(postgres(ql)?://)[^[:space:]]+#\1[redacted]#g' \
                -e 's#(https?://)[^[:space:]]*(@)#\1[redacted]\2#g' \
            || true
          echo "::endgroup::"
          REMOTE
